name: 🧪 [DOOM] جاهز - اختبار PUT برابط صورة خارجي (صنف واحد + استرجاع)

on:
  workflow_dispatch:
    inputs:
      code:
        description: 'كود جوليب (صنف واحد)'
        required: true
      image_url:
        description: 'رابط صورة خارجي https'
        required: true

concurrency:
  group: doom-jahez-image-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pytz
      - name: Probe
        env:
          JAHEZ_TOKEN: ${{ secrets.JAHEZ_TOKEN }}
          JAHEZ_STORE_ID: ${{ secrets.JAHEZ_STORE_ID }}
          CODE: ${{ inputs.code }}
          IMAGE_URL: ${{ inputs.image_url }}
        run: python silent_run.py jahez_image_url_probe.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          [ -f data/jahez_image_url_probe.json ] || exit 0
          cp data/jahez_image_url_probe.json /tmp/p.json
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/p.json data/jahez_image_url_probe.json
            git add data/jahez_image_url_probe.json
            git diff --cached --quiet && exit 0
            git commit -q -m "🧪 نتيجة اختبار صورة خارجية جاهز [vercel skip]"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
