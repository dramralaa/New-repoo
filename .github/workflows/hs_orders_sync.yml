# 🛵 6 أكتوبر 2026 - سحب طلبات هنجرستيشن (دوم + فيرا) كل ساعة من بوابة الشركاء + مطابقتها بفواتير جوليب
# (طلبات ملغية وأسبابها، طلبات اتسلّمت ومش متسجّلة، فواتير لطلبات ملغية). دخول بالجهاز الموثوق - من غير لابتوب.
name: 🛵 [HS] طلبات هنجرستيشن ومطابقتها (كل ساعة)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: hs-orders-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests cryptography pytz
      - name: Sync
        env:
          HS_PORTAL_USER: ${{ secrets.HS_PORTAL_USER }}
          HS_PORTAL_PASS: ${{ secrets.HS_PORTAL_PASS }}
          JULEB_URL: ${{ secrets.JULEB_URL }}
          JULEB_DB: ${{ secrets.JULEB_DB }}
          JULEB_USER: ${{ secrets.JULEB_USER }}
          JULEB_PASS: ${{ secrets.JULEB_PASS }}
          VERA_URL: ${{ secrets.VERA_URL }}
          VERA_DB: ${{ secrets.VERA_DB }}
          VERA_USER: ${{ secrets.VERA_USER }}
          VERA_PASS: ${{ secrets.VERA_PASS }}
        run: python hs_orders_sync.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          mkdir -p /tmp/s
          for f in data/hs_orders_recon.json data/hs_orders_recon_error.json data/hs_portal_device_*.enc; do [ -f "$f" ] && cp "$f" /tmp/s/; done
          ls /tmp/s/* >/dev/null 2>&1 || exit 0
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/s/* data/ && git add data/hs_orders_recon*.json data/hs_portal_device_*.enc
            git diff --cached --quiet && exit 0
            git commit -q -m "🛵 طلبات هنجرستيشن ومطابقتها"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
