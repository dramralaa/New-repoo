name: 🔧 [DOOM HS] مطابقة أسعار هنجر دوم مع جوليب (يدوي)

on:
  workflow_dispatch:
    inputs:
      dry:
        description: '1 = تخطيط بس بدون كتابة | 0 = تطبيق'
        default: '1'

concurrency:
  group: doom-hs-price-match
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Match prices
        env:
          DRY: ${{ inputs.dry }}
          LOG_GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          HUNGERSTATION_CLIENT_ID: ${{ secrets.HUNGERSTATION_CLIENT_ID }}
          HUNGERSTATION_CLIENT_SECRET: ${{ secrets.HUNGERSTATION_CLIENT_SECRET }}
        run: python silent_run.py hs_price_match_juleb.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          mkdir -p /tmp/keep && cp data/hs_price_match_result.json /tmp/keep/ 2>/dev/null || true
          mkdir -p /tmp/keepc && cp data/hs_catalog_cache/*.json /tmp/keepc/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/keep/* data/ 2>/dev/null || true
            cp /tmp/keepc/*.json data/hs_catalog_cache/ 2>/dev/null || true
            git add data/hs_price_match_result.json data/hs_catalog_cache 2>/dev/null || true
            git diff --cached --quiet && exit 0
            git commit -q -m "🔧 نتيجة مطابقة أسعار هنجر دوم مع جوليب [vercel skip]"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
