# 🔁 16 سبتمبر 2026 - حلقة مزامنة مستقلة تمامًا لجاهز/بيك - نسخة فيرا من
# doom_sync_loop_jahez.yml بالحرف (نفس فلسفة العزل الكاملة بين التكاملات -
# راجع doom_sync_loop_juleb_bridge.yml وقسم "بنية المزامنة المعزولة" في
# PROJECT_CONTEXT.md). بتستبدل vera_jahez_sync.yml (جدولة `schedule:` وحدها -
# أثبتت فجوات حقيقية بالساعات في الممارسة، نفس المشكلة اللي دوم عالجها بالحلقة
# دي بالظبط). كل التزامن على `main` (مصدر الجدولة الحقيقي)، مش أي فرع تطوير.
name: 🔁 [VERA] Sync Loop - Jahez (أسعار/أرصدة)

on:
  workflow_dispatch:
  schedule:
    - cron: '5 */4 * * *'

concurrency:
  group: vera-sync-loop-jahez
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pytz requests
      - name: Continuous sync loop (~5.5 ساعة، بيتجدد ذاتيًا بعدها)
        env:
          VERA_JAHEZ_TOKEN: ${{ secrets.VERA_JAHEZ_TOKEN }}
          VERA_JAHEZ_STORE_ID: ${{ secrets.VERA_JAHEZ_STORE_ID }}
          VERA_JAHEZ_WRITE_ENABLED: ${{ secrets.VERA_JAHEZ_WRITE_ENABLED }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          export GIT_EDITOR=true

          START=$(date +%s)
          DURATION=$((340 * 60))
          ITER=0

          run_with_health() {
            local name="$1" script="$2" timeout_sec="$3"
            local outfile="/tmp/${name}_output.log"
            local code=0
            timeout "$timeout_sec" python "$script" > "$outfile" 2>&1 || code=$?
            if [ $code -eq 0 ]; then
              tail -5 "$outfile"
            else
              echo "⚠️ $name فشل (exit=$code) - آخر 20 سطر من الناتج:"
              tail -20 "$outfile"
            fi
            python sync_health_recorder.py "$name" "$code" "$outfile"
          }

          commit_and_push() {
            git add data/vera_jahez_sync.json data/health/vera_jahez.json 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "لا يوجد تغيير فعلي في هذه الدورة."
              return 0
            fi
            git commit -m "🔁 جاهز فيرا - دورة #$ITER ($(date -u +%H:%M) UTC)"
            for i in 1 2 3 4 5; do
              if timeout 60 git push; then
                echo "✅ Push نجح (دورة $ITER، محاولة $i)"
                return 0
              fi
              echo "⚠️ Push فشل (دورة $ITER، محاولة $i) - إعادة محاولة بعد rebase"
              timeout 60 git fetch origin main
              if ! git rebase origin/main; then
                git checkout --theirs data/vera_jahez_sync.json data/health/vera_jahez.json 2>/dev/null || true
                git add data/vera_jahez_sync.json data/health/vera_jahez.json 2>/dev/null || true
                git rebase --continue || git rebase --abort
              fi
              sleep $((i * 3))
            done
            echo "::error::فشل push دورة $ITER نهائيًا بعد 5 محاولات - هنكمل باقي اللوب برضه"
          }

          while true; do
            ITER=$((ITER + 1))
            echo "════════ جاهز فيرا - دورة رقم $ITER - $(date -u '+%Y-%m-%d %H:%M:%S') UTC ════════"

            run_with_health vera_jahez vera_jahez_sync.py 300

            commit_and_push

            NOW=$(date +%s)
            ELAPSED=$((NOW - START))
            if [ $ELAPSED -ge $DURATION ]; then
              echo "انتهت نافذة الـ~5.5 ساعة (${ITER} دورة) - هيتعمل self-relaunch في الخطوة الجاية."
              break
            fi

            H=$(date -u +%H)
            if [ "$H" -ge 23 ] || [ "$H" -lt 6 ]; then
              SLEEP=7200
            else
              SLEEP=1800
            fi
            REMAINING=$((DURATION - ELAPSED))
            if [ $SLEEP -gt $REMAINING ]; then
              SLEEP=$REMAINING
            fi
            echo "نايم $SLEEP ثانية قبل الدورة الجاية..."
            sleep $SLEEP
          done
      - name: Self-relaunch (بدء نافذة ~5.5 ساعة تانية فورًا)
        if: always()
        run: |
          curl -sS -X POST \
            -H "Authorization: token ${{ secrets.CROSS_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/vera_sync_loop_jahez.yml/dispatches" \
            -d '{"ref":"main"}'
