# 🔁 14 سبتمبر 2026 - حلقة مراقبة تأخير مستقلة تمامًا (راجع
# doom_sync_loop_juleb_bridge.yml لشرح فلسفة العزل الكاملة). مفصولة عمدًا عن كل
# حلقات المزامنة التلاتة (جسر جوليب/جاهز/هنجرستيشن) - عشان لو حلقة مزامنة
# اتعطّلت بالكامل (السيناريو اللي المراقبة أصلاً مصممة تكتشفه)، المراقبة نفسها
# تفضل شغالة وتقدر تنبّه - لو كانت جوّه نفس حلقة أي تكامل، تعطّل التكامل ده كان
# ممكن يوقف المراقبة نفسها معاه.
name: 🔁 [DOOM] Sync Loop - Watchdog (مراقبة تأخير المنصات)

on:
  workflow_dispatch:
  schedule:
    - cron: '50 */4 * * *'

concurrency:
  group: doom-sync-loop-watchdog
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pytz requests
      - name: Continuous watchdog loop (~5.5 ساعة، بيتجدد ذاتيًا بعدها)
        env:
          TELEGRAM_TOKEN_DOOM: ${{ secrets.TELEGRAM_TOKEN_DOOM }}
          TELEGRAM_CHAT_ID_DOOM: ${{ secrets.TELEGRAM_CHAT_ID_DOOM }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          export GIT_EDITOR=true

          START=$(date +%s)
          DURATION=$((340 * 60))
          ITER=0

          commit_and_push() {
            git add data/sync_delay_alert_state.json 2>/dev/null || true
            if git diff --cached --quiet; then
              return 0
            fi
            git commit -m "🔍 مراقبة التأخير - دورة #$ITER ($(date -u +%H:%M) UTC)"
            for i in 1 2 3 4 5; do
              # 🐛 14 سبتمبر 2026 - git push/fetch من غير timeout ممكن يعلّق اللوب كله
              # للأبد على مشكلة شبكة - راجع doom_sync_loop_juleb_bridge.yml.
              if timeout 60 git push; then
                return 0
              fi
              timeout 60 git fetch origin main
              if ! git rebase origin/main; then
                git checkout --theirs data/sync_delay_alert_state.json 2>/dev/null || true
                git add data/sync_delay_alert_state.json
                git rebase --continue || git rebase --abort
              fi
              sleep $((i * 3))
            done
            echo "::error::فشل push حالة التنبيهات نهائيًا بعد 5 محاولات - هنكمل برضه"
          }

          while true; do
            ITER=$((ITER + 1))
            echo "════════ مراقبة - دورة رقم $ITER - $(date -u '+%Y-%m-%d %H:%M:%S') UTC ════════"

            python sync_delay_watchdog.py || true
            commit_and_push

            NOW=$(date +%s)
            ELAPSED=$((NOW - START))
            if [ $ELAPSED -ge $DURATION ]; then
              echo "انتهت نافذة الـ~5.5 ساعة (${ITER} دورة) - هيتعمل self-relaunch في الخطوة الجاية."
              break
            fi

            SLEEP=900   # كل 15 دقيقة - المراقبة خفيفة (قراءة ملفات فقط)، تكرارها أسرع من المزامنة نفسها آمن ومفيد
            REMAINING=$((DURATION - ELAPSED))
            if [ $SLEEP -gt $REMAINING ]; then
              SLEEP=$REMAINING
            fi
            echo "نايم $SLEEP ثانية قبل الدورة الجاية..."
            sleep $SLEEP
          done
      - name: Self-relaunch (بدء نافذة ~5.5 ساعة تانية فورًا)
        if: always()
        run: |
          curl -sS -X POST \
            -H "Authorization: token ${{ secrets.CROSS_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/doom_sync_loop_watchdog.yml/dispatches" \
            -d '{"ref":"main"}'
