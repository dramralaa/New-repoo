# Diagnoses whether the Partner API GET has been reading the wrong/legacy
# chain object all along, by comparing baseline vs global-entity-id: HS_SA
# and checking for known real active numeric Juleb SKUs seen directly in
# the Store Management UI.
name: HS Partner API Chain Diagnostic (manual, read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Run chain diagnostic
        env:
          HUNGERSTATION_CLIENT_ID: ${{ secrets.HUNGERSTATION_CLIENT_ID }}
          HUNGERSTATION_CLIENT_SECRET: ${{ secrets.HUNGERSTATION_CLIENT_SECRET }}
        run: python hungerstation_partner_chain_diagnostic.py
