name: HS Auto Sync (token-triggered)

on:
  repository_dispatch:
    types: [hs_token_captured]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Load token from event file (masked - never printed)
        run: |
          T=$(jq -r '.inputs.token // .inputs.hs_token // .client_payload.token // empty' "$GITHUB_EVENT_PATH")
          if [ -n "$T" ]; then echo "::add-mask::$T"; echo "HS_TOKEN=$T" >> "$GITHUB_ENV"; fi
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Fetch webhook config (proof the auto-triggered pipeline works)
        env:
          LOG_GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: python silent_run.py hungerstation_fetch_webhook_config.py
      - name: Commit redacted summary
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hungerstation_webhook_config_redacted.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Auto sync: webhook config (token-triggered) [vercel skip]"
          git push https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git HEAD:main
