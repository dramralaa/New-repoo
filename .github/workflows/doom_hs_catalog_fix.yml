name: HS Catalog Fix (manual)

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Optional - leave empty: the server logs in by itself (trusted device)'
        required: false
      vendor_id:
        description: 'HungerStation platformVendorId'
        required: true
      mode:
        description: 'plan | relink | delete | delete_oldcode | followup'
        required: true
        default: 'plan'
      limit:
        description: 'Max items to change in this run'
        required: false
        default: '100000'

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Load token from event file (masked - never printed)
        run: |
          T=$(jq -r '.inputs.token // .inputs.hs_token // .client_payload.token // empty' "$GITHUB_EVENT_PATH")
          if [ -n "$T" ]; then echo "::add-mask::$T"; echo "HS_TOKEN=$T" >> "$GITHUB_ENV"; fi
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pytz
      - name: Server portal session (no browser token needed)
        if: env.HS_TOKEN == ''
        env:
          HS_PORTAL_USER: ${{ secrets.HS_PORTAL_USER }}
          HS_PORTAL_PASS: ${{ secrets.HS_PORTAL_PASS }}
          VERA_HS_PORTAL_USER: ${{ secrets.VERA_HS_PORTAL_USER }}
          VERA_HS_PORTAL_PASS: ${{ secrets.VERA_HS_PORTAL_PASS }}
          HS_ACCOUNT: DOOM
        run: |
          pip install -q cryptography
          python - <<'PY'
          import os, hs_portal_session as s
          t = s.session(os.environ["HS_ACCOUNT"])
          if not t:
              raise SystemExit("server login to the HS portal failed - run hs_portal_bootstrap (check)")
          a = t["access_token"]
          print("::add-mask::" + a)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("HS_TOKEN=" + a + "\n")
          print("server session ok")
          PY
      - name: Run
        env:
          HS_VENDOR_ID: ${{ github.event.inputs.vendor_id }}
          MODE: ${{ github.event.inputs.mode }}
          LIMIT: ${{ github.event.inputs.limit }}
          AUDIT_BRAND: DOOM
          GITHUB_IMAGES_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: python doom_hs_catalog_fix.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          mkdir -p /tmp/out
          for f in data/doom_hs_catalog_fix_*_${{ github.event.inputs.vendor_id }}.json data/doom_hs_deleted_old_master_${{ github.event.inputs.vendor_id }}.json; do [ -f "$f" ] && cp "$f" /tmp/out/; done
          ls -la /tmp/out
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            for f in /tmp/out/*.json; do [ -f "$f" ] && cp "$f" data/ && git add "data/$(basename "$f")"; done
            if git diff --cached --quiet; then exit 0; fi
            git commit -q -m "HS catalog fix result [vercel skip]"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
