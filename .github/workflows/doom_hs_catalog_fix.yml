# HS catalog fix (manual). Token is a short-lived workflow_dispatch input, never stored.
name: HS Catalog Fix (manual)

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Live Bearer token from partner-app.hungerstation.com (short-lived, not stored)'
        required: true
      vendor_id:
        description: 'HungerStation platformVendorId'
        required: true
      mode:
        description: 'plan | relink | delete'
        required: true
        default: 'plan'
      limit:
        description: 'Max items to change in this run'
        required: false
        default: '100000'

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pytz
      - name: Run
        env:
          HS_TOKEN: ${{ github.event.inputs.token }}
          HS_VENDOR_ID: ${{ github.event.inputs.vendor_id }}
          MODE: ${{ github.event.inputs.mode }}
          LIMIT: ${{ github.event.inputs.limit }}
          AUDIT_BRAND: DOOM
        run: python doom_hs_catalog_fix.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          mkdir -p /tmp/out && cp data/doom_hs_catalog_fix*.json data/doom_hs_deleted_old_master*.json /tmp/out/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/out/*.json data/ 2>/dev/null || true
            git add data/doom_hs_catalog_fix*.json data/doom_hs_deleted_old_master*.json 2>/dev/null || true
            if git diff --cached --quiet; then exit 0; fi
            git commit -q -m "HS catalog fix result"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
