name: 🔒 [HS] إيقاف تفعيل أصناف على فرع هنجر (يدوي)

on:
  workflow_dispatch:
    inputs:
      vendor:
        description: 'vendor id (مثال 198120 = دوم 4)'
        required: true
      skus:
        description: 'SKUs بفاصلة'
        required: true
      dry:
        description: '1 = تخطيط بس | 0 = تطبيق'
        default: '1'

concurrency:
  group: doom-hs-deactivate
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Deactivate
        env:
          VENDOR: ${{ inputs.vendor }}
          SKUS: ${{ inputs.skus }}
          DRY: ${{ inputs.dry }}
          LOG_GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          HUNGERSTATION_CLIENT_ID: ${{ secrets.HUNGERSTATION_CLIENT_ID }}
          HUNGERSTATION_CLIENT_SECRET: ${{ secrets.HUNGERSTATION_CLIENT_SECRET }}
        run: python silent_run.py hs_deactivate_skus.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          mkdir -p /tmp/keep && cp data/hs_deactivate_result.json /tmp/keep/ 2>/dev/null || true
          mkdir -p /tmp/keepc && cp data/hs_catalog_cache/*.json /tmp/keepc/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/keep/* data/ 2>/dev/null || true
            cp /tmp/keepc/*.json data/hs_catalog_cache/ 2>/dev/null || true
            git add data/hs_deactivate_result.json data/hs_catalog_cache 2>/dev/null || true
            git diff --cached --quiet && exit 0
            git commit -q -m "🔒 نتيجة إيقاف تفعيل أصناف على فرع هنجر [vercel skip]"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
