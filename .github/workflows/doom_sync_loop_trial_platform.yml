# 🔁 14 سبتمبر 2026 - حلقة مزامنة مستقلة تمامًا لصفحة دوم التجريبية (فرع
# Streamlit Cloud منفصل: claude/assortment-webhook-discovery-a4mxc6) - راجع
# doom_sync_loop_juleb_bridge.yml لشرح فلسفة العزل الكاملة بين التكاملات.
# مسؤوليتها الوحيدة: دمج main في فرع المنصة كل دورة (بديل doom_trial_report_branch_sync.yml
# غير الموثوق - راجع PROJECT_CONTEXT.md لتفاصيل اكتشاف السبب: فجوة حقيقية 9
# ساعات و20 دقيقة في جدولة GitHub schedule).
#
# 🔀 16 سبتمبر 2026 - بناء الكاش اليومي (cache_builder.py) اتفصل عن الحلقة دي
# بالكامل ونقل لـ doom_daily_cache_guaranteed.yml (جدولة مباشرة قريب من منتصف
# ليل الرياض، مستقلة تمامًا عن صحة الحلقة دي وعن self-relaunch). السبب: صاحب
# المشروع طلب ضمان صريح إن الكاش يتحدث بحد أقصى 00:30 وميتأخرش عن 01:00 بتوقيت
# الرياض - الاعتماد على تشيك كل 10 دقايق جوه حلقة بتتجدد ذاتيًا كل ~5.5 ساعة
# مايضمنش ده: لو الـ self-relaunch فشل (طلب curl ماتأكدش نجاحه) بالظبط قبل
# منتصف الليل، أقرب فرصة تانية كانت جدولة fallback هذه الحلقة نفسها (`40 */4 * * *`
# UTC = 03:40 بتوقيت الرياض) - بعد الديدلاين بساعتين وأربعين دقيقة. فصل المسؤولية
# لـworkflow مخصص وقصير (يبدأ ويخلص، مش حلقة طويلة) بجدولة UTC مباشرة قريبة من
# 00:00 الرياض بيشيل الاعتماد على استمرارية الحلقة دي خالص.
#
# 🐛 14 سبتمبر 2026 (بعد ساعات من النشر) - **باج حقيقي في أول نسخة**: checkout
# الفرع هنا كان بدون `fetch-depth: 0` (الافتراضي = شبيه سطحي، آخر كوميت بس) -
# أي `git merge origin/main` بعد كده كان بيفشل بـ"refusing to merge unrelated
# histories" (git مايشوفش تاريخ مشترك حقيقي في نسخة سطحية) - **نفس الخطأ
# بالحرف اللي ظهر قبل كده في الحلقة المشتركة القديمة** (doom_continuous_sync_loop.yml
# كانت عندها نفس الباج). النتيجة: المنصة التجريبية فضلت واقفة على بيانات
# الأمس رغم كل الإصلاحات التانية شغالة صح (main نفسه كان محدَّث). الحل: إضافة
# `fetch-depth: 0` (نفس القيمة المستخدمة في doom_trial_report_branch_sync.yml
# الأصلي اللي كان بينجح في الدمج فعليًا) - **هذا هو الباج الحقيقي الوحيد في
# البنية الجديدة، مش مشكلة موثوقية تانية**.
name: 🔁 [DOOM] Sync Loop - Trial Platform (دمج main)

on:
  workflow_dispatch:
  schedule:
    - cron: '40 */4 * * *'

concurrency:
  group: doom-sync-loop-trial-platform
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout doom_trial_report (فرع منفصل)
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          ref: claude/assortment-webhook-discovery-a4mxc6
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          fetch-depth: 0
      - name: Continuous sync loop (~5.5 ساعة، بيتجدد ذاتيًا بعدها)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          export GIT_EDITOR=true

          START=$(date +%s)
          DURATION=$((340 * 60))
          ITER=0

          sync_with_main() {
            # 🐛 14 سبتمبر 2026 - git fetch/push من غير timeout ممكن يعلّق اللوب كله
            # للأبد على مشكلة شبكة (اكتُشف حي: حلقتي جسر جوليب وجاهز توقفوا 4.5 ساعة+
            # بالظبط لهذا السبب - راجع PROJECT_CONTEXT.md).
            timeout 60 git fetch origin main
            if ! git merge origin/main --no-edit -m "🔄 دمج main تلقائي (تحديث بيانات منصة MPC)"; then
              # فرع MPC هو فرع نشر فقط؛ main هو المصدر المعتمد للبيانات والكود.
              # حل التعارض هنا يمنع بقاء المنصة على بيانات قديمة إلى ما لا نهاية.
              echo "⚠️ تعارض دمج - إعادة المحاولة مع اعتماد نسخة main للملفات المتعارضة"
              git merge --abort || true
              if ! git merge -X theirs origin/main --no-edit -m "🔄 استعادة تطابق منصة MPC مع main"; then
                echo "::error::فشل دمج main في فرع MPC حتى بعد حل التعارض"
                git merge --abort || true
                return 1
              fi
            fi
            for i in 1 2 3; do
              if timeout 60 git push origin claude/assortment-webhook-discovery-a4mxc6; then
                echo "✅ دمج main نجح ودُفع بنجاح (محاولة $i)"
                return 0
              fi
              echo "⚠️ فشل push دمج main (محاولة $i) - إعادة محاولة"
              timeout 60 git fetch origin claude/assortment-webhook-discovery-a4mxc6
              git merge origin/claude/assortment-webhook-discovery-a4mxc6 --no-edit || true
              sleep $((i * 3))
            done
            echo "::error::فشل push دمج main نهائيًا بعد 3 محاولات - هنحاول تاني الدورة الجاية"
          }

          while true; do
            ITER=$((ITER + 1))
            echo "════════ منصة دوم التجريبية - دورة رقم $ITER - $(date -u '+%Y-%m-%d %H:%M:%S') UTC ════════"

            sync_with_main

            NOW=$(date +%s)
            ELAPSED=$((NOW - START))
            if [ $ELAPSED -ge $DURATION ]; then
              echo "انتهت نافذة الـ~5.5 ساعة (${ITER} دورة) - هيتعمل self-relaunch في الخطوة الجاية."
              break
            fi

            SLEEP=600   # كل 10 دقايق - دمج main خفيف وسريع، والمنصة محتاجة تفضل قريبة من main دايمًا
            REMAINING=$((DURATION - ELAPSED))
            if [ $SLEEP -gt $REMAINING ]; then
              SLEEP=$REMAINING
            fi
            echo "نايم $SLEEP ثانية قبل الدورة الجاية..."
            sleep $SLEEP
          done
      - name: Self-relaunch (بدء نافذة ~5.5 ساعة تانية فورًا)
        if: always()
        run: |
          curl -sS -X POST \
            -H "Authorization: token ${{ secrets.CROSS_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/doom_sync_loop_trial_platform.yml/dispatches" \
            -d '{"ref":"main"}'
