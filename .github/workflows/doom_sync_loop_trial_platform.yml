name: 🔁 [DOOM] Sync Loop - Trial Platform (دمج main)

on:
  workflow_dispatch:
  schedule:
    - cron: '40 * * * *'

concurrency:
  group: doom-sync-loop-trial-platform
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout doom_trial_report (فرع منفصل)
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          ref: claude/assortment-webhook-discovery-a4mxc6
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          fetch-depth: 0
      - name: Continuous sync loop (~5.5 ساعة، بيتجدد ذاتيًا بعدها)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          export GIT_EDITOR=true

          START=$(date +%s)
          DURATION=$((340 * 60))
          ITER=0

          sync_with_main() {
            timeout 60 git fetch origin main
            if ! git merge origin/main --no-edit -m "🔄 دمج main تلقائي (تحديث بيانات منصة MPC)"; then
              echo "⚠️ تعارض دمج - إعادة المحاولة مع اعتماد نسخة main للملفات المتعارضة"
              git merge --abort || true
              if ! git merge -X theirs origin/main --no-edit -m "🔄 استعادة تطابق منصة MPC مع main"; then
                echo "::error::فشل دمج main في فرع MPC حتى بعد حل التعارض"
                git merge --abort || true
                return 1
              fi
            fi
            for i in 1 2 3; do
              if timeout 60 git push origin claude/assortment-webhook-discovery-a4mxc6; then
                echo "✅ دمج main نجح ودُفع بنجاح (محاولة $i)"
                return 0
              fi
              echo "⚠️ فشل push دمج main (محاولة $i) - إعادة محاولة"
              timeout 60 git fetch origin claude/assortment-webhook-discovery-a4mxc6
              git merge origin/claude/assortment-webhook-discovery-a4mxc6 --no-edit || true
              sleep $((i * 3))
            done
            echo "::error::فشل push دمج main نهائيًا بعد 3 محاولات - هنحاول تاني الدورة الجاية"
          }

          while true; do
            ITER=$((ITER + 1))
            echo "════════ منصة دوم التجريبية - دورة رقم $ITER - $(date -u '+%Y-%m-%d %H:%M:%S') UTC ════════"

            sync_with_main || true

            NOW=$(date +%s)
            ELAPSED=$((NOW - START))
            if [ $ELAPSED -ge $DURATION ]; then
              echo "انتهت نافذة الـ~5.5 ساعة (${ITER} دورة) - هيتعمل self-relaunch في الخطوة الجاية."
              break
            fi

            H=$((10#$(TZ=Asia/Riyadh date +%H)))
            if [ $H -ge 10 ] || [ $H -lt 1 ]; then
              SLEEP=600
            else
              SLEEP=1800
              UNTIL10=$(( (10 - H) * 3600 - 10#$(TZ=Asia/Riyadh date +%M) * 60 - 10#$(date +%S) ))
              [ $UNTIL10 -lt 60 ] && UNTIL10=60
              [ $SLEEP -gt $UNTIL10 ] && SLEEP=$UNTIL10   # ما نتخطاش الساعة 10 (بداية التحديث كل 10 دقايق)
            fi
            REMAINING=$((DURATION - ELAPSED))
            if [ $SLEEP -gt $REMAINING ]; then
              SLEEP=$REMAINING
            fi
            echo "نايم $SLEEP ثانية قبل الدورة الجاية..."
            sleep $SLEEP
          done
      - name: Self-relaunch (بدء نافذة ~5.5 ساعة تانية فورًا)
        if: always()
        run: |
          curl -sS -X POST \
            -H "Authorization: token ${{ secrets.CROSS_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/doom_sync_loop_trial_platform.yml/dispatches" \
            -d '{"ref":"main"}'
