# 🔁 14 سبتمبر 2026 - حلقة مزامنة مستقلة تمامًا لصفحة دوم التجريبية (فرع
# Streamlit Cloud منفصل: claude/assortment-webhook-discovery-a4mxc6) - راجع
# doom_sync_loop_juleb_bridge.yml لشرح فلسفة العزل الكاملة بين التكاملات.
# مسؤوليتها: (1) دمج main في فرع المنصة كل دورة (بديل doom_trial_report_branch_sync.yml
# غير الموثوق - راجع PROJECT_CONTEXT.md لتفاصيل اكتشاف السبب: فجوة حقيقية 9
# ساعات و20 دقيقة في جدولة GitHub schedule)، و(2) بناء الكاش اليومي للتقارير
# الخمس الثقيلة مرة واحدة كل يوم رياضي (cache_builder.py).
#
# 🐛 14 سبتمبر 2026 (بعد ساعات من النشر) - **باج حقيقي في أول نسخة**: checkout
# الفرع هنا كان بدون `fetch-depth: 0` (الافتراضي = شبيه سطحي، آخر كوميت بس) -
# أي `git merge origin/main` بعد كده كان بيفشل بـ"refusing to merge unrelated
# histories" (git مايشوفش تاريخ مشترك حقيقي في نسخة سطحية) - **نفس الخطأ
# بالحرف اللي ظهر قبل كده في الحلقة المشتركة القديمة** (doom_continuous_sync_loop.yml
# كانت عندها نفس الباج). النتيجة: المنصة التجريبية فضلت واقفة على بيانات
# الأمس رغم كل الإصلاحات التانية شغالة صح (main نفسه كان محدَّث). الحل: إضافة
# `fetch-depth: 0` (نفس القيمة المستخدمة في doom_trial_report_branch_sync.yml
# الأصلي اللي كان بينجح في الدمج فعليًا) - **هذا هو الباج الحقيقي الوحيد في
# البنية الجديدة، مش مشكلة موثوقية تانية**.
name: 🔁 [DOOM] Sync Loop - Trial Platform (دمج main + كاش يومي)

on:
  workflow_dispatch:
  schedule:
    - cron: '40 */4 * * *'

concurrency:
  group: doom-sync-loop-trial-platform
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout doom_trial_report (فرع منفصل)
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          ref: claude/assortment-webhook-discovery-a4mxc6
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pytz requests
      - name: Continuous sync loop (~5.5 ساعة، بيتجدد ذاتيًا بعدها)
        env:
          JULEB_URL_DOOM: ${{ secrets.JULEB_URL }}
          JULEB_DB_DOOM: ${{ secrets.JULEB_DB }}
          JULEB_USER_DOOM: ${{ secrets.JULEB_USER }}
          JULEB_PASS_DOOM: ${{ secrets.JULEB_PASS }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          export GIT_EDITOR=true

          START=$(date +%s)
          DURATION=$((340 * 60))
          ITER=0

          sync_with_main() {
            git fetch origin main
            if ! git merge origin/main --no-edit -m "🔄 دمج main تلقائي (تحديث بيانات الداشبورد التجريبي)"; then
              echo "⚠️ تعارض دمج حقيقي بين main وفرع دوم التجريبية (غير متوقع حسب التصميم) - إلغاء والمحاولة تاني الدورة الجاية"
              git merge --abort || true
              return 0
            fi
            for i in 1 2 3; do
              if git push origin claude/assortment-webhook-discovery-a4mxc6; then
                echo "✅ دمج main نجح ودُفع بنجاح (محاولة $i)"
                return 0
              fi
              echo "⚠️ فشل push دمج main (محاولة $i) - إعادة محاولة"
              git fetch origin claude/assortment-webhook-discovery-a4mxc6
              git merge origin/claude/assortment-webhook-discovery-a4mxc6 --no-edit || true
              sleep $((i * 3))
            done
            echo "::error::فشل push دمج main نهائيًا بعد 3 محاولات - هنحاول تاني الدورة الجاية"
          }

          build_cache_once_daily() {
            local today_riyadh
            today_riyadh=$(TZ=Asia/Riyadh date +%F)
            local marker="doom_trial_report/data_cache/.last_build_date"
            if [ -f "$marker" ] && [ "$(cat "$marker")" = "$today_riyadh" ]; then
              echo "كاش صفحة دوم التجريبية اتبنى خلاص النهاردة ($today_riyadh) - تخطي."
              return 0
            fi
            echo "🗄️ بناء كاش صفحة دوم التجريبية اليومي ($today_riyadh)..."
            local outfile="/tmp/trial_cache_output.log"
            (cd doom_trial_report && timeout 300 python cache_builder.py) > "$outfile" 2>&1
            local code=$?
            if [ $code -ne 0 ]; then
              echo "⚠️ فشل بناء كاش صفحة دوم التجريبية (exit=$code) - آخر 30 سطر:"
              tail -30 "$outfile"
              return 0
            fi
            tail -10 "$outfile"
            echo "$today_riyadh" > "$marker"
            git add doom_trial_report/data_cache/*.json doom_trial_report/data_cache/.last_build_date 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "لا يوجد تغيير فعلي في كاش صفحة دوم التجريبية هذه الدورة."
              return 0
            fi
            git commit -m "🗄️ تحديث الكاش اليومي لتقارير صفحة دوم التجريبية ($today_riyadh)"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "✅ Push كاش دوم التجريبية نجح (محاولة $i)"
                return 0
              fi
              echo "⚠️ Push كاش دوم التجريبية فشل (محاولة $i) - إعادة محاولة بعد rebase"
              git fetch origin claude/assortment-webhook-discovery-a4mxc6
              if ! git rebase origin/claude/assortment-webhook-discovery-a4mxc6; then
                # 🐛 14 سبتمبر 2026 - نفس المبدأ الموثّق في doom_sync_loop_hungerstation.yml:
                # هذه الحلقة الوحيدة اللي بتكتب ملفات الكاش دي، فالنسخة المحلية الطازجة
                # (--theirs في rebase = الكوميت المحلي) صحيحة دايمًا - نطبّقها على ملفات
                # الكاش الفعلية كمان، مش بس ملف العلامة.
                git checkout --theirs doom_trial_report/data_cache/.last_build_date doom_trial_report/data_cache/*.json 2>/dev/null || true
                git add doom_trial_report/data_cache/.last_build_date doom_trial_report/data_cache/*.json 2>/dev/null || true
                git rebase --continue || git rebase --abort
              fi
              sleep $((i * 3))
            done
            echo "::error::فشل push كاش دوم التجريبية نهائيًا بعد 5 محاولات - هنحاول تاني الدورة الجاية"
          }

          while true; do
            ITER=$((ITER + 1))
            echo "════════ منصة دوم التجريبية - دورة رقم $ITER - $(date -u '+%Y-%m-%d %H:%M:%S') UTC ════════"

            sync_with_main
            build_cache_once_daily

            NOW=$(date +%s)
            ELAPSED=$((NOW - START))
            if [ $ELAPSED -ge $DURATION ]; then
              echo "انتهت نافذة الـ~5.5 ساعة (${ITER} دورة) - هيتعمل self-relaunch في الخطوة الجاية."
              break
            fi

            SLEEP=600   # كل 10 دقايق - دمج main خفيف وسريع، والمنصة محتاجة تفضل قريبة من main دايمًا
            REMAINING=$((DURATION - ELAPSED))
            if [ $SLEEP -gt $REMAINING ]; then
              SLEEP=$REMAINING
            fi
            echo "نايم $SLEEP ثانية قبل الدورة الجاية..."
            sleep $SLEEP
          done
      - name: Self-relaunch (بدء نافذة ~5.5 ساعة تانية فورًا)
        if: always()
        run: |
          curl -sS -X POST \
            -H "Authorization: token ${{ secrets.CROSS_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/doom_sync_loop_trial_platform.yml/dispatches" \
            -d '{"ref":"main"}'
