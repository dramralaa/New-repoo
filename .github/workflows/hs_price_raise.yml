name: 💲 [HS] رفع أسعار أصناف أقل من سعر جوليب (يدوي، plan/apply)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan = يكتب الخطة بس | apply = يرفع الأسعار فعليًا'
        required: true
        default: 'plan'
      confirm:
        description: 'للـapply اكتب RAISE'
        required: false
        default: ''

concurrency:
  group: hs-price-raise
  cancel-in-progress: false

jobs:
  raise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: تأكيد
        if: github.event.inputs.mode == 'apply' && github.event.inputs.confirm != 'RAISE'
        run: |
          echo "للتنفيذ الفعلي اكتب RAISE"
          exit 1
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Raise
        env:
          MODE: ${{ github.event.inputs.mode }}
          LOG_GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          HUNGERSTATION_CLIENT_ID: ${{ secrets.HUNGERSTATION_CLIENT_ID }}
          HUNGERSTATION_CLIENT_SECRET: ${{ secrets.HUNGERSTATION_CLIENT_SECRET }}
          HS_CHAIN_ID: ${{ secrets.HS_CHAIN_ID }}
          VERA_HUNGERSTATION_CLIENT_ID: ${{ secrets.VERA_HUNGERSTATION_CLIENT_ID }}
          VERA_HUNGERSTATION_CLIENT_SECRET: ${{ secrets.VERA_HUNGERSTATION_CLIENT_SECRET }}
          VERA_HS_CHAIN_ID: ${{ secrets.VERA_HS_CHAIN_ID }}
        run: python silent_run.py hs_price_raise.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          mkdir -p /tmp/keep && cp data/hs_price_raise_result.json /tmp/keep/ 2>/dev/null || true
          mkdir -p /tmp/keepc && cp data/hs_catalog_cache/*.json /tmp/keepc/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/keep/* data/ 2>/dev/null || true
            cp /tmp/keepc/*.json data/hs_catalog_cache/ 2>/dev/null || true
            git add data/hs_price_raise_result.json data/hs_catalog_cache 2>/dev/null || true
            git diff --cached --quiet && exit 0
            git commit -q -m "💲 نتيجة رفع أسعار هنجر [vercel skip]"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
