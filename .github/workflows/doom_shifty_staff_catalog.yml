name: workflow-doom_shifty_staff_catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '40 21 * * 5'

concurrency:
  group: doom-shifty-staff-catalog
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests cryptography pandas pytz
      - name: Push staff catalog to Shifty
        env:
          HS_PORTAL_PASS: ${{ secrets.HS_PORTAL_PASS }}
          JULEB_URL: ${{ secrets.JULEB_URL }}
          JULEB_DB: ${{ secrets.JULEB_DB }}
          JULEB_USER: ${{ secrets.JULEB_USER }}
          JULEB_PASS: ${{ secrets.JULEB_PASS }}
        run: python shifty_staff_catalog_push.py
