name: 📊 [DOOM] Dashboard Data Sync

# 16 نوفمبر 2026: اتحوّل للمخزن (dashboard_daily_from_store.py، صفر طلبات لجوليب). يدوي لحد ما أرقامه تتأكد، بعدها نرجّع الجدولة.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan = يطبع بس | apply = يحدّث docs/dashboard_data.json'
        default: 'plan'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pytz
      - run: pip install requests
      - name: Daily rows from store
        env:
          MODE: ${{ inputs.mode }}
          STORE_GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: python dashboard_daily_from_store.py
      - name: Commit & Push
        run: |
          git config user.name "Juleb Bot"
          git config user.email "bot@juleb.local"
          git add docs/dashboard_data.json
          git diff --staged --quiet || git commit -m "📊 تحديث بيانات الداشبورد التلقائي"
          git pull --rebase -q
          git push
