name: 📊 [DOOM] Dashboard Data Sync

# 16 نوفمبر 2026: اتحوّل للمخزن (dashboard_daily_from_store.py، صفر طلبات لجوليب).
# 18 نوفمبر 2026: رجّعنا الجدولة كل ساعة (شكوى مديري دوم: مبيعات الشهر واقفة عند 14/11 لأن التحديث كان يدوي وآخر تشغيل 16/11).
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan = يطبع بس | apply = يحدّث docs/dashboard_data.json'
        default: 'plan'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pytz
      - run: pip install requests
      - name: Daily rows from store
        env:
          MODE: ${{ inputs.mode || 'apply' }}
          STORE_GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: python dashboard_daily_from_store.py
      - name: Commit & Push
        run: |
          git config user.name "Juleb Bot"
          git config user.email "bot@juleb.local"
          F=docs/dashboard_data.json
          cp "$F" /tmp/dd.json
          # 19 نوفمبر: الدفع كان بيفشل (non-fast-forward) لما دفعة تانية تسبقه - نعيد على آخر main بدل rebase
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/dd.json "$F" && git add "$F"
            git diff --cached --quiet && exit 0
            git commit -q -m "📊 تحديث بيانات الداشبورد التلقائي"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 4))
          done
          exit 1
