# 🔎 10 نوفمبر 2026 - جولة المسارات الأخيرة (قراءة فقط، 3 GET لدوم) - بيكتب data/path_probe3.json.
name: 🔎 جولة المسارات الأخيرة

on:
  workflow_dispatch:

concurrency:
  group: juleb-openapi
  cancel-in-progress: false

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Diff
        env:
          PLATFORM_PAUSE: ${{ vars.PLATFORM_PAUSE }}
          KEY_DOOM: ${{ secrets.JULEB_API_KEY_DOOM }}
          KEY_VERA: ${{ secrets.JULEB_API_KEY_VERA }}
        run: python juleb_path_probe3.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          [ -f data/path_probe3.json ] || exit 0
          mkdir -p /tmp/out && cp data/path_probe3.json /tmp/out/
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/out/path_probe3.json data/
            git add data/path_probe3.json
            git diff --cached --quiet && exit 0
            git commit -q -m "🔎 جولة المسارات الأخيرة [vercel skip]"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
