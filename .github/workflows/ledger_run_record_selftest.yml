# 🧪 اختبار ذاتي لخطوة «سجل تشغيل الدفتر» (يدوي فقط): بيحاكي تشغيلة ناجحة أو فاشلة (بدون أي اتصال بجوليب ولا المنصات)
# وبيكتب سطر في data/ledger_run_log_selftest.json في الريبو الخاص (ملف اختبار منفصل عن السجل الحقيقي) عشان نتحقق إن التسجيل بيشتغل في الحالتين.
name: 🧪 اختبار ذاتي - سجل تشغيل الدفتر

on:
  workflow_dispatch:
    inputs:
      simulate:
        description: 'success أو failure'
        required: true
        default: 'success'

concurrency:
  group: ledger-run-record-selftest
  cancel-in-progress: false

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Simulate run
        env:
          SIM: ${{ github.event.inputs.simulate }}
        run: |
          echo "محاكاة: $SIM"
          [ "$SIM" = "failure" ] && exit 1
          exit 0
      - name: Record run (private, status only)
        if: always()
        continue-on-error: true
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_EVENT: ${{ github.event_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          JOB_STATUS: ${{ job.status }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            python - <<'PY'
          import datetime, json, os
          p = "data/ledger_run_log_selftest.json"
          try:
              d = json.load(open(p, encoding="utf-8"))
          except Exception:
              d = []
          d.append({"at_utc": datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S"), "run_id": os.environ["RUN_ID"], "event": os.environ["RUN_EVENT"],
                    "attempt": os.environ["RUN_ATTEMPT"], "job_status": os.environ["JOB_STATUS"]})
          json.dump(d[-300:], open(p, "w", encoding="utf-8"), ensure_ascii=False)
          PY
            git add data/ledger_run_log_selftest.json
            git diff --cached --quiet && exit 0
            git commit -q -m "🧪 اختبار ذاتي سجل الدفتر [vercel skip]"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
