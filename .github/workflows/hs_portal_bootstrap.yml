# 🔐 6 أكتوبر 2026 - تجهيز جلسة سيرفر دائمة لبوابة هنجرستيشن (مرة واحدة): send = يبعت كود تحقق لصاحب الحساب،
# verify = يتحقق بالكود ويحفظ "الجهاز الموثوق" مشفّر، check = يجرّب الدخول من غير كود. ⚠️ مفيش أي توكن بيتطبع.
name: 🔐 [HS] تجهيز دخول البوابة (مرة واحدة)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "send / verify / check"
        required: true
        default: check
      account:
        description: "DOOM / VERA"
        required: true
        default: DOOM
      otp:
        description: "كود التحقق (مع verify بس)"
        required: false
        default: ""

concurrency:
  group: hs-portal-bootstrap
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests cryptography
      - name: Run
        env:
          MODE: ${{ inputs.mode }}
          ACCOUNT: ${{ inputs.account }}
          OTP: ${{ inputs.otp }}
          HS_PORTAL_USER: ${{ secrets.HS_PORTAL_USER }}
          HS_PORTAL_PASS: ${{ secrets.HS_PORTAL_PASS }}
          VERA_HS_PORTAL_USER: ${{ secrets.VERA_HS_PORTAL_USER }}
          VERA_HS_PORTAL_PASS: ${{ secrets.VERA_HS_PORTAL_PASS }}
        run: |
          echo "::add-mask::$OTP"
          python hs_portal_session.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          mkdir -p /tmp/s
          for f in data/hs_portal_device_*.enc data/hs_portal_session_*.json; do [ -f "$f" ] && cp "$f" /tmp/s/; done
          ls /tmp/s/* >/dev/null 2>&1 || exit 0
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/s/* data/ && git add data/hs_portal_*
            git diff --cached --quiet && exit 0
            git commit -q -m "🔐 جلسة بوابة هنجرستيشن"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
