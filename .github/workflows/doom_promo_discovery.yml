# 🏷️ 23 أكتوبر 2026 - اكتشاف آلية العروض في جاهز وهنجرستيشن من كود الواجهة العام (قراءة فقط - بدون دخول)
name: 🏷️ [DOOM] اكتشاف آلية العروض (قراءة فقط)

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Probe
        run: python promo_discovery_probe.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          F=data/promo_discovery.json
          [ -f "$F" ] || exit 1
          cp "$F" /tmp/p.json
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/p.json "$F" && git add "$F"
            git diff --cached --quiet && exit 0
            git commit -q -m "🏷️ اكتشاف آلية العروض على المنصات"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
