# 🕵️ "مين بيكتب على كتالوج هنجرستيشن؟" - كاشف الكتابة الغريبة (قراءة فقط، صفر PUT).
#
# ليه اتبنى (11 سبتمبر 2026): فحص تاريخ git لسجل مزامنة الرصيد بتاعنا أظهر إن
# تشغيلة 11 سبتمبر 07:19 احتاجت تفعيل 823 صنف - **818 منهم كانوا active=true
# فعلاً في لقطة 9 سبتمبر**، ونفس التشغيلة سجّلت deactivated=0 (يعني رصيدهم في
# جوليب كان لسه > 0). أتمتتنا ما بتعطّلش صنف رصيده موجود - يبقى **كاتب تاني**.
#
# التوقيت: كل ساعتين عند الدقيقة :05 - يعني **10 دقايق قبل** مزامنة الرصيد
# (15 */2) بالظبط، عشان يشوف الكتالوج وهو لسه منحرف قبل ما أتمتتنا تصححه.
#
# 🔑 الأسرار المطلوبة (كلها موجودة فعلاً في New-repoo):
#   CROSS_REPO_TOKEN, HUNGERSTATION_CLIENT_ID, HUNGERSTATION_CLIENT_SECRET,
#   TELEGRAM_TOKEN, TELEGRAM_CHAT_ID
name: 🕵️ [DOOM] Hungerstation Writer Drift Audit (كل ساعتين)

# ⏸️ 30 أكتوبر 2026 (قرار صاحب المشروع بعد تحذير هنجرستيشن من كثرة الطلبات/الـRate Limit): الفحص الدوري كل ساعتين متوقف
# (كان بيقرا كتالوج كل فرع كامل). بيشتغل يدويًا بس (workflow_dispatch) عند الحاجة. الرجوع: رجّع الـschedule (cron '5 */2 * * *').
on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Audit who is writing to the DOOM catalog
        env:
          HUNGERSTATION_CLIENT_ID: ${{ secrets.HUNGERSTATION_CLIENT_ID }}
          HUNGERSTATION_CLIENT_SECRET: ${{ secrets.HUNGERSTATION_CLIENT_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python hungerstation_writer_drift_audit.py
      - name: Commit findings back to juleb-daily-report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hungerstation_writer_drift_log.json \
                  data/hungerstation_writer_drift_latest.json \
                  data/hungerstation_drift_prev_fingerprint.json
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -q -m "🕵️ تدقيق الكتابة على كتالوج هنجرستيشن"
          # 11 أكتوبر 2026: الحلقات بتعمل push كل دقيقة - محاولة واحدة كانت بتفشل (rejected/fetch first)
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 4))
          done
          exit 1
