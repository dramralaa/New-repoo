# "الحل النهائي لمزامنة الرصيد" - طلب صريح من صاحب المشروع 9 سبتمبر 2026.
# راجع hungerstation_stock_sync.py في juleb-daily-report للمنطق الكامل.
# بيقرأ رصيد جوليب الحي (دوم2) وحالة هنجرستيشن الحية، ويصحح active لأي صنف اختلفت
# حالته (نفد الرصيد أو رجع الرصيد) - دلتا بس، مش الكتالوج كامل.
# ⚠️ 10 سبتمبر 2026: كانت كل ساعة - نُزّلت لكل ساعتين بطلب صريح من صاحب المشروع
# (توحيدًا مع تردد مزامنة جاهز في نفس اليوم).
#
# 🚨 11 سبتمبر 2026 - تشغيلتين إضافيتين بعد push جوليب الليلي مباشرة:
# الدليل من سجل "Assortment API" في بوابة الشركاء (job 71201720): الساعة 02:14 UTC
# اتنفّذ job بـ**8,023 سجل** (الكتالوج كامل) **مش بتاعنا** - ده push جوليب اليومي
# وقت الفجر. تشغيلتنا اللي قبله (01:32) احتاجت 6 تغييرات بس، واللي بعده (07:18)
# احتاجت **823** - يعني الـpush بيرجّع يعطّل مئات الأصناف اللي عليها رصيد فعلي.
#
# ليه تشغيلتين مش واحدة؟ لأن الفجوة الحقيقية بين تشغيلتنا كانت **5 ساعات و46 دقيقة**
# (01:32 -> 07:18) رغم إن الجدولة "كل ساعتين" - تشغيلات GitHub المجدولة بتتأخر
# وبتتلغي فعليًا تحت الضغط (مؤكد من سجل التشغيلات الحقيقي: 12:50، 07:18، 22:34،
# 19:40، 16:22 ... فواصل 3-5 ساعات مش ساعتين). السكريبت دلتا-فقط وidempotent،
# فالتشغيلة الزيادة شبه مجانية وبتغطي لو الأولى اتأخرت أو اتلغت.
name: 🔄 [DOOM] Hungerstation Stock Sync (كل ساعتين + بعد push جوليب)

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */2 * * *'
    # بعد push جوليب الليلي (02:14 UTC) مباشرة - وتشغيلة احتياطية بعدها بساعة
    - cron: '30 2 * * *'
    - cron: '30 3 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Sync
        env:
          JULEB_URL: ${{ secrets.JULEB_URL }}
          JULEB_DB: ${{ secrets.JULEB_DB }}
          JULEB_USER: ${{ secrets.JULEB_USER }}
          JULEB_PASS: ${{ secrets.JULEB_PASS }}
          HUNGERSTATION_CLIENT_ID: ${{ secrets.HUNGERSTATION_CLIENT_ID }}
          HUNGERSTATION_CLIENT_SECRET: ${{ secrets.HUNGERSTATION_CLIENT_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python hungerstation_stock_sync.py
      - name: Commit result back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hungerstation_stock_sync_last_run.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "🔄 نتيجة مزامنة رصيد هنجرستيشن" && git pull --rebase && git push)
