# "الحل النهائي لمزامنة الرصيد" - طلب صريح من صاحب المشروع 9 سبتمبر 2026.
# راجع hungerstation_stock_sync.py في juleb-daily-report للمنطق الكامل.
# بيقرأ رصيد جوليب الحي (دوم2) وحالة هنجرستيشن الحية، ويصحح active لأي صنف اختلفت
# حالته (نفد الرصيد أو رجع الرصيد) - دلتا بس، مش الكتالوج كامل.
#
# 🔁 13 سبتمبر 2026 - بعد إضافة doom_continuous_sync_loop.yml (حلقة مستمرة
# ذاتية التجديد بقت هي المصدر الأساسي للمزامنة) - هذا الـworkflow بقى مجرد
# مصدر احتياطي إضافي بطلب صريح: تشغيلة واحدة يوميًا بس الساعة 8 مساءً بتوقيت
# الرياض (17:05 UTC - 5 دقايق بعد doom_fast_price_stock_sync.yml عمدًا عشان
# يقل احتمال تصادم الكتابة على data/sync_delay_alert_state.json المشترك، رغم
# إن آلية إعادة المحاولة بتتعامل معاه أصلًا لو حصل).
#
# 🗄️ 14 سبتمبر 2026 - **معطّل نهائيًا** بعد بناء `doom_sync_loop_hungerstation.yml`
# (حلقة معزولة مستقلة، مع timeout + تسجيل خطأ دائم - راجع PROJECT_CONTEXT.md).
# هذا الملف تحديدًا كان سبب اكتشاف أهمية العزل: تعطّل هنجرستيشن 4.5 ساعة
# بصمت جوّه الحلقة المشتركة القديمة يوم 13 سبتمبر. الـschedule اتشال، الملف
# متروك كمرجع تاريخي (workflow_dispatch لسه متاح لتشغيل يدوي طارئ).
name: 🔄 [DOOM] Hungerstation Stock Sync (معطّل - استُبدل بـdoom_sync_loop_hungerstation.yml)

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Sync
        env:
          JULEB_URL: ${{ secrets.JULEB_URL }}
          JULEB_DB: ${{ secrets.JULEB_DB }}
          JULEB_USER: ${{ secrets.JULEB_USER }}
          JULEB_PASS: ${{ secrets.JULEB_PASS }}
          HUNGERSTATION_CLIENT_ID: ${{ secrets.HUNGERSTATION_CLIENT_ID }}
          HUNGERSTATION_CLIENT_SECRET: ${{ secrets.HUNGERSTATION_CLIENT_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python hungerstation_stock_sync.py
      # 🚨 12 سبتمبر 2026 - نفس فحص التأخير المضاف في doom_fast_price_stock_sync.yml
      # (بدل workflow watchdog مستقل كان بيفوّت تشغيلاته - راجع التعليق هناك). وجوده
      # هنا كمان (مش بس في fast sync) بيدّي فرصة تانية للفحص يحصل في نفس الربع ساعة
      # لو workflow التاني فوّت دوره - بدون أي cron إضافي.
      - name: Check sync delays (كل المنصات)
        env:
          TELEGRAM_TOKEN_DOOM: ${{ secrets.TELEGRAM_TOKEN_DOOM }}
          TELEGRAM_CHAT_ID_DOOM: ${{ secrets.TELEGRAM_CHAT_ID_DOOM }}
        run: python sync_delay_watchdog.py
      # 🐛 12 سبتمبر 2026 - data/sync_delay_alert_state.json مشترك مع
      # doom_fast_price_stock_sync.yml (الاتنين بيكتبوا عليه) - راجع نفس الملحوظة
      # هناك. لو اتشغّلوا قريب من بعض، الـpush ممكن يتصادم والنتيجة كلها تضيع من
      # غير ما توصل للريبو - إعادة محاولة بدل محاولة وحيدة بتفشل بصمت.
      # 🐛🐛 12 سبتمبر 2026 (الجذر الحقيقي اتلقى بعد فحص لوج تشغيلة فعلية فشلت
      # بصمت): "git rebase --continue" بعد حل التعارض بيحتاج EDITOR عشان يفتح
      # رسالة الكوميت المعاد تطبيقها - في GitHub Actions مفيش EDITOR أصلًا
      # ("Terminal is dumb, but EDITOR unset")، فـ"git rebase --continue" كان
      # بيفشل هو نفسه، والسكريبت كان بيعمل "|| git rebase --abort" فيلغي كل
      # الـrebase (بما فيه الكوميت المحلي بالكامل!) - يعني كل المحاولات الخمسة
      # كانت بتفشل بنفس الطريقة بالظبط، والخطوة كانت بتخلص "success" (مفيش أي
      # exit فاشل في نهاية اللوب) رغم إن الـpush ماحصلش خالص. ده كان السبب
      # الحقيقي وراء "المزامنة نجحت بس البيانات فضلت قديمة" اللي استمرت رغم كل
      # الإصلاحات التانية. الحل: GIT_EDITOR=true (محرر وهمي بيقبل الرسالة
      # الجاهزة من غير ما يفتح حاجة) + exit 1 صريح لو الـpush فشل نهائيًا بعد
      # كل المحاولات (عشان أي فشل حقيقي مستقبلي يبان في الـActions بدل ما يختفي).
      - name: Commit result back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          export GIT_EDITOR=true
          git add data/hungerstation_stock_sync_last_run.json data/hungerstation_our_writes_log.json data/sync_delay_alert_state.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "🔄 نتيجة مزامنة رصيد هنجرستيشن + فحص التأخير"
            pushed=0
            for i in 1 2 3 4 5; do
              if git push; then
                echo "Push succeeded"
                pushed=1
                break
              fi
              echo "Push attempt $i failed - retrying after rebase"
              git fetch origin main
              if ! git rebase origin/main; then
                git checkout --theirs data/sync_delay_alert_state.json 2>/dev/null || true
                git add data/sync_delay_alert_state.json
                git rebase --continue || git rebase --abort
              fi
              sleep $((i * 3))
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::فشل push نتيجة المزامنة نهائيًا بعد 5 محاولات - النتيجة اتحسبت صح بس متوصلتش للريبو"
              exit 1
            fi
          fi
