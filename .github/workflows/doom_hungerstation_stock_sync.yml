# "الحل النهائي لمزامنة الرصيد" - طلب صريح من صاحب المشروع 9 سبتمبر 2026.
# راجع hungerstation_stock_sync.py في juleb-daily-report للمنطق الكامل.
# بيقرأ رصيد جوليب الحي (دوم2) وحالة هنجرستيشن الحية، ويصحح active لأي صنف اختلفت
# حالته (نفد الرصيد أو رجع الرصيد) - دلتا بس، مش الكتالوج كامل.
#
# ⚡ 12 سبتمبر 2026 - رُفعت الوتيرة لكل ١٥ دقيقة نهارًا (طلب صريح: تحديث بوتيرة
# مضمونة بحد أقصى ~50 دقيقة). السكريبت خفيف أصلاً (استعلامين بس مباشرين لجوليب)
# ودلتا-فقط/idempotent، فتشغيله كل ربع ساعة آمن. اتشالت التشغيلتين الخاصتين بعد
# push جوليب الليلي (02:14 UTC تقريبًا) لأنهم بقوا زيادة عن الحاجة - النافذة
# الليلية (2-9 صباحًا الرياض) بقى ليها وتيرة خاصة أبطأ (كل ساعتين) بطلب صريح من
# صاحب المشروع عشان منحمّلش جوليب وقت مفيش فيه مبيعات أصلاً.
# 🕐 12 سبتمبر 2026 - دقايق التشغيل بقت 7/22/37/52 بدل */15 المستديرة - راجع نفس
# الملحوظة في doom_fast_price_stock_sync.yml (نصيحة GitHub الرسمية لتقليل التزاحم
# عند اللحظات المستديرة اللي بتضغط عالميًا على سيرفراتها).
name: 🔄 [DOOM] Hungerstation Stock Sync (كل ١٥ دقيقة نهارًا، كل ساعتين ليلًا)

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 6-22 * * *'
    - cron: '17 23,1,3,5 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Sync
        env:
          JULEB_URL: ${{ secrets.JULEB_URL }}
          JULEB_DB: ${{ secrets.JULEB_DB }}
          JULEB_USER: ${{ secrets.JULEB_USER }}
          JULEB_PASS: ${{ secrets.JULEB_PASS }}
          HUNGERSTATION_CLIENT_ID: ${{ secrets.HUNGERSTATION_CLIENT_ID }}
          HUNGERSTATION_CLIENT_SECRET: ${{ secrets.HUNGERSTATION_CLIENT_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python hungerstation_stock_sync.py
      # 🚨 12 سبتمبر 2026 - نفس فحص التأخير المضاف في doom_fast_price_stock_sync.yml
      # (بدل workflow watchdog مستقل كان بيفوّت تشغيلاته - راجع التعليق هناك). وجوده
      # هنا كمان (مش بس في fast sync) بيدّي فرصة تانية للفحص يحصل في نفس الربع ساعة
      # لو workflow التاني فوّت دوره - بدون أي cron إضافي.
      - name: Check sync delays (كل المنصات)
        env:
          TELEGRAM_TOKEN_DOOM: ${{ secrets.TELEGRAM_TOKEN_DOOM }}
          TELEGRAM_CHAT_ID_DOOM: ${{ secrets.TELEGRAM_CHAT_ID_DOOM }}
        run: python sync_delay_watchdog.py
      - name: Commit result back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hungerstation_stock_sync_last_run.json data/hungerstation_our_writes_log.json data/sync_delay_alert_state.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "🔄 نتيجة مزامنة رصيد هنجرستيشن + فحص التأخير" && git pull --rebase && git push)
