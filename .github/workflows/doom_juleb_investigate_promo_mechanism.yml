# Safe, read-only metadata investigation (no writes): how promotions actually
# work in the Juleb Odoo instance, and the exact product.pricelist.item field
# shape - needed before creating the Hungerstation safety-ceiling pricelist
# (+25%, promotions must not apply to it).
name: Juleb Investigate Promo Mechanism (manual, read-only)

on:
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Investigate promo mechanism + pricelist item fields
        env:
          JULEB_URL: ${{ secrets.JULEB_URL }}
          JULEB_DB: ${{ secrets.JULEB_DB }}
          JULEB_USER: ${{ secrets.JULEB_USER }}
          JULEB_PASS: ${{ secrets.JULEB_PASS }}
        run: python juleb_investigate_promo_mechanism.py
