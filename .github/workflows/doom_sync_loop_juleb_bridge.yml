# 🔁 14 سبتمبر 2026 - جزء من إعادة بناء بنية المزامنة لعزل كل تكامل تمامًا (راجع
# PROJECT_CONTEXT.md قسم "بنية المزامنة المعزولة"). قبل كده كانت كل التكاملات
# (جسر جوليب + جاهز + هنجرستيشن) في حلقة واحدة مشتركة (doom_continuous_sync_loop.yml)
# - المشكلة: أي تعليق/بطء في تكامل واحد كان بيأخّر (أو نظريًا يوقف) باقي
# التكاملات لأنها بتتنفذ بالتتابع في نفس الدورة. الحل: كل تكامل بقى له حلقة
# ذاتية التجديد مستقلة تمامًا (نفس مبدأ الحلقة الأصلية: job واحد، loop داخلي
# بـsleep، self-relaunch قبل سقف الـ6 ساعات) - فشل/بطء تكامل واحد **صفر تأثير**
# على البقية. هذا يسهّل كمان توسيع النظام مستقبلاً (فيرا، صيدليات جديدة) - كل
# تكامل جديد = حلقة جديدة بنفس القالب، من غير خطر على الموجود.
#
# هذه الحلقة: جسر بيانات جوليب السريع (منتجات + أرصدة مخزون فقط) - أخف تكامل
# وأهمه (باقي التكاملات والتقارير كلها بتعتمد على data/products.json و
# data/stock_balance.json الناتجين منه).
#
# ⚠️ كل استدعاء سكريبت متغلّف بـ`timeout` + تسجيل دائم للنتيجة عبر
# sync_health_recorder.py في data/health/juleb_bridge.json - عشان أي فشل يبقى
# قابل للتشخيص فورًا (رسالة الخطأ الحقيقية، مش بس "فشل") من غير الحاجة لتحميل
# سجلات GitHub Actions المؤقتة.
name: 🔁 [DOOM] Sync Loop - Juleb Bridge (منتجات + أرصدة)

on:
  workflow_dispatch:
  schedule:
    # شبكة أمان نادرة بس - لو السلسلة ذاتية التجديد اتقطعت لأي سبب.
    - cron: '10 */4 * * *'

concurrency:
  group: doom-sync-loop-juleb-bridge
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pytz requests
      - name: Continuous sync loop (~5.5 ساعة، بيتجدد ذاتيًا بعدها)
        env:
          JULEB_URL: ${{ secrets.JULEB_URL }}
          JULEB_DB: ${{ secrets.JULEB_DB }}
          JULEB_USER: ${{ secrets.JULEB_USER }}
          JULEB_PASS: ${{ secrets.JULEB_PASS }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          export GIT_EDITOR=true

          START=$(date +%s)
          DURATION=$((340 * 60))
          ITER=0

          run_with_health() {
            local name="$1" script="$2" timeout_sec="$3"
            local outfile="/tmp/${name}_output.log"
            timeout "$timeout_sec" python "$script" > "$outfile" 2>&1
            local code=$?
            if [ $code -eq 0 ]; then
              tail -5 "$outfile"
            else
              echo "⚠️ $name فشل (exit=$code) - آخر 20 سطر من الناتج:"
              tail -20 "$outfile"
            fi
            python sync_health_recorder.py "$name" "$code" "$outfile"
          }

          commit_and_push() {
            git add data/products.json data/stock_balance.json data/health/juleb_bridge.json 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "لا يوجد تغيير فعلي في هذه الدورة."
              return 0
            fi
            git commit -m "🔁 جسر جوليب - دورة #$ITER ($(date -u +%H:%M) UTC)"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "✅ Push نجح (دورة $ITER، محاولة $i)"
                return 0
              fi
              echo "⚠️ Push فشل (دورة $ITER، محاولة $i) - إعادة محاولة بعد rebase"
              git fetch origin main
              git rebase origin/main || git rebase --abort
              sleep $((i * 3))
            done
            echo "::error::فشل push دورة $ITER نهائيًا بعد 5 محاولات - هنكمل باقي اللوب برضه"
          }

          while true; do
            ITER=$((ITER + 1))
            echo "════════ جسر جوليب - دورة رقم $ITER - $(date -u '+%Y-%m-%d %H:%M:%S') UTC ════════"

            run_with_health juleb_bridge claude_data_bridge_fast.py 120

            commit_and_push

            NOW=$(date +%s)
            ELAPSED=$((NOW - START))
            if [ $ELAPSED -ge $DURATION ]; then
              echo "انتهت نافذة الـ~5.5 ساعة (${ITER} دورة) - هيتعمل self-relaunch في الخطوة الجاية."
              break
            fi

            H=$(date -u +%H)
            if [ "$H" -ge 23 ] || [ "$H" -lt 6 ]; then
              SLEEP=7200
            else
              SLEEP=1800
            fi
            REMAINING=$((DURATION - ELAPSED))
            if [ $SLEEP -gt $REMAINING ]; then
              SLEEP=$REMAINING
            fi
            echo "نايم $SLEEP ثانية قبل الدورة الجاية..."
            sleep $SLEEP
          done
      - name: Self-relaunch (بدء نافذة ~5.5 ساعة تانية فورًا)
        if: always()
        run: |
          curl -sS -X POST \
            -H "Authorization: token ${{ secrets.CROSS_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/doom_sync_loop_juleb_bridge.yml/dispatches" \
            -d '{"ref":"main"}'
