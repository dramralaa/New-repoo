# 🔑 الأسرار المطلوبة هنا (نفس القيم الموجودة في juleb-daily-report):
# CROSS_REPO_TOKEN (لازم يشمل صلاحية Actions: Read-only كمان)، TELEGRAM_TOKEN،
# TELEGRAM_CHAT_ID
name: 💓 [DOOM] Automation Health Digest (Weekly)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Run Health Digest
        env:
          GITHUB_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          GITHUB_REPOSITORY: dramralaa/juleb-daily-report
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python automation_health_digest.py
