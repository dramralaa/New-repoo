# 🕘 18 أكتوبر 2026 - مزامنة مواعيد فروع دوم من هنجرستيشن وجاهز إلى شيفتي (قراءة بس من المنصات) - كل 3 ساعات
name: 🕘 [DOOM] مواعيد الفروع على المنصات ← شيفتي

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      enroll_code:
        description: 'كود ربط شيفتي (أول مرة بس)'
        required: false
        default: ''

concurrency:
  group: doom-platform-hours-sync
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests cryptography
      - name: Sync
        env:
          HS_PORTAL_USER: ${{ secrets.HS_PORTAL_USER }}
          HS_PORTAL_PASS: ${{ secrets.HS_PORTAL_PASS }}
          JAHEZ_TOKEN: ${{ secrets.JAHEZ_TOKEN }}
          JAHEZ_STORE_ID: ${{ secrets.JAHEZ_STORE_ID }}
          ENROLL_CODE: ${{ github.event.inputs.enroll_code }}
        run: python doom_platform_hours_sync.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          mkdir -p /tmp/keep && cp data/platform_hours_latest.json data/shifty_platform_key_doom.enc data/hs_portal_device_doom.enc /tmp/keep/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/keep/* data/ 2>/dev/null || true
            for f in data/platform_hours_latest.json data/shifty_platform_key_doom.enc data/hs_portal_device_doom.enc; do [ -e "$f" ] && git add "$f"; done
            git diff --cached --quiet && exit 0
            git commit -q -m "🕘 مواعيد الفروع على المنصات"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
