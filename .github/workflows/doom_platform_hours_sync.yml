name: 🕘 [DOOM] مواعيد الفروع على المنصات ← شيفتي

# 15 نوفمبر 2026: الـcron كل 10 دقايق اتشال - التشغيل من doom_live_loop في مواعيد ثابتة بس
# (جاهز 01:30/03/04/06/07/08 الرياض، وهنجرستيشن 01:30 و08:00 بس عن طريق hs=1).
on:
  workflow_dispatch:
    inputs:
      hs:
        description: 'اقرا مواعيد هنجرستيشن من البوابة كمان (1) - مرتين يوميًا بس'
        required: false
        default: '0'
      enroll_code:
        description: 'كود ربط شيفتي (أول مرة بس)'
        required: false
        default: ''

concurrency:
  group: doom-platform-hours-sync
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests cryptography
      - name: Sync
        env:
          LOG_GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          HS_PORTAL_USER: ${{ secrets.HS_PORTAL_USER }}
          HS_PORTAL_PASS: ${{ secrets.HS_PORTAL_PASS }}
          JAHEZ_TOKEN: ${{ secrets.JAHEZ_TOKEN }}
          JAHEZ_STORE_ID: ${{ secrets.JAHEZ_STORE_ID }}
          ENROLL_CODE: ${{ github.event.inputs.enroll_code }}
          SKIP_HS_HOURS: ${{ github.event.inputs.hs == '1' && '0' || '1' }}
        run: python silent_run.py doom_platform_hours_sync.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          mkdir -p /tmp/keep && cp data/platform_hours_latest.json data/shifty_platform_key_doom.enc data/hs_portal_device_doom.enc /tmp/keep/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/keep/* data/ 2>/dev/null || true
            for f in data/platform_hours_latest.json data/shifty_platform_key_doom.enc data/hs_portal_device_doom.enc; do [ -e "$f" ] && git add "$f"; done
            git diff --cached --quiet && exit 0
            git commit -q -m "🕘 مواعيد الفروع على المنصات [vercel skip]"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
