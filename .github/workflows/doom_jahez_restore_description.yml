# 🩹 ترميم وصف اتمسح بالغلط على جاهز (حادثة 2 سبتمبر 2026) - يدوي بالكامل.
# dry-run افتراضيًا - لازم input واضح "confirm" عشان ينفّذ أي كتابة فعلية.
# الأسرار المطلوبة: CROSS_REPO_TOKEN, JAHEZ_TOKEN, JAHEZ_STORE_ID
name: 🩹 [DOOM] Jahez Description Restore (يدوي)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'اكتب "confirm" بالظبط عشان ينفّذ الكتابة الفعلية (أي حاجة تانية = dry-run)'
        required: false
        default: ""

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Restore description (dry-run unless confirm=confirm)
        env:
          JAHEZ_TOKEN: ${{ secrets.JAHEZ_TOKEN }}
          JAHEZ_STORE_ID: ${{ secrets.JAHEZ_STORE_ID }}
          RESTORE_CONFIRM: ${{ inputs.confirm == 'confirm' && '1' || '0' }}
        run: python jahez_restore_description.py
