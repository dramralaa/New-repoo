name: 💰 [DOOM] Shifty – مبيعات الصيادلة (مرة يوميًا 00:09)

on:
  workflow_dispatch:
  schedule:
    - cron: '9 21 * * *'
    - cron: '25 21 * * *'
    - cron: '50 21 * * *'

concurrency:
  group: doom-shifty-sales-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: هل نجحت محاولة النهارده بالفعل؟ (للجدولة الاحتياطية بس)
        id: done
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SINCE=$(date -u -d '4 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          N=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/doom_shifty_sales_push.yml/runs?status=success&created=%3E%3D$SINCE&per_page=5" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('total_count',0))")
          echo "نجحات في آخر 4 ساعات: $N"
          if [ "${N:-0}" -gt 0 ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.done.outputs.skip != '1'
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: claude/assortment-webhook-discovery-a4mxc6   # فرع النشر: فيه الكاش اليومي + السكربت (بيتدمج من main كل ≤30 دقيقة)
      - uses: actions/setup-python@v5
        if: steps.done.outputs.skip != '1'
        with:
          python-version: '3.10'
      - if: steps.done.outputs.skip != '1'
        run: pip install requests cryptography pytz
      - name: Push sales to Shifty (من الكاش المشترك)
        if: steps.done.outputs.skip != '1'
        env:
          HS_PORTAL_PASS: ${{ secrets.HS_PORTAL_PASS }}
          TARGETS_GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          SHIFTY_SOURCE: cache
          FINAL_ATTEMPT: ${{ github.event.schedule == '50 21 * * *' }}
        run: python shifty_sales_push.py
