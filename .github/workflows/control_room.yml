name: 🛰️ غرفة المتابعة (كل ساعة)

# يقيس آخر تشغيلات workflows التشغيل المهمة ويكتب data/health/control_room.json في juleb-daily-report (للصفحة 63). قراءة بس.
on:
  workflow_dispatch:
  schedule:
    - cron: '27 * * * *'

concurrency:
  group: control-room
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Collect
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: python control_room.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          F=data/health/control_room.json
          [ -f "$F" ] || exit 1
          cp "$F" /tmp/s.json
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/s.json "$F" && git add "$F"
            git diff --cached --quiet && exit 0
            git commit -q -m "🛰️ قياس غرفة المتابعة [vercel skip]"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
