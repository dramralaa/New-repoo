# Creates the "هنجرستيشن - سقف أمان +25%" pricelist (single formula-based
# rule: list_price * 1.25, applied_on='3_global') if it doesn't already
# exist. Confirmed via juleb_investigate_promo_mechanism.py /
# juleb_investigate_pos_promotion.py: no rule-based coupon engine exists
# beyond pos.promotion, which has no pricelist-scoping field, so excluding
# active promotions from this pricelist is a cashier procedure, not a
# technical setting. This workflow performs a REAL write to production Odoo
# (idempotent - safe to re-run, won't duplicate).
name: Juleb Create Hungerstation Ceiling Pricelist (manual)

on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Create ceiling pricelist
        env:
          JULEB_URL: ${{ secrets.JULEB_URL }}
          JULEB_DB: ${{ secrets.JULEB_DB }}
          JULEB_USER: ${{ secrets.JULEB_USER }}
          JULEB_PASS: ${{ secrets.JULEB_PASS }}
        run: python juleb_create_hungerstation_ceiling_pricelist.py
