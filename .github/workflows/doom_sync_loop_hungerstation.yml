# 🔁 14 سبتمبر 2026 - حلقة مزامنة مستقلة تمامًا لهنجرستيشن فقط (راجع
# doom_sync_loop_juleb_bridge.yml لشرح فلسفة العزل الكاملة بين التكاملات).
# هذه الحلقة تحديدًا هي اللي كانت متأخرة 4.5 ساعة بصمت جوّه الحلقة المشتركة
# القديمة (doom_continuous_sync_loop.yml) يوم 13 سبتمبر 2026 - العزل + تسجيل
# الخطأ الدائم (sync_health_recorder.py → data/health/hungerstation.json)
# يضمنوا إن أي فشل مستقبلي مشابه يبان فورًا بسببه الحقيقي، من غير ما يستنى
# فحص سجلات GitHub الطويل، ومن غير ما يأخّر جاهز أو جسر جوليب.
name: 🔁 [DOOM] Sync Loop - Hungerstation (رصيد)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */4 * * *'

concurrency:
  group: doom-sync-loop-hungerstation
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pytz requests
      - name: Continuous sync loop (~5.5 ساعة، بيتجدد ذاتيًا بعدها)
        env:
          JULEB_URL: ${{ secrets.JULEB_URL }}
          JULEB_DB: ${{ secrets.JULEB_DB }}
          JULEB_USER: ${{ secrets.JULEB_USER }}
          JULEB_PASS: ${{ secrets.JULEB_PASS }}
          HUNGERSTATION_CLIENT_ID: ${{ secrets.HUNGERSTATION_CLIENT_ID }}
          HUNGERSTATION_CLIENT_SECRET: ${{ secrets.HUNGERSTATION_CLIENT_SECRET }}
          # ⚠️ 14 سبتمبر 2026 - hungerstation_stock_sync.py بيقرا TELEGRAM_TOKEN/
          # TELEGRAM_CHAT_ID العاديين (مش الـ_DOOM) لتنبيه التغييرات - تحقّقنا من
          # الكود صراحة قبل الكتابة هنا (سطر 263) بدل افتراض نفس التسمية القديمة.
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          export GIT_EDITOR=true

          START=$(date +%s)
          DURATION=$((340 * 60))
          ITER=0

          run_with_health() {
            local name="$1" script="$2" timeout_sec="$3"
            local outfile="/tmp/${name}_output.log"
            timeout "$timeout_sec" python "$script" > "$outfile" 2>&1
            local code=$?
            if [ $code -eq 0 ]; then
              tail -5 "$outfile"
            else
              echo "⚠️ $name فشل (exit=$code) - آخر 20 سطر من الناتج:"
              tail -20 "$outfile"
            fi
            python sync_health_recorder.py "$name" "$code" "$outfile"
          }

          commit_and_push() {
            git add data/hungerstation_stock_sync_last_run.json data/hungerstation_our_writes_log.json \
                    data/health/hungerstation.json 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "لا يوجد تغيير فعلي في هذه الدورة."
              return 0
            fi
            git commit -m "🔁 هنجرستيشن - دورة #$ITER ($(date -u +%H:%M) UTC)"
            for i in 1 2 3 4 5; do
              # 🐛 14 سبتمبر 2026 - راجع doom_sync_loop_juleb_bridge.yml: git push/fetch
              # من غير timeout ممكن يعلّق اللوب كله للأبد على مشكلة شبكة.
              if timeout 60 git push; then
                echo "✅ Push نجح (دورة $ITER، محاولة $i)"
                return 0
              fi
              echo "⚠️ Push فشل (دورة $ITER، محاولة $i) - إعادة محاولة بعد rebase"
              timeout 60 git fetch origin main
              if ! git rebase origin/main; then
                # 🐛 14 سبتمبر 2026 - **هذا هو السبب الحقيقي المكتشف لتأخير هنجرستيشن**:
                # السكريبت نفسه كان بينجح فعليًا (اتأكَّد من سجل حي: نجح 21:17 UTC بعد فشل
                # واحد فقط 20:45 بسبب 500 مؤقت من سيرفر هنجرستيشن نفسه - راجع
                # PROJECT_CONTEXT.md) لكن نتيجة النجاح دي **ضاعت بصمت** لأن الـrebase بعدها
                # واجه تعارض حقيقي على ملفات البيانات (مش بس ملف التنبيهات) وفشل 5 محاولات
                # كاملة. هذه الحلقة الوحيدة اللي بتكتب الملفات دي، فالنسخة المحلية الطازجة
                # (--theirs في rebase = الكوميت المحلي، عكس merge) صحيحة دايمًا.
                git checkout --theirs data/hungerstation_stock_sync_last_run.json \
                        data/hungerstation_our_writes_log.json data/health/hungerstation.json 2>/dev/null || true
                git add data/hungerstation_stock_sync_last_run.json data/hungerstation_our_writes_log.json \
                        data/health/hungerstation.json 2>/dev/null || true
                git rebase --continue || git rebase --abort
              fi
              sleep $((i * 3))
            done
            echo "::error::فشل push دورة $ITER نهائيًا بعد 5 محاولات - هنكمل باقي اللوب برضه"
          }

          while true; do
            ITER=$((ITER + 1))
            echo "════════ هنجرستيشن - دورة رقم $ITER - $(date -u '+%Y-%m-%d %H:%M:%S') UTC ════════"

            run_with_health hungerstation hungerstation_stock_sync.py 180

            commit_and_push

            NOW=$(date +%s)
            ELAPSED=$((NOW - START))
            if [ $ELAPSED -ge $DURATION ]; then
              echo "انتهت نافذة الـ~5.5 ساعة (${ITER} دورة) - هيتعمل self-relaunch في الخطوة الجاية."
              break
            fi

            H=$(date -u +%H)
            if [ "$H" -ge 23 ] || [ "$H" -lt 6 ]; then
              SLEEP=7200
            else
              SLEEP=1800
            fi
            REMAINING=$((DURATION - ELAPSED))
            if [ $SLEEP -gt $REMAINING ]; then
              SLEEP=$REMAINING
            fi
            echo "نايم $SLEEP ثانية قبل الدورة الجاية..."
            sleep $SLEEP
          done
      - name: Self-relaunch (بدء نافذة ~5.5 ساعة تانية فورًا)
        if: always()
        run: |
          curl -sS -X POST \
            -H "Authorization: token ${{ secrets.CROSS_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/doom_sync_loop_hungerstation.yml/dispatches" \
            -d '{"ref":"main"}'
