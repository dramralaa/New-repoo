name: 🏷️ [DOOM] Fix Hungerstation Category v3 (manual, correct mutation)

on:
  workflow_dispatch:
    inputs:
      proceed_with_full_batch:
        description: 'اكتب 1 فقط بعد مراجعة canary نظيف صراحةً - يشغّل باقي الدفعة الكاملة بعد الـ3 canary'
        required: false
        default: ''

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Fix categories (correct `product` mutation, canary + verified batch)
        env:
          # ملحوظة أمنية: التوكن ده جلسة حية قصيرة العمر (~4 ساعات) من partner-app.hungerstation.com.
          # لازم يتحدّث كـ Secret (HS_SESSION_TOKEN) قبل كل تشغيل - ممنوع يتحط كـ workflow_dispatch
          # input نصي لأن GitHub ما بيعملوش mask تلقائي للـinputs (بيفضل ظاهر في صفحة الـrun)،
          # عكس الـsecrets اللي بتتخفى تلقائيًا في اللوجز ومفيش مكان بيعرضها كاملة.
          HS_TOKEN: ${{ secrets.HS_SESSION_TOKEN }}
          HUNGERSTATION_CLIENT_ID: ${{ secrets.HUNGERSTATION_CLIENT_ID }}
          HUNGERSTATION_CLIENT_SECRET: ${{ secrets.HUNGERSTATION_CLIENT_SECRET }}
          PROCEED_WITH_FULL_BATCH: ${{ github.event.inputs.proceed_with_full_batch }}
        run: python hungerstation_fix_category_v3.py
      - name: Commit result back
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hungerstation_category_fix_v3_result.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "🏷️ نتيجة تصحيح تصنيفات هنجرستيشن v3" && git pull --rebase && git push)
