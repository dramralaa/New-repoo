# 🔍 20 سبتمبر 2026 - أداة تشخيصية لمرة واحدة: فحص إمكانية بناء إشعارات لطلبات
# منصات التوصيل من داخل جوليب نفسه (بدل الاعتماد على صوت تبويب كروم). بتستخدم
# أسرار JULEB_* الدائمة (نفس Claude Data Bridge) - مفيش توكن مؤقت مطلوب.
name: 🔍 [DOOM] فحص إمكانية إشعارات جوليب (يدوي، لمرة واحدة)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Investigate
        env:
          JULEB_URL: ${{ secrets.JULEB_URL }}
          JULEB_DB: ${{ secrets.JULEB_DB }}
          JULEB_USER: ${{ secrets.JULEB_USER }}
          JULEB_PASS: ${{ secrets.JULEB_PASS }}
        run: python juleb_investigate_notification_capability.py
      - name: Commit and push result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          export GIT_EDITOR=true
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          git add data/juleb_notification_investigation_result.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "لا يوجد تغيير."
            exit 0
          fi
          git commit -m "🔍 نتيجة فحص إمكانية إشعارات جوليب"
          timeout 60 git push origin HEAD:main || (timeout 60 git fetch origin main && git rebase origin/main && timeout 60 git push origin HEAD:main)
