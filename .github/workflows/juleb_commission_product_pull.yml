name: 🔎 [DOOM] سحب نسب كوميشن المنتجات (REST، قراءة فقط)

on:
  workflow_dispatch:

concurrency:
  group: juleb-commission-product-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Pull
        env:
          PLATFORM_PAUSE: ${{ vars.PLATFORM_PAUSE }}
          JULEB_API_BASE: ${{ vars.JULEB_API_BASE || 'https://medova.juleb.com/api/v1' }}
          JULEB_API_KEY: ${{ secrets.JULEB_API_KEY_DOOM }}
        run: python juleb_commission_product_pull.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          mkdir -p /tmp/keep && cp data/product_commission_rest.json /tmp/keep/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/keep/* data/ 2>/dev/null || true
            git add data/product_commission_rest.json 2>/dev/null || true
            git diff --cached --quiet && exit 0
            git commit -q -m "🔎 نسب كوميشن المنتجات من REST [vercel skip]"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
