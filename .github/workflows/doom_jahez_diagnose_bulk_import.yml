# 🔬 تحقق من endpoint الرفع الجماعي المزعوم (POST .../products/import) - مُدخل غير
# مؤكَّد من قراءة Gemini لملف HAR (2 سبتمبر 2026)، صنف واحد بس (SYRINGE 1ML) قبل أي
# اعتماد على دفعة كاملة. يدوي بالكامل، مفيش جدولة.
# الأسرار المطلوبة: CROSS_REPO_TOKEN, JAHEZ_TOKEN, JAHEZ_STORE_ID
name: 🔬 [DOOM] Jahez Bulk Import Endpoint Diagnosis (يدوي)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pandas openpyxl
      - name: Diagnose bulk import endpoint (single item)
        env:
          JAHEZ_TOKEN: ${{ secrets.JAHEZ_TOKEN }}
          JAHEZ_STORE_ID: ${{ secrets.JAHEZ_STORE_ID }}
        run: python jahez_diagnose_bulk_import.py
      - name: Commit probe result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jahez_bulk_import_probe.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "🔬 نتيجة فحص endpoint الرفع الجماعي"
          git push https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git HEAD:main
