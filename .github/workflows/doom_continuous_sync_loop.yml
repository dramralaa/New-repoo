# 🔁 13 سبتمبر 2026 - "الحل الجذري" المطلوب صراحة من صاحب المشروع بعد إثبات
# متكرر (بأدلة مباشرة من GitHub API نفسه) إن GitHub Actions' `schedule:` trigger
# مش موثوق بيه لهذا الحساب/الريبو: شفنا تشغيلات ناجحة الساعة 06:04-06:12 UTC
# ثم **صفر تشغيلات** لأكتر من 75 دقيقة بعدها رغم إن الجدولة كل 15 دقيقة (خمس
# تشغيلات كان المفروض تحصل ومحصلتش). ده نفس النمط اللي شفناه أكتر من مرة طول
# الجلسة دي - تفريق دقايق الـcron وتقليل عدد الـworkflows المسجّلة قللوا المشكلة
# لكن محلوهاش. بالمقابل: **كل تشغيلة workflow_dispatch طول الجلسة دي (عشرات
# التشغيلات) اشتغلت خلال 1-4 ثواني بدون استثناء واحد** - يعني المشكلة تحديدًا في
# محرك جدولة `schedule:`، مش في GitHub Actions نفسها كمنصة.
#
# الحل: workflow واحد طويل التشغيل (job واحد، loop داخلي بـsleep) بيعمل كل
# المزامنات (fast price/jahez + hungerstation + فحص التأخير) كل ~15 دقيقة نهارًا
# / ~ساعتين ليلًا **من غير أي اعتماد على GitHub schedule للتكرار** - بيفضل شغال
# لحد ما يقرب من سقف الـ6 ساعات (الحد الأقصى الصلب لأي job على GitHub-hosted
# runners)، وقبل ما يخلص بيعمل self-relaunch (workflow_dispatch API call لنفسه)
# عشان يبدأ نافذة تانية فورًا - سلسلة تشغيلات ذاتية التجديد مش محتاجة schedule
# غير كـshبكة أمان نادرة جدًا (كل 4 ساعات) لو السلسلة اتقطعت لأي سبب.
#
# ⚠️ 13 سبتمبر 2026 - بطلب صريح من صاحب المشروع، جدولة fast_price_stock_sync.yml
# وhungerstation_stock_sync.yml القديمة **اتسابت شغالة زي ما هي** (مصدر مزامنة
# إضافي احتياطي، مش اعتماد وحيد) بدل ما تتعطّل - يعني ممكن يحصل كتابة متزامنة
# على data/sync_delay_alert_state.json المشترك بين التلاتة workflows دلوقتي (مش
# اتنين بس). ده متعامَل معاه فعليًا بنفس آلية إعادة المحاولة (fetch+rebase+push
# مع GIT_EDITOR=true) في الثلاثة كلهم - مُثبَتة شغالة من فحص حي سابق في نفس
# اليوم. التكرار ده مقصود ومقبول: لو المحرك القديم (schedule) نجح يشتغل في نفس
# اللحظة، مفيش ضرر - نتيجة متطابقة، وإعادة المحاولة بتحل أي تعارض عادي.
#
# 🗄️ 13 سبتمبر 2026 - إضافة: بناء الكاش اليومي لتقارير "صفحة دوم التجريبية"
# (doom_trial_report على فرع claude/assortment-webhook-discovery-a4mxc6 في نفس
# ريبو juleb-daily-report - فرع منفصل عن main، محتاج checkout ثاني مستقل في
# مجلد فرعي trial_repo/). اتضاف checkout ثاني + خطوة build_trial_cache_once_daily
# جوه نفس اللوب الموجود، بتشتغل مرة واحدة بس كل يوم تقويمي (بتوقيت الرياض - علامة
# ملف .last_build_date بتمنع تكرارها كل نص ساعة) وبتـcommit/push نتيجتها
# (doom_trial_report/data_cache/*.json) لفرعها هي، منفصل تمامًا عن commit/push
# التطبيق الرئيسي على main. باقي خطوات اللوب (fast price/jahez/hungerstation)
# فضلت زي ما هي بالظبط، تعمل كل تكرار عادي.
#
# 🔁 13 سبتمبر 2026 (بعد الظهر) - **الجذر الحقيقي لتأخير منصة دوم التجريبية
# المُبلَّغ عنه (٥٤ دقيقة ثم ٧٥ دقيقة)**: المنصة دي بتتعرض من فرع Streamlit Cloud
# منفصل عن main، وكانت بتاخد بيانات data/*.json الجديدة بس عن طريق workflow تاني
# منفصل (doom_trial_report_branch_sync.yml) بيعتمد **حصريًا على GitHub schedule
# trigger** - نفس محرك الجدولة اللي أثبتنا عدم موثوقيته لباقي الأتمتة في المشروع
# ده (فحص حي: فجوة حقيقية 9 ساعات و20 دقيقة صفر تشغيلات رغم جدولة كل 15 دقيقة،
# ثم فجوة تانية أكتر من ساعة). يعني main نفسه كان دايمًا محدَّث (الحلقة المستمرة
# دي شغالة بثبات كل ~16-30 دقيقة، مؤكَّد بفحص تاريخ الكوميتات) لكن الفرع اللي
# المنصة بتتعرض منه كان بياخد التحديثات دي متأخر بسبب اعتماده على schedule.
# الحل: خطوة sync_trial_branch_with_main() جديدة تحت - بتعمل نفس "git merge main"
# اللي كان بيعملها doom_trial_report_branch_sync.yml، لكن **جوّه نفس الحلقة
# المستمرة ذاتية التجديد** (بدون أي اعتماد على schedule إطلاقًا) - تشتغل كل دورة
# عادية (كل ~16-30 دقيقة نهارًا)، مش مرة كل يوم زي بناء الكاش. الـworkflow القديم
# (doom_trial_report_branch_sync.yml) اتسابت شغالة زي ما هي كمصدر احتياطي إضافي
# (نفس فلسفة الاحتفاظ بالجدولة القديمة لباقي الأتمتة) - أي دمج مكرر منها غير
# ضار (idempotent)، لو نجحت قبل الحلقة أو بعدها.
# 🗄️ 14 سبتمبر 2026 - **معطّلة نهائيًا**. استُبدلت بالكامل بأربع حلقات معزولة
# مستقلة (doom_sync_loop_juleb_bridge.yml، doom_sync_loop_jahez.yml،
# doom_sync_loop_hungerstation.yml، doom_sync_loop_trial_platform.yml) +
# حلقة مراقبة منفصلة (doom_sync_loop_watchdog.yml) - راجع PROJECT_CONTEXT.md
# قسم "بنية الأتمتة" لتفاصيل السبب (تعطّل هنجرستيشن 4.5 ساعة بصمت جوّه هذه
# الحلقة المشتركة يوم 13 سبتمبر، بلا أي تأثير ظاهر على باقي الحلقة، واستحال
# تشخيصه إلا بعد ساعات). الـschedule وخطوة self-relaunch اتشالوا هنا عمدًا -
# التشغيلة النشطة وقت التبديل اتلغيت يدويًا بعد التأكد إن الحلقات الجديدة
# شغالة فعليًا (صفر فجوة تغطية). الملف متروك كمرجع تاريخي فقط.
name: 🔁 [DOOM] Continuous Sync Loop (معطّلة - استُبدلت بـ4 حلقات معزولة، راجع PROJECT_CONTEXT.md)

on:
  workflow_dispatch:

concurrency:
  group: doom-continuous-sync-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      # 🗄️ 13 سبتمبر 2026 - checkout ثاني مستقل لفرع صفحة دوم التجريبية (فرع تاني
      # تمامًا عن main، نفس الريبو) - في مجلد فرعي trial_repo/ جنب الـcheckout
      # الأساسي فوق، عشان بناء الكاش اليومي ليها يتم من غير أي تعارض مع تشيك آوت
      # main العادي (اللي باقي خطوات اللوب شغالة عليه زي ما هي).
      - name: Checkout doom_trial_report (فرع منفصل)
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          ref: claude/assortment-webhook-discovery-a4mxc6
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: trial_repo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pytz requests
      - name: Continuous sync loop (~5.5 ساعة، بيتجدد ذاتيًا بعدها)
        id: syncloop
        env:
          JULEB_URL: ${{ secrets.JULEB_URL }}
          JULEB_DB: ${{ secrets.JULEB_DB }}
          JULEB_USER: ${{ secrets.JULEB_USER }}
          JULEB_PASS: ${{ secrets.JULEB_PASS }}
          # 🗄️ نفس أسرار جوليب بتاعة دوم فوق، بس متسمّاة بـ_DOOM هنا (تسمية env vars
          # اللي cache_builder.py الجديد بيقرأها - نفس أسلوب aliasing الموجود فعلاً
          # في doom_gemini_financial_analyst_monthly.yml).
          JULEB_URL_DOOM: ${{ secrets.JULEB_URL }}
          JULEB_DB_DOOM: ${{ secrets.JULEB_DB }}
          JULEB_USER_DOOM: ${{ secrets.JULEB_USER }}
          JULEB_PASS_DOOM: ${{ secrets.JULEB_PASS }}
          JAHEZ_TOKEN: ${{ secrets.JAHEZ_TOKEN }}
          JAHEZ_STORE_ID: ${{ secrets.JAHEZ_STORE_ID }}
          JAHEZ_WRITE_ENABLED: ${{ secrets.JAHEZ_WRITE_ENABLED }}
          HUNGERSTATION_CLIENT_ID: ${{ secrets.HUNGERSTATION_CLIENT_ID }}
          HUNGERSTATION_CLIENT_SECRET: ${{ secrets.HUNGERSTATION_CLIENT_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOKEN_DOOM: ${{ secrets.TELEGRAM_TOKEN_DOOM }}
          TELEGRAM_CHAT_ID_DOOM: ${{ secrets.TELEGRAM_CHAT_ID_DOOM }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          export GIT_EDITOR=true
          (cd trial_repo && git config user.name "github-actions[bot]" && git config user.email "github-actions[bot]@users.noreply.github.com")

          START=$(date +%s)
          DURATION=$((340 * 60))
          ITER=0

          # 🔁 13 سبتمبر 2026 (بعد الظهر) - دمج main في فرع دوم التجريبية، كل دورة
          # عادية (مش مرة كل يوم زي بناء الكاش تحت) - ده بديل موثوق لـ
          # doom_trial_report_branch_sync.yml اللي كان بيعتمد على GitHub schedule
          # وحده (فجوات حقيقية أثبتناها تعدّي 9 ساعات). صفر تعارضات متوقعة (main
          # مالوش doom_trial_report/ أصلاً - الفرعين بيلمسوا ملفات مختلفة تمامًا).
          sync_trial_branch_with_main() {
            (
              cd trial_repo || exit 1
              git fetch origin main
              if ! git merge origin/main --no-edit -m "🔄 دمج main تلقائي (تحديث بيانات الداشبورد التجريبي)"; then
                echo "⚠️ تعارض دمج حقيقي بين main وفرع دوم التجريبية (غير متوقع حسب التصميم) - إلغاء الدمج والمحاولة تاني الدورة الجاية"
                git merge --abort || true
                exit 0
              fi
              for i in 1 2 3; do
                if git push origin claude/assortment-webhook-discovery-a4mxc6; then
                  echo "✅ دمج main لفرع دوم التجريبية نجح ودفع بنجاح (محاولة $i)"
                  exit 0
                fi
                echo "⚠️ فشل push دمج main لفرع دوم التجريبية (محاولة $i) - إعادة محاولة بعد دمج آخر نسخة من الفرع"
                git fetch origin claude/assortment-webhook-discovery-a4mxc6
                git merge origin/claude/assortment-webhook-discovery-a4mxc6 --no-edit || true
                sleep $((i * 3))
              done
              echo "::error::فشل push دمج main لفرع دوم التجريبية نهائيًا بعد 3 محاولات - هنحاول تاني الدورة الجاية"
            )
          }

          # 🗄️ 13 سبتمبر 2026 - بناء الكاش اليومي لتقارير صفحة دوم التجريبية، مرة
          # واحدة بس كل يوم تقويمي بتوقيت الرياض (علامة .last_build_date بتمنع
          # التكرار كل نص ساعة زي باقي مزامنات اللوب - بناء الكاش أبطأ نسبيًا).
          # نفس آلية fetch+rebase+push لـcommit_and_push() تحت، لكن على فرع
          # trial_repo المنفصل بدل main.
          build_trial_cache_once_daily() {
            local today_riyadh
            today_riyadh=$(TZ=Asia/Riyadh date +%F)
            local marker="trial_repo/doom_trial_report/data_cache/.last_build_date"
            if [ -f "$marker" ] && [ "$(cat "$marker")" = "$today_riyadh" ]; then
              echo "كاش صفحة دوم التجريبية اتبنى خلاص النهاردة ($today_riyadh) - تخطي."
              return 0
            fi
            echo "🗄️ بناء كاش صفحة دوم التجريبية اليومي ($today_riyadh)..."
            if ! (cd trial_repo/doom_trial_report && python cache_builder.py); then
              echo "⚠️ فشل بناء كاش صفحة دوم التجريبية في هذه الدورة - هنحاول تاني الدورة الجاية (آخر كاش صالح فضل زي ما هو)"
              return 0
            fi
            mkdir -p "trial_repo/doom_trial_report/data_cache"
            echo "$today_riyadh" > "$marker"
            (
              cd trial_repo || exit 1
              git add doom_trial_report/data_cache/*.json doom_trial_report/data_cache/.last_build_date 2>/dev/null || true
              if git diff --cached --quiet; then
                echo "لا يوجد تغيير فعلي في كاش صفحة دوم التجريبية هذه الدورة."
                exit 0
              fi
              git commit -m "🗄️ تحديث الكاش اليومي لتقارير صفحة دوم التجريبية ($today_riyadh)"
              for i in 1 2 3 4 5; do
                if git push; then
                  echo "✅ Push كاش دوم التجريبية نجح (محاولة $i)"
                  exit 0
                fi
                echo "⚠️ Push كاش دوم التجريبية فشل (محاولة $i) - إعادة محاولة بعد rebase"
                git fetch origin claude/assortment-webhook-discovery-a4mxc6
                if ! git rebase origin/claude/assortment-webhook-discovery-a4mxc6; then
                  git checkout --theirs doom_trial_report/data_cache/.last_build_date 2>/dev/null || true
                  git add doom_trial_report/data_cache/.last_build_date 2>/dev/null || true
                  git rebase --continue || git rebase --abort
                fi
                sleep $((i * 3))
              done
              echo "::error::فشل push كاش دوم التجريبية نهائيًا بعد 5 محاولات - هنكمل باقي اللوب برضه"
            )
          }

          commit_and_push() {
            git add data/products.json data/stock_balance.json data/jahez_sync.json \
                    data/hungerstation_stock_sync_last_run.json data/hungerstation_our_writes_log.json \
                    data/sync_delay_alert_state.json 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "لا يوجد تغيير فعلي في هذه الدورة."
              return 0
            fi
            git commit -m "🔁 نتيجة دورة مزامنة مستمرة #$ITER ($(date -u +%H:%M) UTC)"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "✅ Push نجح (دورة $ITER، محاولة $i)"
                return 0
              fi
              echo "⚠️ Push فشل (دورة $ITER، محاولة $i) - إعادة محاولة بعد rebase"
              git fetch origin main
              if ! git rebase origin/main; then
                git checkout --theirs data/sync_delay_alert_state.json 2>/dev/null || true
                git add data/sync_delay_alert_state.json
                git rebase --continue || git rebase --abort
              fi
              sleep $((i * 3))
            done
            echo "::error::فشل push دورة $ITER نهائيًا بعد 5 محاولات - هنكمل باقي اللوب برضه"
          }

          while true; do
            ITER=$((ITER + 1))
            echo "════════ دورة رقم $ITER - $(date -u '+%Y-%m-%d %H:%M:%S') UTC ════════"

            python claude_data_bridge_fast.py || echo "⚠️ claude_data_bridge_fast فشل في هذه الدورة - هنحاول تاني الدورة الجاية"
            python jahez_sync_run.py || echo "⚠️ jahez_sync_run فشل في هذه الدورة"
            python hungerstation_stock_sync.py || echo "⚠️ hungerstation_stock_sync فشل في هذه الدورة"
            python sync_delay_watchdog.py || true

            commit_and_push
            sync_trial_branch_with_main
            build_trial_cache_once_daily

            NOW=$(date +%s)
            ELAPSED=$((NOW - START))
            if [ $ELAPSED -ge $DURATION ]; then
              echo "انتهت نافذة الـ~5.5 ساعة (${ITER} دورة) - هيتعمل self-relaunch في الخطوة الجاية."
              break
            fi

            H=$(date -u +%H)
            if [ "$H" -ge 23 ] || [ "$H" -lt 6 ]; then
              SLEEP=7200   # نافذة الليل (2-9 صباحًا الرياض تقريبًا) - كل ساعتين
            else
              SLEEP=1800   # نهارًا - كل 30 دقيقة (13 سبتمبر 2026: قللناها من 15 دقيقة
                           # بطلب صريح بعد ما اتأكد إن الحلقة ملتزمة بالتوقيت 100%)
            fi
            REMAINING=$((DURATION - ELAPSED))
            if [ $SLEEP -gt $REMAINING ]; then
              SLEEP=$REMAINING
            fi
            echo "نايم $SLEEP ثانية قبل الدورة الجاية..."
            sleep $SLEEP
          done
      # 🗄️ 14 سبتمبر 2026 - خطوة self-relaunch اتشالت نهائيًا (كانت هنا تعيد
      # تشغيل هذه الحلقة كل ~5.5 ساعة) - الحلقة دي معطّلة بالكامل، استُبدلت
      # بأربع حلقات معزولة (راجع تعليق أعلى الملف + PROJECT_CONTEXT.md).
