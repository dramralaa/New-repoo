# 🔁 16 سبتمبر 2026 - حلقة مزامنة مستقلة تمامًا لهنجرستيشن - نسخة فيرا من
# doom_sync_loop_hungerstation.yml بالحرف. بتستبدل vera_hungerstation_stock_sync.yml
# (جدولة `schedule:` وحدها - أثبتت فجوات حقيقية بالساعات في الممارسة، نفس
# مشكلة دوم الموثّقة في doom_sync_loop_hungerstation.yml). كل التزامن على
# `main` (مصدر الجدولة الحقيقي)، مش أي فرع تطوير.
name: 🔁 [VERA] Sync Loop - Hungerstation (رصيد)

on:
  workflow_dispatch:
  schedule:
    - cron: '35 * * * *'

concurrency:
  group: vera-sync-loop-hungerstation
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pytz requests
      - name: Continuous sync loop (~5.5 ساعة، بيتجدد ذاتيًا بعدها)
        env:
          PLATFORM_PAUSE: ${{ vars.PLATFORM_PAUSE }}
          VERA_URL: ${{ secrets.VERA_URL }}
          VERA_DB: ${{ secrets.VERA_DB }}
          VERA_USER: ${{ secrets.VERA_USER }}
          VERA_PASS: ${{ secrets.VERA_PASS }}
          VERA_HUNGERSTATION_CLIENT_ID: ${{ secrets.VERA_HUNGERSTATION_CLIENT_ID }}
          VERA_HUNGERSTATION_CLIENT_SECRET: ${{ secrets.VERA_HUNGERSTATION_CLIENT_SECRET }}
          VERA_HS_WRITE_ENABLED: ${{ secrets.VERA_HS_WRITE_ENABLED }}
          # 💲 25 سبتمبر 2026: تعديل السعر اتفعّل بقرار صاحب المشروع (مزامنة فيرا زي دوم) -
          # سعر جوليب النهائي شامل الضريبة، والتغييرات الكبيرة (> الضعف أو < النص) بتتحجز للمراجعة.
          VERA_HS_PRICE_WRITE_ENABLED: "1"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          export GIT_EDITOR=true

          START=$(date +%s)
          DURATION=$((340 * 60))
          ITER=0

          run_with_health() {
            local name="$1" script="$2" timeout_sec="$3"
            local outfile="/tmp/${name}_output.log"
            local code=0
            # 🛡️ 29 أكتوبر 2026 (PLATFORM_LOAD_RULES.md): زرار إيقاف + فرملة تلقائية + عدّاد طلبات (من غير أي تعديل في السكربت)
            if ! python platform_guard.py check "$name"; then return 0; fi
            rm -f "/tmp/${name}_meter.json"
            PYTHONPATH="$PWD/platform_meter_boot${PYTHONPATH:+:$PYTHONPATH}" PLATFORM_METER_FILE="/tmp/${name}_meter.json" \
              timeout "$timeout_sec" python "$script" > "$outfile" 2>&1 || code=$?
            [ $code -eq 124 ] && ANY_TIMEOUT=1
            if [ $code -eq 0 ]; then
              tail -5 "$outfile"
            else
              echo "⚠️ $name فشل (exit=$code) - آخر 20 سطر من الناتج:"
              tail -20 "$outfile"
            fi
            python sync_health_recorder.py "$name" "$code" "$outfile"
          }

          commit_and_push() {
            git add data/hs_catalog_cache 2>/dev/null || true; git add data/hs_price_gate.json 2>/dev/null || true
            git add data/health/hs_price_sync.json 2>/dev/null || true
            git add data/vera_hungerstation_stock_sync_last_run.json data/vera_hungerstation_price_sync.json \
                    data/vera_delivery_audit.json data/vera_hungerstation_price_canary.json \
                    data/health/vera_hungerstation.json data/health/vera_hungerstation_price.json \
                    data/health/vera_delivery_audit.json data/health/vera_hungerstation_price_canary.json 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "لا يوجد تغيير فعلي في هذه الدورة."
              return 0
            fi
            git commit -m "🔁 هنجرستيشن فيرا - دورة #$ITER ($(date -u +%H:%M) UTC)"
            for i in 1 2 3 4 5; do
              if timeout 60 git push; then
                echo "✅ Push نجح (دورة $ITER، محاولة $i)"
                return 0
              fi
              echo "⚠️ Push فشل (دورة $ITER، محاولة $i) - إعادة محاولة بعد rebase"
              timeout 60 git fetch origin main
              if ! git rebase origin/main; then
                git checkout --theirs data/vera_hungerstation_stock_sync_last_run.json data/vera_hungerstation_price_sync.json \
                        data/vera_delivery_audit.json data/health/vera_hungerstation.json \
                        data/health/vera_hungerstation_price.json data/health/vera_delivery_audit.json 2>/dev/null || true
                git add data/vera_hungerstation_stock_sync_last_run.json data/vera_hungerstation_price_sync.json \
                        data/vera_delivery_audit.json data/health/vera_hungerstation.json \
                        data/health/vera_hungerstation_price.json data/health/vera_delivery_audit.json 2>/dev/null || true
                git checkout --theirs data/hs_catalog_cache data/hs_price_gate.json data/health/hs_price_sync.json 2>/dev/null || true
                git add data/hs_catalog_cache data/hs_price_gate.json data/health/hs_price_sync.json 2>/dev/null || true
                git rebase --continue || git rebase --abort
              fi
              sleep $((i * 3))
            done
            echo "::error::فشل push دورة $ITER نهائيًا بعد 5 محاولات - هنكمل باقي اللوب برضه"
          }

          while true; do
            ITER=$((ITER + 1))
            # 🔄 25 سبتمبر 2026: كل دورة تبدأ من آخر main (بيانات جوليب + ملفات الربط/الإخفاء + الكود).
            # قبل كده الـcheckout كان بيتحدث بس لما الـpush يفشل ويعمل rebase.
            timeout 60 git fetch -q origin main && git reset -q --hard origin/main || echo "⚠️ تعذّر تحديث النسخة - هنكمل بالموجود"
            echo "════════ هنجرستيشن فيرا - دورة رقم $ITER - $(date -u '+%Y-%m-%d %H:%M:%S') UTC ════════"

            run_with_health vera_hungerstation vera_hungerstation_stock_sync.py 600
            # 🛡️ 30 أكتوبر 2026: الأسعار بقت جوه طلب مزامنة الرصيد (نافذة الفجر) - الخطوة دي مجرد رسالة، مفيش طلب لهنجر منها.
            run_with_health vera_hungerstation_price vera_hungerstation_price_sync.py 300
            # تقرير تحقق موحد، قراءة ملفات النتائج فقط؛ لا كتابة على أي منصة.
            run_with_health vera_delivery_audit vera_delivery_audit.py 60
            # 🛡️ 30 أكتوبر 2026: الـCanary اتشال نهائيًا (كان طلب PUT مستقل خارج الدورة - قواعد هنجر: طلب واحد لكل فرع).

            commit_and_push

            NOW=$(date +%s)
            ELAPSED=$((NOW - START))
            if [ $ELAPSED -ge $DURATION ]; then
              echo "انتهت نافذة الـ~5.5 ساعة (${ITER} دورة) - هيتعمل self-relaunch في الخطوة الجاية."
              break
            fi

            H=$(date -u +%H)
            if [ "$H" -ge 23 ] || [ "$H" -lt 6 ]; then
              SLEEP=7200
            else
              SLEEP=3600
            fi
            if [ "${ANY_TIMEOUT:-0}" = "1" ]; then
              SLEEP=$((SLEEP * 2)); [ $SLEEP -gt 7200 ] && SLEEP=7200
              echo "🛑 فرملة تلقائية: دورة وصلت للحد الأقصى للوقت (المنصة بطيئة) - تباعد الدورة الجاية لـ $SLEEP ثانية"
            fi
            ANY_TIMEOUT=0
            REMAINING=$((DURATION - ELAPSED))
            if [ $SLEEP -gt $REMAINING ]; then
              SLEEP=$REMAINING
            fi
            echo "نايم $SLEEP ثانية قبل الدورة الجاية..."
            sleep $SLEEP
          done
      - name: Self-relaunch (بدء نافذة ~5.5 ساعة تانية فورًا)
        if: always()
        run: |
          curl -sS -X POST \
            -H "Authorization: token ${{ secrets.CROSS_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/vera_sync_loop_hungerstation.yml/dispatches" \
            -d '{"ref":"main"}'
