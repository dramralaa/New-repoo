# فحص حاسم قبل أي كتابة على نطاق واسع (879 تفعيل + ~950 تصحيح سعر) - راجع
# hungerstation_write_retest_9sep.py في juleb-daily-report للسياق الكامل.
# Checkout للـbranch مباشرة (السكريبت لسه مش على main).
name: HS Write Retest 9 Sept (manual)

on:
  workflow_dispatch:

jobs:
  retest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report (branch)
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          ref: claude/assortment-webhook-discovery-a4mxc6
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Retest write capability
        env:
          HUNGERSTATION_CLIENT_ID: ${{ secrets.HUNGERSTATION_CLIENT_ID }}
          HUNGERSTATION_CLIENT_SECRET: ${{ secrets.HUNGERSTATION_CLIENT_SECRET }}
        run: python hungerstation_write_retest_9sep.py
