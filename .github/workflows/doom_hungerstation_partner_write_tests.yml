# First real writes via the official Hungerstation Partner API, explicitly
# authorized by the project owner: activate one real in-stock product,
# update price on another (same value, schema test), and create one
# clearly-fake test SKU kept inactive. Re-reads the catalog after to
# confirm actual resulting state.
name: HS Partner API Write Tests (manual)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Run write tests
        env:
          HUNGERSTATION_CLIENT_ID: ${{ secrets.HUNGERSTATION_CLIENT_ID }}
          HUNGERSTATION_CLIENT_SECRET: ${{ secrets.HUNGERSTATION_CLIENT_SECRET }}
        run: python hungerstation_partner_write_tests.py
