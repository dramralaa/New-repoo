# 🛰️ 6 أكتوبر 2026 - بيستلم عناوين API صفحة "الطلبات" في بوابة هنجرستيشن من سكريبت Tampermonkey (v1.1)
# ويحفظها في data/hs_orders_api_capture.json - عشان نبني سحب الطلبات الملغية تلقائي. مفيش أي توكن في البيانات دي.
name: 🛰️ [HS] استلام عناوين صفحة الطلبات (تلقائي من المتصفح)

on:
  repository_dispatch:
    types: [hs_orders_api_captured]

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - name: Save capture
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          F=data/hs_orders_api_capture.json
          python3 - <<'PY'
          import json, os, re, time
          d = json.loads(os.environ["PAYLOAD"])
          s = re.sub(r"eyJ[\w-]+\.[\w-]+(\.[\w-]+)?", "<jwt>", json.dumps(d, ensure_ascii=False))
          out = {"received_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), **json.loads(s)}
          json.dump(out, open("data/hs_orders_api_capture.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          print(len(out.get("calls") or []), "calls")
          PY
          cp "$F" /tmp/c.json
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/c.json "$F" && git add "$F"
            git diff --cached --quiet && exit 0
            git commit -q -m "🛰️ عناوين صفحة طلبات هنجرستيشن"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
