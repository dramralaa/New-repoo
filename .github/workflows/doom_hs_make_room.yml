# 🧹 7 أكتوبر 2026 - تفضية مكان في متجر هنجرستيشن (أصناف مقفولة رصيدها صفر) - يدوي فقط
name: 🧹 [DOOM HS] تفضية مكان في المتجر (يدوي)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan = read only, delete = remove the chosen listings'
        required: false
        default: 'plan'
      vendor_id:
        description: 'Store id'
        required: false
        default: '194824'
      limit:
        description: 'Max listings to remove (0 = only as many as needed)'
        required: false
        default: '0'

concurrency:
  group: doom-hs-make-room
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests cryptography
      - name: Make room
        env:
          MODE: ${{ github.event.inputs.mode }}
          HS_VENDOR_ID: ${{ github.event.inputs.vendor_id }}
          LIMIT: ${{ github.event.inputs.limit }}
          HS_PORTAL_USER: ${{ secrets.HS_PORTAL_USER }}
          HS_PORTAL_PASS: ${{ secrets.HS_PORTAL_PASS }}
        run: python doom_hs_make_room.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          mkdir -p /tmp/keep && cp data/doom_hs_make_room_*.json data/hs_portal_device_doom.enc /tmp/keep/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/keep/* data/ 2>/dev/null || true
            git add data/doom_hs_make_room_*.json data/hs_portal_device_doom.enc 2>/dev/null || true
            git diff --cached --quiet && exit 0
            git commit -q -m "🧹 تفضية مكان في متجر هنجرستيشن"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
