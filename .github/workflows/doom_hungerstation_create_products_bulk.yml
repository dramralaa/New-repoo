# ⚠️ 16 سبتمبر 2026 - ريبو ده Public: اتشال أي معرّف/سياق عمل حقيقي من هنا.
# التفاصيل التشغيلية الكاملة موجودة بس في الريبو الخاص المقابل.
#
# Creates real products on Hungerstation via CreateProductsBulk. Token comes in
# as a short-lived workflow_dispatch input only, never stored. Fully manual,
# no schedule. Required secret: CROSS_REPO_TOKEN.
name: HS Create Products Bulk (manual)

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Live Bearer token from partner-app.hungerstation.com (short-lived, not stored)'
        required: true
      limit:
        description: 'Max barcodes to process (start with 1 to test a single item and confirm visually on the portal first!)'
        required: false
        default: '1'
      active_default:
        description: 'Default active flag for new items (false = catalog depth only, true = orderable immediately)'
        required: false
        default: 'false'
      vendor_id:
        description: 'HungerStation platformVendorId (store) to push the catalog to'
        required: false
        default: '186329'

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Create products bulk on Hungerstation
        env:
          HS_TOKEN: ${{ github.event.inputs.token }}
          MAX_BARCODES: ${{ github.event.inputs.limit }}
          ACTIVE_DEFAULT: ${{ github.event.inputs.active_default }}
          HS_VENDOR_ID: ${{ github.event.inputs.vendor_id }}
        run: python hungerstation_create_products_bulk.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          export GIT_EDITOR=true
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          git add data/hungerstation_create_products_result*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "لا يوجد تغيير في ملف النتيجة."
            exit 0
          fi
          git commit -m "Hungerstation CreateProductsBulk result"
          for i in 1 2 3 4 5; do
            if timeout 60 git push origin HEAD:main; then
              echo "✅ Push نجح (محاولة $i)"
              exit 0
            fi
            echo "⚠️ Push فشل (محاولة $i) - إعادة محاولة بعد rebase"
            timeout 60 git fetch origin main
            if ! git rebase origin/main; then
              git checkout --theirs data/hungerstation_create_products_result*.json 2>/dev/null || true
              git add data/hungerstation_create_products_result*.json 2>/dev/null || true
              git rebase --continue || git rebase --abort
            fi
            sleep $((i * 3))
          done
          echo "::error::فشل push نتيجة الرفع بعد 5 محاولات"
