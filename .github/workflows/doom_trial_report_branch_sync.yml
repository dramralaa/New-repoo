# 🔄 12 سبتمبر 2026 - الداشبورد التجريبي (doom_trial_report) بينتشر على Streamlit
# Cloud من فرع claude/assortment-webhook-discovery-a4mxc6 (مش main) - راجع
# PROJECT_CONTEXT.md لتفاصيل الاكتشاف. كل أتمتة المزامنة (هنجرستيشن/جاهز) بتعمل
# commit على main بس، فأي صفحة في التقرير التجريبي بتعرض بيانات حية (زي حالة
# التحديث) كانت بتفضل عالقة على وقت آخر merge يدوي - ساعات كتير من التأخير.
#
# الحل: دمج main تلقائيًا في الفرع ده (merge بسيط، صفر تعارضات متوقعة لأن الفرع ده
# مالوش تعديلات خاصة بيه غير صفحات doom_trial_report نفسها).
#
# ⚠️ 12 سبتمبر 2026 - أضفنا workflow_run بيشتغل تلقائيًا فور ما "Fast Price/Stock
# Sync" ينجح (المصدر الأساسي دلوقتي)، مع الاحتفاظ بـschedule احتياطي بس بدقيقة
# مُفرَّقة (مش */15 المستديرة) كشبكة أمان لو workflow_run اتأخر أو المصدر بتاعه
# فشل - schedule خاص بورك فلوز جديدة (زي watchdog التأخير قبل كده) كان بالكاد
# بيشتغل من غير ما يتلغي، على الأرجح بسبب تكدّس/سقف تزامن على مستوى الحساب كله،
# فمش آمن نعتمد عليه لوحده كمصدر تشغيل وحيد.
name: 🔄 [DOOM] Sync Trial Report Branch with main

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["⚡ [DOOM] Fast Price/Stock Sync - Jahez (كل ١٥ دقيقة نهارًا، كل ساعتين ليلًا)"]
    types: [completed]
  schedule:
    - cron: '42 6-22 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed branch
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          ref: claude/assortment-webhook-discovery-a4mxc6
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          fetch-depth: 0
      # 🐛 12 سبتمبر 2026 - ده الـworkflow الوحيد اللي بيكتب على هذا الفرع، لكن
      # لو workflow_run والـschedule الاحتياطي اشتغلوا قريب من بعض (نادر لكن
      # ممكن)، push ممكن يتصادم مع نفسه. بخلاف الـworkflows التانية، هنا
      # بنستخدم "git merge" مش "git rebase" - الـmerge مع --no-edit مايحتاجش
      # EDITOR خالص فمافيش نفس مشكلة "rebase --continue"، فإعادة المحاولة هنا
      # بسيطة (fetch + merge + push بس، بدون تعقيد حل تعارض).
      - name: Merge main and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pushed=0
          for i in 1 2 3 4 5; do
            git fetch origin main
            git fetch origin claude/assortment-webhook-discovery-a4mxc6
            git reset --hard origin/claude/assortment-webhook-discovery-a4mxc6
            git merge origin/main --no-edit -m "🔄 دمج main تلقائي (تحديث بيانات الداشبورد التجريبي)" || (echo "::error::تعارض دمج حقيقي - محتاج تدخّل يدوي" && exit 1)
            if git diff --quiet HEAD origin/claude/assortment-webhook-discovery-a4mxc6; then
              echo "الفرع محدّث فعلًا - لا داعي للـpush"
              pushed=1
              break
            fi
            if git push origin claude/assortment-webhook-discovery-a4mxc6; then
              echo "Push succeeded"
              pushed=1
              break
            fi
            echo "Push attempt $i failed - retrying"
            sleep $((i * 3))
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::فشل push دمج main نهائيًا بعد 5 محاولات"
            exit 1
          fi
