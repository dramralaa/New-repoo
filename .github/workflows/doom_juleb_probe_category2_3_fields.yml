# 🔍 يدوّر على الأسماء التقنية الحقيقية لحقلي "Category 2" (Chronic/Others) و
# "Category 3" (CNS) في جوليب - ظاهرين في واجهة المستخدم لكن مش معروف اسمهم التقني.
# يدوي بالكامل، قراءة فقط. الأسرار المطلوبة: CROSS_REPO_TOKEN, JULEB_URL, JULEB_DB,
# JULEB_USER, JULEB_PASS
name: 🔍 [DOOM] Juleb Probe Category 2/3 Fields (يدوي)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          ref: claude/assortment-webhook-discovery-a4mxc6
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Probe Category 2/3 fields
        env:
          JULEB_URL: ${{ secrets.JULEB_URL }}
          JULEB_DB: ${{ secrets.JULEB_DB }}
          JULEB_USER: ${{ secrets.JULEB_USER }}
          JULEB_PASS: ${{ secrets.JULEB_PASS }}
        run: python juleb_probe_category2_3_fields.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/juleb_category2_3_field_probe.json data/juleb_category2_3_field_probe_samples.json
          git diff --cached --quiet || git commit -m "🔍 نتيجة فحص حقول Category 2/3 في جوليب"
          git push https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git HEAD:claude/assortment-webhook-discovery-a4mxc6
