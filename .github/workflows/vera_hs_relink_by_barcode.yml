# 🔗 16 سبتمبر 2026 - تشغيلة يدوية لمرة واحدة (هتتشال بعد الاستخدام): توسيع
# ربط أصناف فيرا-هنجرستيشن بمطابقة باركود/GTIN عامة على كامل الكتالوج (مش بس
# الـ205 زوج من ماستر أوميت). التوكن input مؤقت، مش مخزَّن.
name: 🔗 [VERA] توسيع ربط هنجرستيشن بالباركود (كامل الكتالوج)

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Live Bearer token from partner-app.hungerstation.com (VERA session, short-lived, not stored)'
        required: true

jobs:
  relink:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Relink by barcode/GTIN
        env:
          HS_TOKEN: ${{ github.event.inputs.token }}
          VERA_URL: ${{ secrets.VERA_URL }}
          VERA_DB: ${{ secrets.VERA_DB }}
          VERA_USER: ${{ secrets.VERA_USER }}
          VERA_PASS: ${{ secrets.VERA_PASS }}
        run: python vera_hungerstation_relink_by_barcode.py
      - name: Commit and push result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          export GIT_EDITOR=true
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          git add data/vera_hs_barcode_relink_result.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "لا يوجد تغيير."
            exit 0
          fi
          git commit -m "🔗 نتيجة توسيع ربط فيرا-هنجرستيشن بالباركود"
          for i in 1 2 3 4 5; do
            if timeout 60 git push origin HEAD:main; then
              exit 0
            fi
            timeout 60 git fetch origin main
            if ! git rebase origin/main; then
              git checkout --theirs data/vera_hs_barcode_relink_result.json 2>/dev/null || true
              git add data/vera_hs_barcode_relink_result.json 2>/dev/null || true
              git rebase --continue || git rebase --abort
            fi
            sleep $((i * 3))
          done
          echo "::error::فشل push نتيجة الربط بعد 5 محاولات"
