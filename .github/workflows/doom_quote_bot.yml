# 🔑 الأسرار المطلوبة هنا (نفس القيم الموجودة في juleb-daily-report):
# CROSS_REPO_TOKEN, TELEGRAM_TOKEN_DOOM, TELEGRAM_CHAT_ID_DOOM, GROQ_API_KEY
name: 🤖 [DOOM] Quote Comparison Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * *'

jobs:
  run_bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pandas requests openpyxl xlsxwriter pdfplumber
      - name: Run Bot
        env:
          TELEGRAM_TOKEN_DOOM: ${{ secrets.TELEGRAM_TOKEN_DOOM }}
          TELEGRAM_CHAT_ID_DOOM: ${{ secrets.TELEGRAM_CHAT_ID_DOOM }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          GITHUB_REPOSITORY: dramralaa/juleb-daily-report
        run: python doom_quote_bot_engine.py
