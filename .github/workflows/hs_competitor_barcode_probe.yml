# 🔍 12 أكتوبر 2026 - هل هنجر يقبل باركودات كتالوج المنافس لأصناف دوم/فيرا اللي عليها رصيد ومش معروضة؟ (قراءة بس)
name: 🔍 [DOOM+VERA HS] باركودات المنافس - فحص قبول هنجر (قراءة بس)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      max-parallel: 1
      matrix:
        brand: [DOOM, VERA]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests cryptography
      - name: Probe
        env:
          BRAND: ${{ matrix.brand }}
          HS_PORTAL_USER: ${{ secrets.HS_PORTAL_USER }}
          HS_PORTAL_PASS: ${{ secrets.HS_PORTAL_PASS }}
          VERA_HS_PORTAL_USER: ${{ secrets.VERA_HS_PORTAL_USER }}
          VERA_HS_PORTAL_PASS: ${{ secrets.VERA_HS_PORTAL_PASS }}
        run: python hs_competitor_barcode_probe.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          F=data/hs_competitor_barcode_probe_${{ matrix.brand }}.json
          L=$(echo "${{ matrix.brand }}" | tr 'A-Z' 'a-z'); D=data/hs_portal_device_$L.enc
          [ -f "$F" ] || exit 0
          cp "$F" /tmp/p.json; cp "$D" /tmp/d.enc 2>/dev/null || true
          for i in 1 2 3 4 5; do
            timeout 60 git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/p.json "$F" && git add "$F"; [ -f /tmp/d.enc ] && cp /tmp/d.enc "$D" && git add "$D"
            git diff --cached --quiet && exit 0
            git commit -q -m "🔍 باركودات المنافس على هنجر - ${{ matrix.brand }}"
            timeout 60 git push -q origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
