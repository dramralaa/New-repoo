# ♻️ 7 أكتوبر 2026 - إضافة أصناف مربوطة عند هنجرستيشن بكود قديم - يدوي فقط
name: ♻️ [DOOM HS] إضافة أصناف الكود القديم (يدوي)

on:
  workflow_dispatch:
    inputs:
      vendor_id:
        description: 'Store id'
        required: false
        default: '194824'
      limit:
        description: 'Max items to add (start with 1)'
        required: false
        default: '1'

concurrency:
  group: doom-hs-orphan-readd
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests cryptography
      - name: Make room
        env:
          HS_VENDOR_ID: ${{ github.event.inputs.vendor_id }}
          LIMIT: ${{ github.event.inputs.limit }}
          HS_PORTAL_USER: ${{ secrets.HS_PORTAL_USER }}
          HS_PORTAL_PASS: ${{ secrets.HS_PORTAL_PASS }}
        run: python doom_hs_orphan_readd.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          mkdir -p /tmp/keep && cp data/doom_hs_orphan_readd_*.json data/hs_portal_device_doom.enc /tmp/keep/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/keep/* data/ 2>/dev/null || true
            git add data/doom_hs_orphan_readd_*.json data/hs_portal_device_doom.enc 2>/dev/null || true
            git diff --cached --quiet && exit 0
            git commit -q -m "♻️ إضافة أصناف الكود القديم على هنجرستيشن"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
