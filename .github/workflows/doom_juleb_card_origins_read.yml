name: 🔎 [DOOM] أصل كروت خبراء المجتمع وتاريخ الأسعار (قراءة جوليب مرة، يدوي)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'اكتب APPROVED بعد موافقة صاحب المشروع على قراءة جوليب'
        required: true
        default: ''

concurrency:
  group: doom-juleb-card-origins
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 🛡️ تأكيد الموافقة + زرار الإيقاف
        env:
          PLATFORM_PAUSE: ${{ vars.PLATFORM_PAUSE }}
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "APPROVED" ]; then echo "متوقف: لازم تكتب APPROVED"; exit 1; fi
          case ",${PLATFORM_PAUSE,,}," in *,juleb,*|*,all,*) echo "⛔ PLATFORM_PAUSE مفعّل على جوليب"; exit 1;; esac
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: قراءة (read-only، مرة واحدة)
        env:
          JULEB_URL: ${{ secrets.JULEB_URL }}
          JULEB_DB: ${{ secrets.JULEB_DB }}
          JULEB_USER: ${{ secrets.JULEB_USER }}
          JULEB_PASS: ${{ secrets.JULEB_PASS }}
        run: python doom_juleb_card_origins_read.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          mkdir -p /tmp/keep && cp data/doom_juleb_card_origins.json /tmp/keep/
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/keep/* data/
            git add data/doom_juleb_card_origins.json 2>/dev/null || true
            git diff --cached --quiet && exit 0
            git commit -q -m "🔎 أصل كروت خبراء المجتمع وتاريخ الأسعار (قراءة جوليب مرة) [vercel skip]"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
