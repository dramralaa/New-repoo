name: HS Delete RX Items (manual)

on:
  workflow_dispatch:
    inputs:
      hs_token:
        description: 'HS_TOKEN مؤقت (Bearer، صلاحية ~4 ساعات) - من devtools المتصفح'
        required: true
        type: string

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Load token from event file (masked - never printed)
        run: |
          T=$(jq -r '.inputs.token // .inputs.hs_token // .client_payload.token // empty' "$GITHUB_EVENT_PATH")
          if [ -n "$T" ]; then echo "::add-mask::$T"; echo "HS_TOKEN=$T" >> "$GITHUB_ENV"; fi
      - name: Checkout juleb-daily-report (branch)
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          ref: claude/assortment-webhook-discovery-a4mxc6
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Delete
        run: python hungerstation_delete_rx_items.py
      - name: Commit result back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add data/hungerstation_rx_delete_result.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "Record RX delete result [vercel skip]" && git push)
