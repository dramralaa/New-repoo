# 🖼️ 2 أكتوبر 2026 - سد فجوة صور دوم (أصناف عليها رصيد ومالهاش صورة) من كل المصادر بمطابقة الباركود:
# كتالوجات هنجرستيشن (دوم + فيرا، قراءة فقط) + Open Facts + sidalih + UPCitemdb. الصور بتتحفظ في doom-product-images.
name: 🖼️ [DOOM] سد فجوة الصور من كل المصادر (يدوي)

on:
  workflow_dispatch:
    inputs:
      max_items:
        description: "أقصى عدد أصناف"
        required: false
        default: "2000"

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pytz
      - name: Fill image gap
        env:
          HUNGERSTATION_CLIENT_ID: ${{ secrets.HUNGERSTATION_CLIENT_ID }}
          HUNGERSTATION_CLIENT_SECRET: ${{ secrets.HUNGERSTATION_CLIENT_SECRET }}
          VERA_HUNGERSTATION_CLIENT_ID: ${{ secrets.VERA_HUNGERSTATION_CLIENT_ID }}
          VERA_HUNGERSTATION_CLIENT_SECRET: ${{ secrets.VERA_HUNGERSTATION_CLIENT_SECRET }}
          GITHUB_IMAGES_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          MAX_ITEMS: ${{ inputs.max_items }}
        run: python doom_image_gap_filler.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          F=data/doom_image_gap_filler_result.json
          [ -f "$F" ] || exit 0
          mkdir -p /tmp/out && cp "$F" /tmp/out/
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/out/$(basename $F) "$F" && git add "$F"
            if git diff --cached --quiet; then exit 0; fi
            git commit -q -m "🖼️ نتيجة سد فجوة صور دوم"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
