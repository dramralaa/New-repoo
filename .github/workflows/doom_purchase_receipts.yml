# 🧾 15 نوفمبر 2026 - فواتير الاستلام (صفحة Purchase Intelligence) عبر الـAPI الرسمي (قراءة فقط) بدل XML-RPC المقفول.
# تشغيل يدوي/dispatch (الحلقة LIVE بتشغّله). مجموعة تزامن مستقلة (مش doom-rest-cache) عشان مايقفش خلف الحلقة.
name: 🧾 [DOOM] فواتير الاستلام (REST)

on:
  workflow_dispatch:
    inputs:
      req_cap:
        description: 'سقف طلبات GET'
        default: '60'

concurrency:
  group: doom-purchase-receipts
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          ref: claude/assortment-webhook-discovery-a4mxc6
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          fetch-depth: 0
      # السكربت من main في مجلد منفصل - ممنوع دمج main جوه فرع النشر هنا (الـrebase في خطوة الدفع كان بيفرد الدمج ويعمل تعارض، 15 نوفمبر)
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          ref: main
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: _src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Pull receipts
        env:
          PLATFORM_PAUSE: ${{ vars.PLATFORM_PAUSE }}
          JULEB_API_KEY: ${{ secrets.JULEB_API_KEY_DOOM }}
          JULEB_API_BASE: https://medova.juleb.com/api/v1
          REQ_CAP: ${{ inputs.req_cap || '60' }}
        run: |
          [ -n "$JULEB_API_KEY" ] || { echo "⛔ مفتاح دوم غير موجود"; exit 1; }
          case ",$(echo "$PLATFORM_PAUSE" | tr 'A-Z;' 'a-z,')," in *,juleb,*|*,all,*) echo "⛔ زرار الإيقاف مفعّل"; exit 0;; esac
          RECEIPTS_OUT="$GITHUB_WORKSPACE/doom_trial_report/data_cache/purchase_receipts.json" \
          REST_STORE_PATH="$GITHUB_WORKSPACE/data/rest_store/pos_store.json" python _src/juleb_purchase_receipts_rest.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add doom_trial_report/data_cache/purchase_receipts.json data/health/purchase_receipts.json 2>/dev/null || true
          git diff --cached --quiet && { echo "لا تغيير"; exit 0; }
          git commit -q -m "🧾 فواتير الاستلام عبر REST [vercel skip]"
          for i in 1 2 3 4 5; do
            timeout 60 git push origin HEAD:claude/assortment-webhook-discovery-a4mxc6 && exit 0
            timeout 60 git fetch origin claude/assortment-webhook-discovery-a4mxc6
            git rebase -X theirs origin/claude/assortment-webhook-discovery-a4mxc6 || git rebase --abort
            sleep $((i*3))
          done
          exit 1
