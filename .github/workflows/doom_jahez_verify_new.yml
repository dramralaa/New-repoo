name: 🔍 [DOOM] تحقق أصناف جاهز الجديدة (قراءة بس)

# طلب GET واحد لكل صنف جديد (بالـid). مفيش أي كتابة. بيأكد الصنف موجود وظاهر في كتالوج التاجر (مش في فهرسة بحث التطبيق).
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Verify
        env:
          JAHEZ_TOKEN: ${{ secrets.JAHEZ_TOKEN }}
          JAHEZ_STORE_ID: ${{ secrets.JAHEZ_STORE_ID }}
        run: python jahez_verify_new_items.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jahez_new_items_verify.json data/jahez_created_items.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "🔍 تحقق أصناف جاهز الجديدة [vercel skip]"
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git rebase origin/main || git rebase --abort
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
