# 🧪 4 أكتوبر 2026 - معمل الكتابة على جوليب دوم (بموافقة صاحب المشروع: صنف واحد لليستة حوافز + صنف واحد لعرض)
name: 🧪 [DOOM] معمل الكتابة على جوليب (يدوي)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "discover (قراءة فقط) / غيرها حسب السكريبت"
        required: true
        default: discover
      args:
        description: "مدخلات إضافية للوضع (JSON)"
        required: false
        default: "{}"

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pytz
      - name: Run
        env:
          JULEB_URL: ${{ secrets.JULEB_URL }}
          JULEB_DB: ${{ secrets.JULEB_DB }}
          JULEB_USER: ${{ secrets.JULEB_USER }}
          JULEB_PASS: ${{ secrets.JULEB_PASS }}
          MODE: ${{ inputs.mode }}
          ARGS: ${{ inputs.args }}
        run: python juleb_write_lab.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          mkdir -p /tmp/out && cp data/juleb_write_lab*.json /tmp/out/ 2>/dev/null || true
          mkdir -p /tmp/bk && cp -r data/juleb_write_lab_backups/. /tmp/bk/ 2>/dev/null || true
          ls /tmp/out/*.json >/dev/null 2>&1 || exit 0
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/out/*.json data/ && git add data/juleb_write_lab*.json
            mkdir -p data/juleb_write_lab_backups && cp -r /tmp/bk/. data/juleb_write_lab_backups/ 2>/dev/null || true
            git add data/juleb_write_lab_backups 2>/dev/null || true
            git diff --cached --quiet && exit 0
            git commit -q -m "🧪 معمل جوليب دوم (${{ inputs.mode }})"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
