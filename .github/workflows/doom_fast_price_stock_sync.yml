# 🔑 الأسرار المطلوبة هنا (نفس القيم الموجودة في juleb-daily-report):
# CROSS_REPO_TOKEN, JULEB_URL, JULEB_DB, JULEB_USER, JULEB_PASS,
# JAHEZ_TOKEN (اختياري), JAHEZ_STORE_ID (اختياري), JAHEZ_WRITE_ENABLED (اختياري)
#
# ⚡ 12 سبتمبر 2026 - المسار السريع لمزامنة أسعار/أرصدة جاهز (طلب صريح من صاحب
# المشروع: تحديث بوتيرة مضمونة بحد أقصى تقريبي 50 دقيقة نهارًا، بدون تحميل زيادة
# على جوليب). بيشغّل بس claude_data_bridge_fast.py (نسخة خفيفة من
# claude_data_bridge.py - استعلامين بس: products + stock_balance، بدل الـ9
# استعلامات الكاملة) ثم jahez_sync_run.py على نفس اللقطة الطازجة فورًا.
# باقي استعلامات claude_data_bridge.py (إيصالات/سكراب/أرشيف مبيعات...) فضلت في
# doom_claude_data_bridge.yml على جدولتها القديمة (كل ساعتين) - مفيش أي داعي
# تسريعها، وتشغيلها هنا كمان كان هيضاعف الحمل على جوليب من غير أي فايدة.
#
# 🌙 نافذة الليل (2 - 9 صباحًا بتوقيت الرياض = 23:00-05:59 UTC تقريبًا): وتيرة
# أبطأ (كل ساعتين) بطلب صريح من صاحب المشروع - وقت هادئ + وقت الـpush الليلي
# الثقيل من جوليب لهنجرستيشن (~02:14 UTC / 05:14 الرياض) واللي أثبتنا سابقًا إن
# محاولة "نلحقه بسرعة" بتشغيلة مجدولة لحظة بلحظة مش موثوقة أصلاً (GitHub بيلغي
# تشغيلات مجدولة تحت الضغط) - فمفيش داعي حِمل زيادة على جوليب في وقت مفيش فيه
# مبيعات أصلاً.
# 🕐 12 سبتمبر 2026 - دقايق التشغيل اتحولت من */15 (:00/:15/:30/:45 المزدحمة) لدقايق
# فردية (3/18/33/48) بنصيحة GitHub الرسمية نفسها: التشغيلات المجدولة عند اللحظات
# المستديرة (كل ساعة، كل ربع ساعة بالظبط) هي أكتر لحظات ضغط على سيرفرات GitHub
# عالميًا (كل مستخدمي GitHub تقريبًا بيجدولوا على نفس اللحظات) - ده اللي سبب فجوة
# التشغيل الحقيقية اللي لاحظناها (ساعتين+ بين تشغيلتين متتاليتين). كل workflow من
# مجموعة الـ5 دقيقة هنا (نفس المزامنة السريعة + هنجرستيشن + فيرا×2 + مزامنة فرع
# التجربة) بقاله دقيقة مختلفة عشان كمان يقل التزاحم بينهم مع بعض.
name: ⚡ [DOOM] Fast Price/Stock Sync - Jahez (كل ١٥ دقيقة نهارًا، كل ساعتين ليلًا)

on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 6-22 * * *'
    - cron: '12 23,1,3,5 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pytz requests
      - name: Refresh products.json + stock_balance.json (خفيف - استعلامين بس)
        env:
          JULEB_URL: ${{ secrets.JULEB_URL }}
          JULEB_DB: ${{ secrets.JULEB_DB }}
          JULEB_USER: ${{ secrets.JULEB_USER }}
          JULEB_PASS: ${{ secrets.JULEB_PASS }}
        run: python claude_data_bridge_fast.py
      - name: Jahez Sync (detect + report + optional write-back)
        env:
          JAHEZ_TOKEN: ${{ secrets.JAHEZ_TOKEN }}
          JAHEZ_STORE_ID: ${{ secrets.JAHEZ_STORE_ID }}
          JAHEZ_WRITE_ENABLED: ${{ secrets.JAHEZ_WRITE_ENABLED }}
        run: python jahez_sync_run.py
      # 🚨 12 سبتمبر 2026 - نُقل فحص تأخير المزامنة هنا من workflow مستقل (كان
      # عنده cron خاص به بنفس التردد) بعد ما اكتشفنا إن الـwatchdog نفسه كان
      # بيفوّت تشغيلاته أكتر من أي workflow تاني - على الأغلب بسبب تكدّس عدد كبير
      # من الـworkflows المجدولة كل 15 دقيقة في نفس الريبو مع بعض (تزاحم على
      # GitHub Actions scheduler). تشغيله كخطوة هنا بدل cron منفصل بيقلل عدد
      # الجدولات المتزاحمة، وبيضمن إن الفحص بيحصل فورًا بعد أي تشغيلة ناجحة فعلية.
      - name: Check sync delays (كل المنصات)
        env:
          TELEGRAM_TOKEN_DOOM: ${{ secrets.TELEGRAM_TOKEN_DOOM }}
          TELEGRAM_CHAT_ID_DOOM: ${{ secrets.TELEGRAM_CHAT_ID_DOOM }}
        run: python sync_delay_watchdog.py
      # 🐛 12 سبتمبر 2026 - data/sync_delay_alert_state.json بقى مشترك بين هذا الـ
      # workflow و doom_hungerstation_stock_sync.yml (الاتنين بيكتبوا عليه). لو
      # اتشغّلوا قريب من بعض، الـpush ممكن يتصادم (rebase conflict) والنتيجة
      # كلها (بما فيها jahez_sync.json الصحيح) تضيع من غير ما توصل للريبو - ده
      # فعليًا حصل وسبب "مزامنة نجحت لكن البيانات فضلت قديمة". الحل: إعادة محاولة
      # (fetch + rebase + push) بدل محاولة وحيدة بتفشل بصمت.
      # 🐛🐛 12 سبتمبر 2026 (الجذر الحقيقي - نفس الملحوظة في
      # doom_hungerstation_stock_sync.yml): "git rebase --continue" بعد حل
      # التعارض بيحتاج EDITOR، ومفيش EDITOR في GitHub Actions ("Terminal is
      # dumb, but EDITOR unset") - فكان بيفشل هو نفسه، والسكريبت كان بيعمل
      # "|| git rebase --abort" فيلغي الـrebase بالكامل (بما فيه الكوميت
      # المحلي!). كل المحاولات الخمسة كانت بتفشل بنفس الطريقة، والخطوة كانت
      # بتخلص "success" لأنه مفيش exit فاشل في نهاية اللوب - رغم إن الـpush
      # ماحصلش خالص. ده كان السبب الحقيقي وراء استمرار المشكلة رغم كل الإصلاحات
      # التانية. الحل: GIT_EDITOR=true + exit 1 صريح لو الـpush فشل نهائيًا.
      - name: Commit result back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          export GIT_EDITOR=true
          git add data/products.json data/stock_balance.json data/jahez_sync.json data/sync_delay_alert_state.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "⚡ نتيجة المزامنة السريعة (جاهز + رصيد جوليب) + فحص التأخير"
            pushed=0
            for i in 1 2 3 4 5; do
              if git push; then
                echo "Push succeeded"
                pushed=1
                break
              fi
              echo "Push attempt $i failed - retrying after rebase"
              git fetch origin main
              if ! git rebase origin/main; then
                # تعارض على الأغلب في sync_delay_alert_state.json بس (ملف تتبّع
                # تنبيهات بسيط - مش حرج نفقد آخر نسخة منه) - ناخد نسخة الريموت
                # ونكمل، بدون ما نضيّع باقي نتيجة المزامنة (jahez_sync.json...).
                git checkout --theirs data/sync_delay_alert_state.json 2>/dev/null || true
                git add data/sync_delay_alert_state.json
                git rebase --continue || git rebase --abort
              fi
              sleep $((i * 3))
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::فشل push نتيجة المزامنة نهائيًا بعد 5 محاولات - النتيجة اتحسبت صح بس متوصلتش للريبو"
              exit 1
            fi
          fi
