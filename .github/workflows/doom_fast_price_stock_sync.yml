# 🔑 الأسرار المطلوبة هنا (نفس القيم الموجودة في juleb-daily-report):
# CROSS_REPO_TOKEN, JULEB_URL, JULEB_DB, JULEB_USER, JULEB_PASS,
# JAHEZ_TOKEN (اختياري), JAHEZ_STORE_ID (اختياري), JAHEZ_WRITE_ENABLED (اختياري)
#
# ⚡ 12 سبتمبر 2026 - المسار السريع لمزامنة أسعار/أرصدة جاهز (طلب صريح من صاحب
# المشروع: تحديث بوتيرة مضمونة بحد أقصى تقريبي 50 دقيقة نهارًا، بدون تحميل زيادة
# على جوليب). بيشغّل بس claude_data_bridge_fast.py (نسخة خفيفة من
# claude_data_bridge.py - استعلامين بس: products + stock_balance، بدل الـ9
# استعلامات الكاملة) ثم jahez_sync_run.py على نفس اللقطة الطازجة فورًا.
# باقي استعلامات claude_data_bridge.py (إيصالات/سكراب/أرشيف مبيعات...) فضلت في
# doom_claude_data_bridge.yml على جدولتها القديمة (كل ساعتين) - مفيش أي داعي
# تسريعها، وتشغيلها هنا كمان كان هيضاعف الحمل على جوليب من غير أي فايدة.
#
# 🌙 نافذة الليل (2 - 9 صباحًا بتوقيت الرياض = 23:00-05:59 UTC تقريبًا): وتيرة
# أبطأ (كل ساعتين) بطلب صريح من صاحب المشروع - وقت هادئ + وقت الـpush الليلي
# الثقيل من جوليب لهنجرستيشن (~02:14 UTC / 05:14 الرياض) واللي أثبتنا سابقًا إن
# محاولة "نلحقه بسرعة" بتشغيلة مجدولة لحظة بلحظة مش موثوقة أصلاً (GitHub بيلغي
# تشغيلات مجدولة تحت الضغط) - فمفيش داعي حِمل زيادة على جوليب في وقت مفيش فيه
# مبيعات أصلاً.
name: ⚡ [DOOM] Fast Price/Stock Sync - Jahez (كل ١٥ دقيقة نهارًا، كل ساعتين ليلًا)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 6-22 * * *'
    - cron: '0 23,1,3,5 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pytz
      - name: Refresh products.json + stock_balance.json (خفيف - استعلامين بس)
        env:
          JULEB_URL: ${{ secrets.JULEB_URL }}
          JULEB_DB: ${{ secrets.JULEB_DB }}
          JULEB_USER: ${{ secrets.JULEB_USER }}
          JULEB_PASS: ${{ secrets.JULEB_PASS }}
        run: python claude_data_bridge_fast.py
      - name: Jahez Sync (detect + report + optional write-back)
        env:
          JAHEZ_TOKEN: ${{ secrets.JAHEZ_TOKEN }}
          JAHEZ_STORE_ID: ${{ secrets.JAHEZ_STORE_ID }}
          JAHEZ_WRITE_ENABLED: ${{ secrets.JAHEZ_WRITE_ENABLED }}
        run: python jahez_sync_run.py
      - name: Commit result back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/products.json data/stock_balance.json data/jahez_sync.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "⚡ نتيجة المزامنة السريعة (جاهز + رصيد جوليب)" && git pull --rebase && git push)
