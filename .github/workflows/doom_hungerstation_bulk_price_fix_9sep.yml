# تصحيح جماعي حقيقي لسعر كل الأصناف المفعّلة على هنجرستيشن (دوم 2) لمطابقة
# جوليب 1:1 - بإذن صريح من صاحب المشروع 9 سبتمبر 2026. راجع
# hungerstation_bulk_price_fix_9sep.py في juleb-daily-report للسياق الكامل.
name: HS Bulk Price Fix 1:1 (manual)

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report (branch)
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          ref: claude/assortment-webhook-discovery-a4mxc6
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Bulk price fix
        env:
          HUNGERSTATION_CLIENT_ID: ${{ secrets.HUNGERSTATION_CLIENT_ID }}
          HUNGERSTATION_CLIENT_SECRET: ${{ secrets.HUNGERSTATION_CLIENT_SECRET }}
        run: python hungerstation_bulk_price_fix_9sep.py
      - name: Commit result report back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hungerstation_bulk_price_fix_9sep_result.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "Record bulk price-fix result (9 Sept)" && git push)
