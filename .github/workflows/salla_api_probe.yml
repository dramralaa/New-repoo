name: 🔎 salla api probe (manual)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Zid fields and Woo attributes
        run: |
          python3 - <<'EOF'
          import requests, json
          H = {"User-Agent": "Mozilla/5.0", "Accept": "application/json"}
          for d in ("care-outlet.com", "basmaonline.com", "wuduh-ph.com"):
              try:
                  r = requests.get(f"https://{d}/api/v1/products/?page=1", headers=H, timeout=25)
                  j = r.json()
                  res = j.get("results") or []
                  print(d, r.status_code, "count", j.get("count"), "page_size", len(res), "next", str(j.get("next"))[:80], "keys", [k for k in j if k != "results"])
                  if res and d == "care-outlet.com":
                      p = res[0]
                      print(" keys", list(p))
                      show = {k: (str(v)[:70]) for k, v in p.items() if k in ("name", "sku", "slug", "barcode", "gtin", "categories", "images", "image", "main_image", "brand", "brands", "attributes", "html_url", "url")}
                      print(" sample", json.dumps(show, ensure_ascii=False)[:900])
              except Exception as e:
                  print(d, "ERR", type(e).__name__, str(e)[:100])
          d = "mawaredalhijaz-pharmacy.com"
          try:
              r = requests.get(f"https://{d}/wp-json/wc/store/v1/products?per_page=40&page=3", headers=H, timeout=30)
              j = r.json()
              skus = [p.get("sku") for p in j]
              print("woo page3 n", len(j), "non-empty sku", sum(1 for s in skus if s), skus[:6])
              p = next((x for x in j if x.get("attributes")), None)
              print(" attrs", json.dumps(p.get("attributes")[:3], ensure_ascii=False)[:400] if p else None)
              print(" brands", [x.get("brands") for x in j[:3]])
          except Exception as e:
              print("woo ERR", type(e).__name__, str(e)[:100])
          EOF
