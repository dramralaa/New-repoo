name: 🔎 salla cap probe (manual)
on:
  workflow_dispatch:
    inputs:
      domains:
        description: 'دومين سلة واحد'
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe categories / sort / filters
        env:
          DOMS: ${{ github.event.inputs.domains }}
        run: |
          python3 - <<'EOF'
          import os, re, json, requests
          H = {"User-Agent": "Mozilla/5.0"}
          d = os.environ["DOMS"].split(",")[0].strip()
          t = requests.get(f"https://{d}/", headers=H, timeout=30).text
          sid = re.search(r'"store":\{"id":(\d+)', t).group(1)
          HH = {**H, "store-identifier": sid}
          B = "https://api.salla.dev/store/v1"
          def show(label, u, **k):
              r = requests.get(u, headers=HH, timeout=40, **k)
              try:
                  j = r.json()
              except Exception:
                  j = {}
              data = j.get("data")
              print(label, r.status_code, "n=", len(data) if isinstance(data, list) else data if data is None else "obj", "cursor=", json.dumps(j.get("cursor"))[:200], "keys=", list(j.keys())[:6])
              return j
          j = show("products", f"{B}/products", params={"per_page": 2})
          print("sample keys", list((j.get("data") or [{}])[0].keys())[:30])
          for ep in ("categories", "products/categories", "brands"):
              j = show(ep, f"{B}/{ep}", params={"per_page": 5})
              print("  first", json.dumps((j.get("data") or [None])[0], ensure_ascii=False)[:300])
          for srt in ("name", "-name", "price", "-price", "created", "-created", "sort_by=latest"):
              show("sort " + srt, f"{B}/products", params={"per_page": 2, "sort": srt})
          # deep cursor test
          r = requests.get(f"{B}/products", headers=HH, params={"per_page": 50}, timeout=40).json()
          print("per_page=50 returned", len(r.get("data") or []), json.dumps(r.get("cursor"))[:300])
          cats = (requests.get(f"{B}/categories", headers=HH, timeout=40).json().get("data") or [])
          if cats:
              cid = cats[0].get("id")
              show("filter category", f"{B}/products", params={"per_page": 2, "category": cid})
              show("filter category_id", f"{B}/products", params={"per_page": 2, "category_id": cid})
              show("filter categories[]", f"{B}/products", params={"per_page": 2, "categories[]": cid})
          EOF
