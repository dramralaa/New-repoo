name: 🔎 salla api probe (manual)
on:
  workflow_dispatch:
    inputs:
      domains:
        description: 'دومينات بفاصلة'
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Raw sitemap and page hints
        env:
          DOMS: ${{ github.event.inputs.domains }}
        run: |
          python3 - <<'EOF'
          import os, re, json, requests
          H = {"User-Agent": "Mozilla/5.0"}
          d = os.environ["DOMS"].split(",")[0].strip()
          r = requests.get(f"https://{d}/sitemaps/ar-sa/product/1.xml", headers=H, timeout=30)
          print("product sitemap", r.status_code, len(r.content), r.headers.get("content-type"), r.headers.get("content-encoding"), repr(r.text[:300]))
          r = requests.get(f"https://{d}/sitemaps/ar-sa/category/1.xml", headers=H, timeout=30)
          print("category sitemap", r.status_code, len(r.content), repr(r.text[:300]))
          h = requests.get(f"https://{d}/ar-sa", headers=H, timeout=30).text
          print("home len", len(h))
          for pat in (r'"buildId":"([^"]+)"', r'/(?:ar-sa|en-sa)/product[^"\s<>]{0,80}', r'/(?:ar-sa|en-sa)/p/[^"\s<>]{0,80}', r'https://[^"\s]*algolia[^"\s]*', r'https://[^"\s]*api[^"\s]{0,60}'):
              print(pat[:30], "->", sorted(set(re.findall(pat, h)))[:6])
          EOF
