name: 🔎 salla api probe (manual)
on:
  workflow_dispatch:
    inputs:
      domains:
        description: 'دومينات بفاصلة'
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Magento GraphQL probe
        env:
          DOMS: ${{ github.event.inputs.domains }}
        run: |
          python3 - <<'EOF'
          import os, requests, json
          H = {"User-Agent": "Mozilla/5.0", "Content-Type": "application/json", "Accept": "application/json"}
          for d in [x.strip() for x in os.environ["DOMS"].split(",") if x.strip()]:
              for store in ("ar_sa", "en_sa", "default", None):
                  hh = dict(H)
                  if store:
                      hh["Store"] = store
                  q = {"query": "{ products(search: \"a\", pageSize: 3, currentPage: 1) { total_count page_info { total_pages } items { sku name url_key image { url } categories { name } } } }"}
                  try:
                      r = requests.post(f"https://{d}/graphql", headers=hh, json=q, timeout=30)
                      print(d, "store", store, r.status_code, r.text[:350].replace("\n", " "))
                      if r.status_code == 200 and "items" in r.text:
                          break
                  except Exception as e:
                      print(d, store, "ERR", type(e).__name__)
              for path in ("/rest/V1/store/storeViews", "/en-sa/sitemap.xml", "/sitemap.xml", "/robots.txt"):
                  try:
                      rr = requests.get(f"https://{d}{path}", headers={"User-Agent": "Mozilla/5.0"}, timeout=25)
                      print("  GET", path, rr.status_code, rr.headers.get("content-type", "")[:25], rr.text[:100].replace("\n", " "))
                  except Exception as e:
                      print("  GET", path, "ERR", type(e).__name__)
          EOF
