name: workflow-commission_what_if

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'اكتب APPROVED (قراءة جوليب مرة واحدة)'
        required: true
        default: ''

concurrency:
  group: commission-what-if
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: تأكيد
        if: github.event.inputs.confirm != 'APPROVED'
        run: |
          echo "اكتب APPROVED"
          exit 1
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install openpyxl pytz requests pandas
      - name: تقييم
        env:
          PLATFORM_PAUSE: ${{ vars.PLATFORM_PAUSE }}
          JULEB_URL: ${{ secrets.JULEB_URL }}
          JULEB_DB: ${{ secrets.JULEB_DB }}
          JULEB_USER: ${{ secrets.JULEB_USER }}
          JULEB_PASS: ${{ secrets.JULEB_PASS }}
        run: python commission_what_if.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          git add data/commission_what_if_oct2026.* 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "📊 نتيجة تقييم ليستة الكوميشن الجديدة [vercel skip]"
          for i in 1 2 3 4 5; do
            timeout 60 git pull -q --rebase origin main && timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
