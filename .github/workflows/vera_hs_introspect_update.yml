# 🔎 16 سبتمبر 2026 - تشخيص لمرة واحدة (هتتشال بعد الاستخدام): هل sku قابل
# للتعديل عبر updateProduct؟
name: 🔎 [VERA] فحص إمكانية تعديل sku (تشخيص لمرة واحدة)

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Live Bearer token from partner-app.hungerstation.com (VERA session)'
        required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Run introspection
        env:
          HS_TOKEN: ${{ github.event.inputs.token }}
        run: python vera_hs_introspect_product_update.py
