# Quick read-only check: confirm B7Z2B9/JX2RW1 are actually gone from our
# Hungerstation store after the delete mutation calls. Required secret:
# CROSS_REPO_TOKEN.
name: HS Verify Delete (manual)

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Live Bearer token from partner-app.hungerstation.com (short-lived, not stored)'
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Verify delete
        env:
          HS_TOKEN: ${{ github.event.inputs.token }}
        run: python hungerstation_verify_delete.py
