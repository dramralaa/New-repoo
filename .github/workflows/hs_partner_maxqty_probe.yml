# 🧪 3 أكتوبر 2026 - اختبار صنف واحد: حد الكمية عبر Partner API (من غير توكن متصفح)
name: 🧪 [HS] اختبار حد الكمية - صنف واحد (يدوي)

on:
  workflow_dispatch:
    inputs:
      brand:
        description: "VERA / DOOM"
        required: true
        default: VERA
      vendor_id:
        required: true
        default: "174067"
      sku:
        required: true
      value:
        required: true
      field:
        required: false
        default: maximum_sales_quantity

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pytz
      - name: Probe
        env:
          BRAND: ${{ inputs.brand }}
          VENDOR_ID: ${{ inputs.vendor_id }}
          SKU: ${{ inputs.sku }}
          VALUE: ${{ inputs.value }}
          FIELD: ${{ inputs.field }}
          VERA_HUNGERSTATION_CLIENT_ID: ${{ secrets.VERA_HUNGERSTATION_CLIENT_ID }}
          VERA_HUNGERSTATION_CLIENT_SECRET: ${{ secrets.VERA_HUNGERSTATION_CLIENT_SECRET }}
          HUNGERSTATION_CLIENT_ID: ${{ secrets.HUNGERSTATION_CLIENT_ID }}
          HUNGERSTATION_CLIENT_SECRET: ${{ secrets.HUNGERSTATION_CLIENT_SECRET }}
        run: python hs_partner_maxqty_probe.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          F=data/hs_partner_maxqty_probe.json
          [ -f "$F" ] || exit 0
          cp "$F" /tmp/p.json
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/p.json "$F" && git add "$F"
            git diff --cached --quiet && exit 0
            git commit -q -m "🧪 اختبار حد الكمية عبر Partner API"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
