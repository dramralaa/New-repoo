name: 🔁 [VERA] مطابقة طلبات جاهز مع جوليب (يومي + يدوي)

# قراءة فقط: طلبات جاهز لفيرا (GET بالصفحات) + فواتير فيرا من مخزن REST. يكتب data/vera_jahez_reconciliation.json في juleb-daily-report.
on:
  workflow_dispatch:
  schedule:
    - cron: '35 4 * * *'

concurrency:
  group: vera-jahez-reconcile
  cancel-in-progress: false

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pytz
      - name: Reconcile
        env:
          VERA_JAHEZ_TOKEN: ${{ secrets.VERA_JAHEZ_TOKEN }}
          VERA_JAHEZ_STORE_ID: ${{ secrets.VERA_JAHEZ_STORE_ID }}
          STORE_GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: python vera_jahez_reconcile.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          F=data/vera_jahez_reconciliation.json
          [ -f "$F" ] || exit 1
          cp "$F" /tmp/s.json
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/s.json "$F" && git add "$F"
            git diff --cached --quiet && exit 0
            git commit -q -m "🔁 مطابقة جاهز فيرا [vercel skip]"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
