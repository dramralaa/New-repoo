name: 🔎 image source probe (manual)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Salla product page structure
        run: |
          python3 - <<'EOF'
          import requests, re
          H = {"User-Agent": "Mozilla/5.0"}
          base = "https://rowadaljamalstore.com"
          tot = 0
          first = None
          for i in (1, 2, 3):
              r = requests.get(f"{base}/ar/sitemap-{i}.xml", headers=H, timeout=20)
              locs = re.findall(r"<loc>([^<]+)</loc>", r.text)
              prods = [l for l in locs if re.search(r"/p\d+/?$", l)]
              tot += len(prods)
              first = first or (prods[3] if len(prods) > 3 else None)
              print("sitemap", i, "urls", len(locs), "product", len(prods))
          print("total product urls", tot, first)
          if first:
              t = requests.get(first, headers=H, timeout=20).text
              print("page len", len(t))
              for pat in ("gtin", "barcode", "sku", "mpn", "og:image"):
                  m = re.search(pat + r'.{0,70}', t)
                  print(pat, "->", m.group(0)[:90] if m else None)
          EOF
