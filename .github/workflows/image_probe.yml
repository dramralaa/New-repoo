name: 🔎 image source probe (manual)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Salla storefront structure
        run: |
          python3 - <<'EOF'
          import requests, re, json
          H = {"User-Agent": "Mozilla/5.0"}
          for base in ["https://rowadaljamalstore.com", "https://duniaalosra.com"]:
              try:
                  r = requests.get(base + "/sitemap.xml", headers=H, timeout=20)
                  locs = re.findall(r"<loc>([^<]+)</loc>", r.text)
                  print(base, "sitemap", r.status_code, len(locs), locs[:4])
                  prod = [l for l in locs if "product" in l.lower()][:1]
                  if prod:
                      r2 = requests.get(prod[0], headers=H, timeout=20)
                      sub = re.findall(r"<loc>([^<]+)</loc>", r2.text)
                      print(" product sitemap", r2.status_code, len(sub), sub[:2])
                      if sub:
                          r3 = requests.get(sub[0], headers=H, timeout=20)
                          ld = re.findall(r'application/ld\+json[^>]*>(.*?)</script>', r3.text, re.S)
                          print(" page", r3.status_code, len(r3.text), "ldjson", len(ld))
                          for x in ld[:3]:
                              try:
                                  j = json.loads(x)
                                  print("  keys", list(j)[:15] if isinstance(j, dict) else type(j), {k: j.get(k) for k in ("gtin", "gtin13", "gtin12", "sku", "mpn") if isinstance(j, dict)})
                              except Exception as e:
                                  print("  parse err", type(e).__name__)
              except Exception as e:
                  print(base, "ERR", type(e).__name__, str(e)[:80])
          EOF
