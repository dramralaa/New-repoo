name: 🔎 image source probe (manual)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Salla product page structure
        run: |
          python3 - <<'EOF'
          import requests, re, json
          H = {"User-Agent": "Mozilla/5.0"}
          base = "https://rowadaljamalstore.com"
          tot = 0
          first = None
          for i in (1, 2, 3):
              r = requests.get(f"{base}/ar/sitemap-{i}.xml", headers=H, timeout=20)
              locs = re.findall(r"<loc>([^<]+)</loc>", r.text)
              prods = [l for l in locs if "/p" in l.rsplit("/", 1)[-1]]
              tot += len(prods)
              first = first or (prods[0] if prods else None)
              print("sitemap", i, r.status_code, "urls", len(locs), "product-like", len(prods))
          print("total product urls", tot, first)
          if first:
              r3 = requests.get(first, headers=H, timeout=20)
              t = r3.text
              print("page", r3.status_code, len(t))
              for pat in ("gtin", "barcode", "sku", "\"mpn\"", "og:image"):
                  m = re.search(pat + r'.{0,80}', t)
                  print(pat, "->", m.group(0)[:100] if m else None)
          EOF
