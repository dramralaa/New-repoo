# 🏷️ 23 أكتوبر 2026 - معاينة عروض جاهز لدوم (قراءة فقط - مفيش أي خصم بيتعمل على جاهز)
name: 🏷️ [DOOM] معاينة عروض جاهز (قراءة فقط)

on:
  workflow_dispatch:
    inputs:
      pct:
        description: "نسبة الخصم %"
        default: "5"
      categories:
        description: "فئات جوليب مفصولة بفاصلة (فاضي = كل غير الدواء) مثال: COSMETICS,BABY"
        default: ""
      search:
        description: "كلمة في اسم الصنف/البراند (اختياري)"
        default: ""
      start:
        description: "البداية YYYY-MM-DD HH:MM بتوقيت الرياض"
        default: ""
      end:
        description: "النهاية YYYY-MM-DD HH:MM بتوقيت الرياض"
        default: ""
      min_margin:
        description: "أقل هامش مسموح بعد الخصم والعمولة %"
        default: "5"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests openpyxl pandas pytz
      - name: Preview
        env:
          JAHEZ_TOKEN: ${{ secrets.JAHEZ_TOKEN }}
          JAHEZ_STORE_ID: ${{ secrets.JAHEZ_STORE_ID }}
          DEAL_REFRESH: "1"
          DEAL_PCT: ${{ inputs.pct }}
          DEAL_CATEGORIES: ${{ inputs.categories }}
          DEAL_SEARCH: ${{ inputs.search }}
          DEAL_START: ${{ inputs.start }}
          DEAL_END: ${{ inputs.end }}
          DEAL_MIN_MARGIN: ${{ inputs.min_margin }}
        run: python doom_jahez_deals_preview.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          [ -f data/jahez_deals_preview.json ] || exit 1
          cp data/jahez_deals_preview.json data/jahez_deals_preview.xlsx /tmp/
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/jahez_deals_preview.json /tmp/jahez_deals_preview.xlsx data/ && git add data/jahez_deals_preview.json data/jahez_deals_preview.xlsx
            git diff --cached --quiet && exit 0
            git commit -q -m "🏷️ معاينة عروض جاهز"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
