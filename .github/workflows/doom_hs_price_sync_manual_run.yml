# 💰 تشغيلة يدوية فورية لمزامنة سعر هنجرستيشن-دوم (كتابة حية) - بدون انتظار
# ضبط secret دائم. الحلقة المستمرة (doom_sync_loop_hungerstation.yml) هتفضل
# تعمل نفس الشيء تلقائيًا كل دورة **بس لو HS_PRICE_WRITE_ENABLED=1 متضبط
# كـsecret دائم** - التشغيلة دي مش بديل عن الضبط الدائم، دي تفعيل فوري لمرة.
name: 💰 [DOOM] تشغيلة فورية - تصحيح سعر هنجرستيشن حيًا

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Live price sync
        env:
          JULEB_URL: ${{ secrets.JULEB_URL }}
          JULEB_DB: ${{ secrets.JULEB_DB }}
          JULEB_USER: ${{ secrets.JULEB_USER }}
          JULEB_PASS: ${{ secrets.JULEB_PASS }}
          HUNGERSTATION_CLIENT_ID: ${{ secrets.HUNGERSTATION_CLIENT_ID }}
          HUNGERSTATION_CLIENT_SECRET: ${{ secrets.HUNGERSTATION_CLIENT_SECRET }}
          HS_PRICE_WRITE_ENABLED: "1"
        run: python hungerstation_price_sync.py
      - name: Commit and push result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          export GIT_EDITOR=true
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          git add data/hungerstation_price_sync.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "لا يوجد تغيير."
            exit 0
          fi
          git commit -m "💰 نتيجة تصحيح سعر هنجرستيشن-دوم الفوري (كتابة حية)"
          for i in 1 2 3 4 5; do
            if timeout 60 git push origin HEAD:main; then
              exit 0
            fi
            timeout 60 git fetch origin main
            if ! git rebase origin/main; then
              git checkout --theirs data/hungerstation_price_sync.json 2>/dev/null || true
              git add data/hungerstation_price_sync.json 2>/dev/null || true
              git rebase --continue || git rebase --abort
            fi
            sleep $((i * 3))
          done
          echo "::error::فشل push النتيجة بعد 5 محاولات"
