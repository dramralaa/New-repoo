name: 🔍 [DOOM] Category Fix Audit (manual, read-only)

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # نضمن flush فوري لأي print - نفس الباج اللي فقد كل مخرجات v3 وقت الإلغاء
      - run: pip install requests
      - name: Audit (read-only)
        env:
          HUNGERSTATION_CLIENT_ID: ${{ secrets.HUNGERSTATION_CLIENT_ID }}
          HUNGERSTATION_CLIENT_SECRET: ${{ secrets.HUNGERSTATION_CLIENT_SECRET }}
          PYTHONUNBUFFERED: "1"
        run: python hungerstation_category_fix_audit.py
      - name: Commit result back
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hungerstation_category_fix_audit_result.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "🔍 نتيجة تدقيق تصحيح التصنيف بعد الإلغاء" && git pull --rebase && git push)
