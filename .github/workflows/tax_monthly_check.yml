# 🧾 تقرير ضريبة البيع الشهري (قراءة فقط من جوليب): أصناف ضريبتها غير معروفة/مشتبه فيها لمدير بصلاحيات كل الفروع. راجع docs/JULEB_TAX_PER_BRANCH.md
name: 🧾 تقرير الضريبة الشهري (دوم وفيرا)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *'

concurrency:
  group: tax-monthly-check
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests openpyxl
      - name: Refresh DOOM products (REST, read-only)
        continue-on-error: true   # 502 عابر من جوليب ما يوقفش التقرير (بيتبني من آخر نسخة)
        env:
          JULEB_API_KEY: ${{ secrets.JULEB_API_KEY_DOOM }}
          JULEB_API_BASE: https://medova.juleb.com/api/v1
          REQ_CAP: '70'
        run: python juleb_products_rest.py
      - name: Refresh VERA products (REST, read-only)
        continue-on-error: true
        env:
          JULEB_API_KEY: ${{ secrets.JULEB_API_KEY_VERA }}
          JULEB_API_BASE: https://phvera.juleb.com/api/v1
          PRODUCTS_PATH: data/vera_products.json
          REQ_CAP: '70'
        run: python juleb_products_rest.py
      - name: Build tax report + Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tax_monthly_check.py
      - name: Commit (private repo)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          mkdir -p /tmp/keep && cp data/products.json data/vera_products.json data/tax_monthly_report.json data/tax_monthly_report.xlsx /tmp/keep/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/keep/* data/ 2>/dev/null || true
            git add data/products.json data/vera_products.json data/tax_monthly_report.json data/tax_monthly_report.xlsx
            git diff --cached --quiet && exit 0
            git commit -q -m "🧾 تقرير الضريبة الشهري + تحديث الأصناف [vercel skip]"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
