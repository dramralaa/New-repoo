# 🧪 16 سبتمبر 2026 - تشغيلة يدوية لمرة واحدة (هتتشال بعد الاستخدام): اختبار
# إرسال كل حقول المنتج + sku جديد على صنف واحد فقط، لمعرفة هل ده بيتخطى رفض
# NO_UPDATABLE_FIELD_FOUND. التوكن input مؤقت، مش مخزَّن.
name: 🧪 [VERA] اختبار تحديث SKU بكل الحقول (صنف واحد)

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Live Bearer token from partner-app.hungerstation.com (VERA session, short-lived, not stored)'
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Run full-payload SKU update test
        env:
          HS_TOKEN: ${{ github.event.inputs.token }}
        run: python vera_hs_relink_full_payload_test.py
