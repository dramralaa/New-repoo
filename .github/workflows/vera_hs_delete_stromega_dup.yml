# 🗑️ 16 سبتمبر 2026 - تشغيلة يدوية لمرة واحدة (هتتشال بعد الاستخدام): حذف
# صنف ستروميجا الوهمي (5904P5) المؤكَّد من فرعي فيرا. التوكن input مؤقت، مش
# مخزَّن.
name: 🗑️ [VERA] حذف تكرار ستروميجا الوهمي (لمرة واحدة)

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Live Bearer token from partner-app.hungerstation.com (VERA session, short-lived, not stored)'
        required: true

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Delete Stromega duplicate
        env:
          HS_TOKEN: ${{ github.event.inputs.token }}
        run: python vera_hungerstation_delete_stromega_dup.py
