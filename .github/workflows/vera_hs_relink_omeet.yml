# 🔗 16 سبتمبر 2026 - تشغيلة يدوية لمرة واحدة (هتتشال بعد الاستخدام): إعادة
# ربط 205 صنف من عصر أوميت بكود جوليب الصحيح. التوكن input مؤقت، مش مخزَّن.
name: 🔗 [VERA] إعادة ربط أصناف أوميت (لمرة واحدة)

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Live Bearer token from partner-app.hungerstation.com (VERA session, short-lived, not stored)'
        required: true

jobs:
  relink:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Relink Omeet legacy SKUs
        env:
          HS_TOKEN: ${{ github.event.inputs.token }}
        run: python vera_hungerstation_relink_omeet_sku.py
      - name: Commit and push result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          export GIT_EDITOR=true
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          git add data/vera_hs_omeet_relink_result.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "لا يوجد تغيير."
            exit 0
          fi
          git commit -m "🔗 نتيجة إعادة ربط أصناف أوميت"
          for i in 1 2 3 4 5; do
            if timeout 60 git push origin HEAD:main; then
              exit 0
            fi
            timeout 60 git fetch origin main
            if ! git rebase origin/main; then
              git checkout --theirs data/vera_hs_omeet_relink_result.json 2>/dev/null || true
              git add data/vera_hs_omeet_relink_result.json 2>/dev/null || true
              git rebase --continue || git rebase --abort
            fi
            sleep $((i * 3))
          done
          echo "::error::فشل push نتيجة الربط بعد 5 محاولات"
