# 🔑 الأسرار المطلوبة هنا (نفس القيم الموجودة في juleb-daily-report):
# CROSS_REPO_TOKEN, TELEGRAM_TOKEN, TELEGRAM_CHAT_ID
# ⚠️ السكريبت بيقرا GITHUB_TOKEN/GITHUB_REPOSITORY لحفظ حالته (bot_state/) في
# نفس الريبو الخاص - هنا لازم نمررهم صراحة (CROSS_REPO_TOKEN + اسم الريبو الخاص)
# بدل القيم التلقائية اللي كانت بتشاور على الريبو الحالي.
name: 💡 [DOOM] Pharmacist Lighting Reminders

on:
  workflow_dispatch:
  schedule:
    # ⚡ 1 سبتمبر 2026: كان '*/5 * * * *' = 288 تشغيلة يوميًا على مدار 24 ساعة، رغم إن
    # الرسائل التلاتة كلها بتقع في نافذتين بس (الفجر+50د، والمغرب±). اتقلّص للنافذتين
    # بهامش أمان يغطي تحرّك المواقيت على مدار السنة (الفجر بيتراوح 3:50-5:20 ص،
    # والمغرب 5:35-7:05 م بتوقيت الرياض) - **بدون أي فقدان لدقة التوقيت**.
    # ⚠️ cron في GitHub Actions بتوقيت UTC، والرياض = UTC+3.
    - cron: '*/5 1-3 * * *'    # 04:00-06:59 بتوقيت الرياض (نافذة الفجر)
    - cron: '*/5 13-16 * * *'  # 16:00-19:59 بتوقيت الرياض (نافذة المغرب)

jobs:
  reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pytz
      - name: Run Lighting Reminders
        env:
          GITHUB_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          GITHUB_REPOSITORY: dramralaa/juleb-daily-report
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pharmacist_lighting_reminders.py
