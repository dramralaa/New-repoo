# مزامنة جاهز/بيك لفيرا - نسخة فيرا من مزامنة جاهز دوم. الافتراضي dry-run
# (تقرير فقط، صفر كتابة فعلية) لحد ما VERA_JAHEZ_WRITE_ENABLED تتضاف صراحةً
# كـ"1". فرعي فيرا في منتصف جرد مخزون (11 سبتمبر 2026) - الكتابة الفعلية
# ممنوعة تمامًا لحد تأكيد صريح إن الجرد خلص.
#
# ⚡ 12 سبتمبر 2026: رُفعت وتيرة تقرير الـdry-run نفسه لكل 15 دقيقة نهارًا (نفس
# تسريع دوم) - مفيش أي كتابة فعلية فعطل، بس التقرير المقارن يبقى محدّث أكتر.
#
# 🔁 16 سبتمبر 2026 - الجدولة اتوقفت (يدوي/fallback بس): رصدنا فجوات حقيقية
# بالساعات (مرة وصلت 7 ساعات ونص) رغم جدولة كل 15 دقيقة هنا - نفس مشكلة `schedule:`
# غير الموثوقة اللي دوم واجهها وحلّها بحلقة self-relaunch مستمرة. المسؤولية دي
# نقلت لـ`vera_sync_loop_jahez.yml` (نفس نمط دوم بالحرف) - هذا الملف باقي بس
# كـfallback يدوي (workflow_dispatch) لو احتجنا تشغيلة فورية واحدة.
name: 🔗 [VERA] Jahez Sync (يدوي/fallback - الجدولة الحقيقية في vera_sync_loop_jahez.yml)

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Sync (dry-run unless VERA_JAHEZ_WRITE_ENABLED=1)
        env:
          VERA_JAHEZ_TOKEN: ${{ secrets.VERA_JAHEZ_TOKEN }}
          VERA_JAHEZ_STORE_ID: ${{ secrets.VERA_JAHEZ_STORE_ID }}
          VERA_JAHEZ_WRITE_ENABLED: ${{ secrets.VERA_JAHEZ_WRITE_ENABLED }}
        run: python vera_jahez_sync.py
      - name: Commit result back
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vera_jahez_sync.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "🔗 نتيجة مزامنة جاهز فيرا" && git pull --rebase && git push)
