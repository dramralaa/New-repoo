name: 📥 سحب ملف أصناف دلتا (مرتين يوميًا + يدوي)

on:
  workflow_dispatch:
    inputs:
      probe:
        description: '1 = اكتشاف شكل الطلبات (مرة للتجربة)'
        default: '0'
  schedule:
    - cron: '7 3,12 * * *'  # 06:07 و15:07 بتوقيت الرياض - دخول واحد وتنزيل واحد في كل مرة

concurrency:
  group: delta-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests openpyxl playwright
      - run: python -m playwright install --with-deps chromium
      - name: Pull
        env:
          DELTA_CUSTOMER_CODE: ${{ secrets.DELTA_CUSTOMER_CODE }}
          DELTA_PASSWORD: ${{ secrets.DELTA_PASSWORD }}
          LOG_GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          DELTA_PROBE: ${{ github.event.inputs.probe }}
        run: python silent_run.py delta_pull.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          mkdir -p /tmp/keep && cp data/delta/* /tmp/keep/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            mkdir -p data/delta && cp /tmp/keep/* data/delta/ 2>/dev/null || true
            git add data/delta 2>/dev/null || true
            git diff --cached --quiet && exit 0
            git commit -q -m "📥 ملف دلتا [vercel skip]"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
