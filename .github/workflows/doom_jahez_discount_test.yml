# 🧪 23 أكتوبر 2026 - تجربة خصم جاهز على صنف واحد (create / get / delete) - بموافقة صاحب المشروع
name: 🧪 [DOOM] تجربة خصم جاهز - صنف واحد

on:
  workflow_dispatch:
    inputs:
      action:
        description: "create / get / delete"
        default: "get"
      product_id:
        description: "Jahez product id"
        default: "7da93976-ef9c-401b-a94e-e339762ab19e"
      pct:
        default: "5"
      hours:
        default: "12"
      discount_id:
        description: "للمسح (اختياري - فاضي = يمسح خصومات التجربة TEST)"
        default: ""

concurrency:
  group: doom-jahez-discount-test
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pytz
      - name: Test
        env:
          JAHEZ_TOKEN: ${{ secrets.JAHEZ_TOKEN }}
          JAHEZ_STORE_ID: ${{ secrets.JAHEZ_STORE_ID }}
          ACTION: ${{ inputs.action }}
          PRODUCT_ID: ${{ inputs.product_id }}
          DEAL_PCT: ${{ inputs.pct }}
          DEAL_HOURS: ${{ inputs.hours }}
          DISCOUNT_ID: ${{ inputs.discount_id }}
        run: python doom_jahez_discount_test.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          F=data/jahez_discount_test.json
          [ -f "$F" ] || exit 1
          cp "$F" /tmp/t.json
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/t.json "$F" && git add "$F"
            git diff --cached --quiet && exit 0
            git commit -q -m "🧪 تجربة خصم جاهز (${{ inputs.action }})"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
