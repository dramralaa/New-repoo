name: 🔗 [VERA] Consolidated Reports (every 6h)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'
    - cron: '0 3 * * *'
    - cron: '0 9 * * *'
    - cron: '0 15 * * *'

jobs:
  vera_all:
    runs-on: ubuntu-latest
    env:
      VERA_URL: ${{ secrets.VERA_URL }}
      VERA_DB: ${{ secrets.VERA_DB }}
      VERA_USER: ${{ secrets.VERA_USER }}
      VERA_PASS: ${{ secrets.VERA_PASS }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      VERA1_CHAT_ID: ${{ secrets.VERA1_CHAT_ID }}
      VERA2_CHAT_ID: ${{ secrets.VERA2_CHAT_ID }}
      VERA_FRIEND_CHAT_ID: ${{ secrets.VERA_FRIEND_CHAT_ID }}
    steps:
      - name: Checkout vera-repo
        uses: actions/checkout@v4
        with:
          repository: dramralaa/vera-repo
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies (اتحاد متطلبات الـ5 سكريبتات)
        run: pip install pandas requests pytz edge-tts matplotlib openpyxl xlsxwriter

      - name: Run Periodic Report P01
        run: python pharmacy_engine_p01.py

      - name: Run Strategic Audit P02
        if: always()
        run: python pharmacy_engine_p02.py

      - name: Run Daily Closing Report (نفس سكريبت P01 بوضع REPORT_TYPE=DAILY)
        if: always() && github.event.schedule == '0 21 * * *'
        env:
          REPORT_TYPE: "DAILY"
        run: python pharmacy_engine_p01.py

      - name: Run Support Engine Script - VERA
        if: always()
        run: python support_engine_2.py VERA

      - name: Run Test Lab Script - VERA
        if: always()
        run: python test_lab.py VERA

      - name: Run Inventory Report - VERA
        if: always()
        run: python daily_inventory_report_engine.py VERA
