# 🔗 دمج الـ5 workflows الدورية لفيرا (P01+P02، Support Engine، Test Lab، Daily
# Closing، Daily Inventory Noon) في تقرير واحد كل 6 ساعات - طلب كريم (مدير فيرا) 2
# سبتمبر 2026 لتقليل استهلاك حدود الاستخدام المجانية في GitHub Actions. كانت الـ5
# ملفات منفصلة بتسبب 10 تشغيلات/يوم (كل واحدة بـcheckout + setup-python + pip
# install مستقلين) - دلوقتي بيئة واحدة مشتركة تتجهز مرة واحدة و4 مرات باليوم بس.
#
# الملفات القديمة (vera_periodic_p01_p02.yml, vera_support_engine.yml,
# vera_test_lab.yml, vera_daily_closing.yml, vera_daily_inventory_noon.yml) اتسابت
# موجودة لكن schedule اتشالت منها (workflow_dispatch بس) - عشان تفضل صالحة لتشغيل
# يدوي فردي وقت التصحيح، من غير ما تشتغل أوتوماتيك وتكرر نفس الشغل هنا.
#
# ⚠️ ملاحظة مهمة: تقرير "الإغلاق اليومي" (Daily Closing) لسه بيشتغل مرة واحدة بس في
# اليوم (عند سلوت منتصف الليل بالرياض) عن طريق التمييز بين الـ4 مواعيد بـ
# github.event.schedule - مش هيتكرر 4 مرات زي باقي التقارير.
#
# 🕐 المواعيد (كل الأوقات UTC؛ الرياض = UTC+3):
#   21:00 UTC = 00:00 الرياض  -> السلوت اللي فيه تقرير الإغلاق اليومي كمان
#   03:00 UTC = 06:00 الرياض  -> بيسدّ فجوة الليل اللي كانت شكوى كريم الأصلية
#   09:00 UTC = 12:00 الرياض
#   15:00 UTC = 18:00 الرياض
#
# 🔑 الأسرار المطلوبة (اتحاد كل الأسرار اللي كانت مستخدمة في الـ5 ملفات القديمة):
# CROSS_REPO_TOKEN, VERA_URL, VERA_DB, VERA_USER, VERA_PASS, TELEGRAM_TOKEN,
# VERA1_CHAT_ID, VERA2_CHAT_ID, VERA_FRIEND_CHAT_ID
name: 🔗 [VERA] Consolidated Reports (every 6h)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'
    - cron: '0 3 * * *'
    - cron: '0 9 * * *'
    - cron: '0 15 * * *'

jobs:
  vera_all:
    runs-on: ubuntu-latest
    env:
      VERA_URL: ${{ secrets.VERA_URL }}
      VERA_DB: ${{ secrets.VERA_DB }}
      VERA_USER: ${{ secrets.VERA_USER }}
      VERA_PASS: ${{ secrets.VERA_PASS }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      VERA1_CHAT_ID: ${{ secrets.VERA1_CHAT_ID }}
      VERA2_CHAT_ID: ${{ secrets.VERA2_CHAT_ID }}
      VERA_FRIEND_CHAT_ID: ${{ secrets.VERA_FRIEND_CHAT_ID }}
    steps:
      - name: Checkout vera-repo
        uses: actions/checkout@v4
        with:
          repository: dramralaa/vera-repo
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies (اتحاد متطلبات الـ5 سكريبتات)
        run: pip install pandas requests pytz edge-tts matplotlib openpyxl xlsxwriter

      - name: Run Periodic Report P01
        run: python pharmacy_engine_p01.py

      - name: Run Strategic Audit P02
        if: always()
        run: python pharmacy_engine_p02.py

      # تقرير الإغلاق اليومي - سلوت 00:00 الرياض (21:00 UTC) بس، مرة واحدة/يوم
      - name: Run Daily Closing Report (نفس سكريبت P01 بوضع REPORT_TYPE=DAILY)
        if: always() && github.event.schedule == '0 21 * * *'
        env:
          REPORT_TYPE: "DAILY"
        run: python pharmacy_engine_p01.py

      - name: Run Support Engine Script - VERA
        if: always()
        run: python support_engine_2.py VERA

      - name: Run Test Lab Script - VERA
        if: always()
        run: python test_lab.py VERA

      - name: Run Inventory Report - VERA
        if: always()
        run: python daily_inventory_report_engine.py VERA
