# 🔍 11 أكتوبر 2026 - مقارنة أصناف صيدلية منافسة على هنجر بأصناف دوم (قراءة بس، جلسة البوابة الموثوقة)
name: 🔍 [DOOM HS] مقارنة أصناف المنافس (قراءة بس)

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests cryptography pytz pandas openpyxl
      - name: Discover
        env:
          HS_PORTAL_USER: ${{ secrets.HS_PORTAL_USER }}
          HS_PORTAL_PASS: ${{ secrets.HS_PORTAL_PASS }}
          HUNGERSTATION_CLIENT_ID: ${{ secrets.HUNGERSTATION_CLIENT_ID }}
          HUNGERSTATION_CLIENT_SECRET: ${{ secrets.HUNGERSTATION_CLIENT_SECRET }}
        run: python doom_hs_competitor_match.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          F=data/doom_hs_competitor_match.json; X=data/DOOM_HS_Competitor_OTC_Match.xlsx
          [ -f "$F" ] || exit 0
          cp "$F" /tmp/d.json; cp "$X" /tmp/x.xlsx 2>/dev/null || true; cp data/hs_portal_device_doom.enc /tmp/dev.enc 2>/dev/null || true
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/d.json "$F" && git add "$F"; [ -f /tmp/x.xlsx ] && cp /tmp/x.xlsx "$X" && git add "$X"; [ -f /tmp/dev.enc ] && cp /tmp/dev.enc data/hs_portal_device_doom.enc && git add data/hs_portal_device_doom.enc
            git diff --cached --quiet && exit 0
            git commit -q -m "🔍 مقارنة أصناف المنافس على هنجر"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
