# 🔎 16 سبتمبر 2026 - تشغيلة يدوية لمرة واحدة (هتتشال بعدها): قياس حجم التغيير
# المتوقع من إصلاح المطابقة بالباركود في vera_hungerstation_stock_sync.py **قبل**
# ما الحلقة الحية (اللي VERA_HS_WRITE_ENABLED=1 عندها فعلاً) تلتقط الكود الجديد
# وتنفّذ الكتابة الفعلية تلقائيًا في دورتها الجاية. dry-run صريح بغض النظر عن
# قيمة السيكريت الحقيقي.
name: 🔎 [VERA] فحص حجم تصحيح هنجرستيشن قبل التنفيذ الحي (تشخيص لمرة واحدة)

on:
  workflow_dispatch:

jobs:
  dry_run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Run sync in forced dry-run
        env:
          VERA_URL: ${{ secrets.VERA_URL }}
          VERA_DB: ${{ secrets.VERA_DB }}
          VERA_USER: ${{ secrets.VERA_USER }}
          VERA_PASS: ${{ secrets.VERA_PASS }}
          VERA_HUNGERSTATION_CLIENT_ID: ${{ secrets.VERA_HUNGERSTATION_CLIENT_ID }}
          VERA_HUNGERSTATION_CLIENT_SECRET: ${{ secrets.VERA_HUNGERSTATION_CLIENT_SECRET }}
          VERA_HS_WRITE_ENABLED: "0"
        run: python vera_hungerstation_stock_sync.py
