# 🧪 3 أكتوبر 2026 - عينة حد الكمية على هنجرستيشن فيرا (10 أصناف لكل فرع) عبر Partner API
name: 🧪 [VERA] عينة حد الكمية على هنجرستيشن (يدوي)

on:
  workflow_dispatch:
    inputs:
      per_branch:
        description: "عدد الأصناف لكل فرع"
        required: false
        default: "10"

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pytz
      - name: Sample
        env:
          PER_BRANCH: ${{ inputs.per_branch }}
          VERA_URL: ${{ secrets.VERA_URL }}
          VERA_DB: ${{ secrets.VERA_DB }}
          VERA_USER: ${{ secrets.VERA_USER }}
          VERA_PASS: ${{ secrets.VERA_PASS }}
          VERA_HUNGERSTATION_CLIENT_ID: ${{ secrets.VERA_HUNGERSTATION_CLIENT_ID }}
          VERA_HUNGERSTATION_CLIENT_SECRET: ${{ secrets.VERA_HUNGERSTATION_CLIENT_SECRET }}
        run: python vera_hs_max_qty_sample.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          F=data/vera_hs_max_qty_sample.json
          [ -f "$F" ] || exit 0
          cp "$F" /tmp/s.json
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/s.json "$F" && git add "$F"
            git diff --cached --quiet && exit 0
            git commit -q -m "🧪 عينة حد الكمية - هنجرستيشن فيرا"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
