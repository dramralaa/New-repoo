name: 🔎 Juleb isolated qty_available request (read-only, one GET)
on:
  workflow_dispatch:
concurrency:
  group: juleb-openapi
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /inventory/product?fields=id,qty_available&limit=1
        env:
          JULEB_API_KEY: ${{ secrets.JULEB_API_KEY_DOOM }}
        run: |
          [ -n "$JULEB_API_KEY" ] || { echo "no key"; exit 1; }
          echo "::add-mask::$JULEB_API_KEY"
          code=$(curl -sS -m 60 -H "Authorization: Bearer $JULEB_API_KEY" -o /tmp/r.json -w '%{http_code}' "https://medova.juleb.com/api/v1/inventory/product?fields=id,qty_available&limit=1" || echo 000)
          echo "HTTP $code"
          head -c 400 /tmp/r.json; echo
