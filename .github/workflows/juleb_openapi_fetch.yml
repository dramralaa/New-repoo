name: 🔎 Juleb docs fetch (read-only)
on:
  workflow_dispatch:
concurrency:
  group: juleb-openapi
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public docs pages
        run: |
          for u in https://docs.juleb.com/getting-started https://docs.juleb.com/ ; do
            echo "=== $u"
            curl -sSL -m 60 -A 'Mozilla/5.0' -o /tmp/p.html -w 'HTTP %{http_code} %{size_download}\n' "$u" || true
            python3 - <<'PY'
          import re, html
          s = open('/tmp/p.html', errors='ignore').read()
          links = sorted(set(re.findall(r'href="([^"#]+)"', s)))
          print('LINKS', [l for l in links if 'juleb' in l or l.startswith('/')][:80])
          t = re.sub(r'<(script|style)[^>]*>.*?</\1>', ' ', s, flags=re.S)
          t = html.unescape(re.sub(r'<[^>]+>', ' ', t))
          t = re.sub(r'\s+', ' ', t)
          print('TEXT', t[:5000])
          PY
          done
