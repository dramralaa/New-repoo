name: 🧪 [DOOM] Test updateProduct GraphQL Mutation (canary, manual)

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Live Bearer token from partner-app.hungerstation.com (short-lived, not stored)'
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report (branch)
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          ref: claude/assortment-webhook-discovery-a4mxc6
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Test updateProduct mutation on 3 canary SKUs
        env:
          HS_TOKEN: ${{ github.event.inputs.token }}
          HUNGERSTATION_CLIENT_ID: ${{ secrets.HUNGERSTATION_CLIENT_ID }}
          HUNGERSTATION_CLIENT_SECRET: ${{ secrets.HUNGERSTATION_CLIENT_SECRET }}
        run: python hungerstation_test_update_product_mutation.py
      - name: Commit result back
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hungerstation_graphql_update_test_result.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "🧪 نتيجة اختبار updateProduct mutation" && git pull --rebase && git push)
