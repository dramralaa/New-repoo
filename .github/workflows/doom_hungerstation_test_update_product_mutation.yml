name: 🧪 [DOOM] Test updateProduct GraphQL Mutation (canary, manual)

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Optional - leave empty: the server logs in by itself (trusted device)'
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Load token from event file (masked - never printed)
        run: |
          T=$(jq -r '.inputs.token // .inputs.hs_token // .client_payload.token // empty' "$GITHUB_EVENT_PATH")
          if [ -n "$T" ]; then echo "::add-mask::$T"; echo "HS_TOKEN=$T" >> "$GITHUB_ENV"; fi
      - name: Checkout juleb-daily-report (branch)
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          ref: claude/assortment-webhook-discovery-a4mxc6
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Server portal session (no browser token needed)
        if: env.HS_TOKEN == ''
        env:
          HS_PORTAL_USER: ${{ secrets.HS_PORTAL_USER }}
          HS_PORTAL_PASS: ${{ secrets.HS_PORTAL_PASS }}
          VERA_HS_PORTAL_USER: ${{ secrets.VERA_HS_PORTAL_USER }}
          VERA_HS_PORTAL_PASS: ${{ secrets.VERA_HS_PORTAL_PASS }}
          HS_ACCOUNT: DOOM
        run: |
          pip install -q cryptography
          python - <<'PY'
          import os, hs_portal_session as s
          t = s.session(os.environ["HS_ACCOUNT"])
          if not t:
              raise SystemExit("server login to the HS portal failed - run hs_portal_bootstrap (check)")
          a = t["access_token"]
          print("::add-mask::" + a)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("HS_TOKEN=" + a + "\n")
          print("server session ok")
          PY
      - name: Test updateProduct mutation on 3 canary SKUs
        env:
          HUNGERSTATION_CLIENT_ID: ${{ secrets.HUNGERSTATION_CLIENT_ID }}
          HUNGERSTATION_CLIENT_SECRET: ${{ secrets.HUNGERSTATION_CLIENT_SECRET }}
        run: python hungerstation_test_update_product_mutation.py
      - name: Commit result back
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hungerstation_graphql_update_test_result.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "🧪 نتيجة اختبار updateProduct mutation [vercel skip]" && git pull --rebase && git push)
