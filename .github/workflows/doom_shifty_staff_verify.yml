name: workflow-doom_shifty_staff_verify

on:
  workflow_dispatch:
  schedule:
    - cron: '20 7 */2 * *'

concurrency:
  group: doom-shifty-staff-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests cryptography
      - name: Verify staff purchases against Juleb invoices
        # 21 نوفمبر 2026: REST بدل XML-RPC المحجوب (قراءة بس)
        env:
          LOG_GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          HS_PORTAL_PASS: ${{ secrets.HS_PORTAL_PASS }}
          JULEB_API_BASE: https://medova.juleb.com/api/v1
          JULEB_API_KEY: ${{ secrets.JULEB_API_KEY_DOOM }}
        run: python silent_run.py shifty_staff_verify.py
