# 🛍️ 31 أكتوبر 2026 – مطابقة مشتريات الموظفين مع فواتير جوليب (قراءة بس): كل ساعة. لو مفيش مشتريات مستنية مراجعة، السكربت بيخرج من غير أي اتصال بجوليب.
name: 🛍️ [DOOM] Shifty – مراجعة فواتير مشتريات الموظفين (كل ساعة)

on:
  workflow_dispatch:
  schedule:
    - cron: '50 * * * *'

concurrency:
  group: doom-shifty-staff-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests cryptography
      - name: Verify staff purchases against Juleb invoices
        env:
          HS_PORTAL_PASS: ${{ secrets.HS_PORTAL_PASS }}
          JULEB_URL: ${{ secrets.JULEB_URL }}
          JULEB_DB: ${{ secrets.JULEB_DB }}
          JULEB_USER: ${{ secrets.JULEB_USER }}
          JULEB_PASS: ${{ secrets.JULEB_PASS }}
        run: python shifty_staff_verify.py
