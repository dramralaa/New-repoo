# 🔍 20 سبتمبر 2026 - فحص طوارئ مباشر (لمرة واحدة): هل أي صنف من قائمة
# الاستبعاد الدائم (201 صنف - وصفة طبية/GLP-1) لسه active فعليًا على هنجرستيشن
# دلوقتي، رغم إن حلقة المزامنة بتفرض الاستبعاد كل دورة؟ فحص مباشر من الكتالوج
# الحي (مش من سجل آخر دورة بس) - وبيعطّل فورًا أي حاجة يلاقيها active.
name: 🔍 [DOOM] فحص طوارئ - أصناف مستبعدة على هنجرستيشن (يدوي، لمرة واحدة)

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Run audit
        env:
          HUNGERSTATION_CLIENT_ID: ${{ secrets.HUNGERSTATION_CLIENT_ID }}
          HUNGERSTATION_CLIENT_SECRET: ${{ secrets.HUNGERSTATION_CLIENT_SECRET }}
        run: python hungerstation_excluded_audit.py
      - name: Commit and push result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          export GIT_EDITOR=true
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          git add data/hungerstation_excluded_audit_result.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "لا يوجد تغيير."
            exit 0
          fi
          git commit -m "🔍 نتيجة فحص طوارئ - أصناف مستبعدة على هنجرستيشن"
          timeout 60 git push origin HEAD:main || (timeout 60 git fetch origin main && git rebase origin/main && timeout 60 git push origin HEAD:main)
