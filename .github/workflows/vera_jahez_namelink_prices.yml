name: 💲 [VERA Jahez] توحيد أسعار المربوط بالاسم على سعر جوليب (plan / apply)

# plan = قراءة بس. apply = صنف تجربة ثم الباقي (حد LIMIT)، CONFIRM=PRICE-NAMELINKS. الحراس جوه السكربت.
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [plan, apply]
        default: plan
      limit:
        description: 'أقصى عدد أصناف'
        default: '300'
      confirm:
        description: 'PRICE-NAMELINKS للكتابة'
        default: ''

concurrency:
  group: vera-jahez-writes
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pytz
      - name: Run
        env:
          MODE: ${{ inputs.mode }}
          LIMIT: ${{ inputs.limit }}
          CONFIRM: ${{ inputs.confirm }}
          LOG_GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          VERA_JAHEZ_TOKEN: ${{ secrets.VERA_JAHEZ_TOKEN }}
          VERA_JAHEZ_STORE_ID: ${{ secrets.VERA_JAHEZ_STORE_ID }}
        run: python silent_run.py vera_jahez_namelink_prices.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          F=data/vera_jahez_namelink_prices.json; [ -f "$F" ] || exit 0
          cp "$F" /tmp/r.json
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/r.json "$F" && git add "$F"
            git diff --cached --quiet && exit 0
            git commit -q -m "💲 نتيجة توحيد أسعار فيرا على جاهز [vercel skip]"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
