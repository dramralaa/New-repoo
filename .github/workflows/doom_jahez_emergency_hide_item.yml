# 🚨 20 سبتمبر 2026 - إخفاء طوارئ فوري: Rybelsus (GLP-1، SKU 0000005255) اترفع
# بالغلط على جاهز في دفعة رفع جماعية ومتاح للطلب فعليًا. بيستخدم JAHEZ_TOKEN
# الدائم - مفيش توكن مؤقت مطلوب. يُحذف بعد الاستخدام.
name: 🚨 [DOOM] إخفاء طارئ - Rybelsus من جاهز (يدوي، لمرة واحدة)

on:
  workflow_dispatch:

jobs:
  hide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Hide item
        env:
          JAHEZ_TOKEN: ${{ secrets.JAHEZ_TOKEN }}
          JAHEZ_STORE_ID: ${{ secrets.JAHEZ_STORE_ID }}
        run: python jahez_emergency_hide_batch.py
      - name: Commit and push result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          export GIT_EDITOR=true
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          git add data/jahez_emergency_hide_batch_result.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "لا يوجد تغيير."
            exit 0
          fi
          git commit -m "🚨 نتيجة إخفاء طارئ - دفعة أصناف وصفة طبية"
          timeout 60 git push origin HEAD:main || (timeout 60 git fetch origin main && git rebase origin/main && timeout 60 git push origin HEAD:main)
