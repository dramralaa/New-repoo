# 🔍 7 أكتوبر 2026 - فيرا: تكرار فواتير هنجر بأي طريقة دفع (قراءة فقط)
name: 🔍 [VERA] تكرار فواتير هنجر - كل طرق الدفع (يدوي، قراءة فقط)

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pytz
      - name: Discover
        env:
          VERA_URL: ${{ secrets.VERA_URL }}
          VERA_DB: ${{ secrets.VERA_DB }}
          VERA_USER: ${{ secrets.VERA_USER }}
          VERA_PASS: ${{ secrets.VERA_PASS }}
        run: python vera_hs_duplicate_check.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          F=data/vera_hs_duplicate_check.json
          [ -f "$F" ] || exit 0
          cp "$F" /tmp/d.json
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/d.json "$F" && git add "$F"
            git diff --cached --quiet && exit 0
            git commit -q -m "🔍 فواتير هنجر التلقائية فيرا"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
