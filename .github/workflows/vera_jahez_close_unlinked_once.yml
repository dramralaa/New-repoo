# 🔒 27 سبتمبر 2026 - تشغيلة يدوية لمرة واحدة: قفل كل أصناف جاهز فيرا الظاهرة ومش مربوطة بجوليب
# (قرار د. كريم). نفس vera_jahez_sync.py بالظبط بس من غير حد الـ150 صنف في الدورة. بعدها الحلقة
# العادية بتكمل تقفل أي جديد وتفتح أي صنف يتربط.
name: 🔒 [VERA] قفل أصناف جاهز غير المربوطة (مرة واحدة)

on:
  workflow_dispatch:

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pytz requests
      - name: Sync with unlimited close
        env:
          VERA_JAHEZ_TOKEN: ${{ secrets.VERA_JAHEZ_TOKEN }}
          VERA_JAHEZ_STORE_ID: ${{ secrets.VERA_JAHEZ_STORE_ID }}
          VERA_JAHEZ_WRITE_ENABLED: ${{ secrets.VERA_JAHEZ_WRITE_ENABLED }}
          VERA_CLOSE_UNLINKED_MAX: "2000"
        run: python vera_jahez_sync.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          F=data/vera_jahez_sync.json
          [ -f "$F" ] || exit 0
          mkdir -p /tmp/out && cp "$F" /tmp/out/vera_jahez_close_unlinked_once.json
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/out/vera_jahez_close_unlinked_once.json data/
            git add data/vera_jahez_close_unlinked_once.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -q -m "🔒 نتيجة قفل أصناف جاهز فيرا غير المربوطة"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
