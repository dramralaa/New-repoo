# 🕘 17 أكتوبر 2026 - اكتشاف مواعيد فروع دوم على هنجرستيشن وجاهز (قراءة فقط) - تمهيد لربط شيفتي
name: 🕘 [DOOM] اكتشاف مواعيد الفروع على المنصات (قراءة فقط)

on:
  workflow_dispatch:

concurrency:
  group: doom-platform-hours-probe
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests cryptography
      - name: Probe
        env:
          HS_PORTAL_USER: ${{ secrets.HS_PORTAL_USER }}
          HS_PORTAL_PASS: ${{ secrets.HS_PORTAL_PASS }}
          JAHEZ_TOKEN: ${{ secrets.JAHEZ_TOKEN }}
          JAHEZ_STORE_ID: ${{ secrets.JAHEZ_STORE_ID }}
        run: python platform_hours_probe.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          mkdir -p /tmp/keep && cp -r data/platform_hours_probe.json data/hs_portal_device_doom.enc data/hs_plugin /tmp/keep/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp -r /tmp/keep/* data/ 2>/dev/null || true
            git add data/platform_hours_probe.json data/hs_portal_device_doom.enc data/hs_plugin 2>/dev/null || true
            git diff --cached --quiet && exit 0
            git commit -q -m "🕘 اكتشاف مواعيد فروع دوم على المنصات"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
