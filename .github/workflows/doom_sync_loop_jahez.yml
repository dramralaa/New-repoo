# 🔁 14 سبتمبر 2026 - حلقة مزامنة مستقلة تمامًا لجاهز فقط (راجع
# doom_sync_loop_juleb_bridge.yml لشرح فلسفة العزل الكاملة بين التكاملات، وقسم
# "بنية المزامنة المعزولة" في PROJECT_CONTEXT.md). فشل/بطء هنجرستيشن أو جسر
# جوليب **صفر تأثير** على مزامنة جاهز هنا.
name: 🔁 [DOOM] Sync Loop - Jahez (أسعار/أرصدة)

on:
  workflow_dispatch:
  schedule:
    - cron: '20 */4 * * *'

concurrency:
  group: doom-sync-loop-jahez
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pytz requests
      - name: Continuous sync loop (~5.5 ساعة، بيتجدد ذاتيًا بعدها)
        env:
          JAHEZ_TOKEN: ${{ secrets.JAHEZ_TOKEN }}
          JAHEZ_STORE_ID: ${{ secrets.JAHEZ_STORE_ID }}
          JAHEZ_WRITE_ENABLED: ${{ secrets.JAHEZ_WRITE_ENABLED }}
          TELEGRAM_TOKEN_DOOM: ${{ secrets.TELEGRAM_TOKEN_DOOM }}
          TELEGRAM_CHAT_ID_DOOM: ${{ secrets.TELEGRAM_CHAT_ID_DOOM }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          export GIT_EDITOR=true

          START=$(date +%s)
          DURATION=$((340 * 60))
          ITER=0

          run_with_health() {
            local name="$1" script="$2" timeout_sec="$3"
            local outfile="/tmp/${name}_output.log"
            timeout "$timeout_sec" python "$script" > "$outfile" 2>&1
            local code=$?
            if [ $code -eq 0 ]; then
              tail -5 "$outfile"
            else
              echo "⚠️ $name فشل (exit=$code) - آخر 20 سطر من الناتج:"
              tail -20 "$outfile"
            fi
            python sync_health_recorder.py "$name" "$code" "$outfile"
          }

          commit_and_push() {
            git add data/jahez_sync.json data/health/jahez.json 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "لا يوجد تغيير فعلي في هذه الدورة."
              return 0
            fi
            git commit -m "🔁 جاهز - دورة #$ITER ($(date -u +%H:%M) UTC)"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "✅ Push نجح (دورة $ITER، محاولة $i)"
                return 0
              fi
              echo "⚠️ Push فشل (دورة $ITER، محاولة $i) - إعادة محاولة بعد rebase"
              git fetch origin main
              if ! git rebase origin/main; then
                # 🐛 14 سبتمبر 2026 - راجع نفس التعليق في doom_sync_loop_juleb_bridge.yml:
                # تعارض حقيقي على ملفات هذه الحلقة نفسها (مش بس ملف التنبيهات) كان بيوقف
                # الـrebase ويضيّع نتيجة الدورة بصمت. هذه الحلقة الوحيدة اللي بتكتب الملفات
                # دي، فالنسخة المحلية الطازجة (--theirs في rebase = الكوميت المحلي) صحيحة دايمًا.
                git checkout --theirs data/jahez_sync.json data/health/jahez.json 2>/dev/null || true
                git add data/jahez_sync.json data/health/jahez.json 2>/dev/null || true
                git rebase --continue || git rebase --abort
              fi
              sleep $((i * 3))
            done
            echo "::error::فشل push دورة $ITER نهائيًا بعد 5 محاولات - هنكمل باقي اللوب برضه"
          }

          while true; do
            ITER=$((ITER + 1))
            echo "════════ جاهز - دورة رقم $ITER - $(date -u '+%Y-%m-%d %H:%M:%S') UTC ════════"

            run_with_health jahez jahez_sync_run.py 180

            commit_and_push

            NOW=$(date +%s)
            ELAPSED=$((NOW - START))
            if [ $ELAPSED -ge $DURATION ]; then
              echo "انتهت نافذة الـ~5.5 ساعة (${ITER} دورة) - هيتعمل self-relaunch في الخطوة الجاية."
              break
            fi

            H=$(date -u +%H)
            if [ "$H" -ge 23 ] || [ "$H" -lt 6 ]; then
              SLEEP=7200
            else
              SLEEP=1800
            fi
            REMAINING=$((DURATION - ELAPSED))
            if [ $SLEEP -gt $REMAINING ]; then
              SLEEP=$REMAINING
            fi
            echo "نايم $SLEEP ثانية قبل الدورة الجاية..."
            sleep $SLEEP
          done
      - name: Self-relaunch (بدء نافذة ~5.5 ساعة تانية فورًا)
        if: always()
        run: |
          curl -sS -X POST \
            -H "Authorization: token ${{ secrets.CROSS_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/doom_sync_loop_jahez.yml/dispatches" \
            -d '{"ref":"main"}'
