# 🔑 الأسرار المطلوبة هنا (نفس القيم الموجودة في juleb-daily-report):
# CROSS_REPO_TOKEN, JULEB_URL, JULEB_DB, JULEB_USER, JULEB_PASS
#
# ⚡ 12 سبتمبر 2026: مزامنة جاهز (jahez_sync_run.py) وتصدير products.json/
# stock_balance.json اتنقلوا لمسار سريع مستقل (doom_fast_price_stock_sync.yml -
# كل 15 دقيقة نهارًا) عشان تحديث الأسعار/الأرصدة يبقى سريع من غير ما نحمّل جوليب
# بتكرار نفس الاستعلامات هنا كمان. الملف ده فضل بس للاستعلامات الأتقل اللي مفيش
# داعي تسريعها (إيصالات/سكراب/أرشيف مبيعات/نشاط منصات التوصيل...) على جدولتها
# القديمة - claude_data_bridge.py بيقرأ products/stock من القرص (آخر نسخة من
# المسار السريع) بدل ما يعيد استعلامهم من جوليب.
name: 🤖 [DOOM] Claude Data Bridge (كل ساعتين - بيانات ثانوية بطيئة)

on:
  workflow_dispatch:
  schedule:
    # 9 سبتمبر 2026: كان بمعدل مرتين يوميًا بس (5,17) - رُفع لـ6 مرات (كل 4 ساعات).
    # 10 سبتمبر 2026: نُزّل لكل ساعتين بطلب صريح من صاحب المشروع (توحيد تردد جاهز
    # وهنجرستيشن لدوم وفيرا).
    - cron: '0 */2 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pytz
      - name: Export Data Snapshot for Claude
        env:
          JULEB_URL: ${{ secrets.JULEB_URL }}
          JULEB_DB: ${{ secrets.JULEB_DB }}
          JULEB_USER: ${{ secrets.JULEB_USER }}
          JULEB_PASS: ${{ secrets.JULEB_PASS }}
        run: python claude_data_bridge.py
      - name: Build Financial Dashboard Data
        run: python build_financial_dashboard_data.py
      - name: Hungerstation manual-invoice price audit (note-linked orders)
        run: python hungerstation_invoice_price_audit.py
      - name: Commit & Push
        run: |
          git config user.name "Juleb Bot"
          git config user.email "bot@juleb.local"
          git add data/ docs/financial_dashboard_data.json
          git diff --staged --quiet || git commit -m "🤖 تحديث بيانات Claude Data Bridge اليومي"
          git pull --rebase -q
          git push
