# 🔍 12 أكتوبر 2026 - بيانات صنف في كتالوج هنجر العالمي بالباركود (قراءة بس)
name: 🔍 [DOOM HS] بيانات صنف في الكتالوج العالمي (قراءة بس)

on:
  workflow_dispatch:
    inputs:
      items:
        description: 'vendor:code:barcode مفصولة بفاصلة'
        required: false
        default: ''
      items_file:
        description: 'أو ملف قايمة داخل الريبو (data/...json)'
        required: false
        default: ''

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests cryptography pytz pandas openpyxl
      - name: Discover
        env:
          HS_PORTAL_USER: ${{ secrets.HS_PORTAL_USER }}
          HS_PORTAL_PASS: ${{ secrets.HS_PORTAL_PASS }}
          HUNGERSTATION_CLIENT_ID: ${{ secrets.HUNGERSTATION_CLIENT_ID }}
          HUNGERSTATION_CLIENT_SECRET: ${{ secrets.HUNGERSTATION_CLIENT_SECRET }}
          ITEMS: ${{ inputs.items }}
          ITEMS_FILE: ${{ inputs.items_file }}
        run: python hs_master_lookup.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          F=data/hs_master_lookup.json; X=/nonexistent
          [ -f "$F" ] || exit 0
          cp "$F" /tmp/d.json;  cp data/hs_portal_device_doom.enc /tmp/dev.enc 2>/dev/null || true
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/d.json "$F" && git add "$F";  [ -f /tmp/dev.enc ] && cp /tmp/dev.enc data/hs_portal_device_doom.enc && git add data/hs_portal_device_doom.enc
            git diff --cached --quiet && exit 0
            git commit -q -m "🔍 بيانات صنف في كتالوج هنجر"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
