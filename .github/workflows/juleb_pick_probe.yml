# 🔬 9 نوفمبر 2026 - فحص قراءة فقط: استلام دلتا PH004/IN/00106 في الـAPI. سقف 20 طلب.
name: 🔬 [DOOM] فحص استلام دلتا

on:
  workflow_dispatch:

concurrency:
  group: juleb-stock-ledger-shadow
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Diag
        env:
          PLATFORM_PAUSE: ${{ vars.PLATFORM_PAUSE }}
          JULEB_API_KEY: ${{ secrets.JULEB_API_KEY_DOOM }}
          JULEB_API_BASE: https://medova.juleb.com/api/v1
        run: |
          [ -n "$JULEB_API_KEY" ] || { echo "⛔ مفتاح دوم غير موجود"; exit 1; }
          python juleb_pick_probe.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          [ -f data/pick_probe.json ] || exit 0
          cp data/pick_probe.json /tmp/pick_probe.json
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/pick_probe.json data/
            git add data/pick_probe.json
            git diff --cached --quiet && exit 0
            git commit -q -m "🔬 تشخيص دفتر الرصيد [vercel skip]"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
