# 📦 أداة إنتاجية دائمة (مش لمرة واحدة): سحب طلبية استلام دوم أو كل الطلبيات
# المعلّقة (لسه مش Done) كملف Excel - حل لعدم وجود زرار تصدير في جوليب. النتيجة
# بتتكتب في data/receipt_inventory_pull.xlsx على juleb-daily-report (يتكتب فوق
# نفسه كل تشغيلة - مش تراكمي).
name: 📦 [DOOM] سحب جرد طلبية استلام (Excel)

on:
  workflow_dispatch:
    inputs:
      picking_name:
        description: 'اسم طلبية معيّنة (زي WH/IN/00227) - أو فاضي = كل طلبيات الاستلام المعلّقة (لسه مش Done)'
        required: false
        default: ''

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pandas openpyxl
      - name: Pull receipt inventory
        env:
          JULEB_URL: ${{ secrets.JULEB_URL }}
          JULEB_DB: ${{ secrets.JULEB_DB }}
          JULEB_USER: ${{ secrets.JULEB_USER }}
          JULEB_PASS: ${{ secrets.JULEB_PASS }}
          PICKING_NAME: ${{ github.event.inputs.picking_name }}
        run: python doom_pull_receipt_inventory.py
      - name: Commit and push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          export GIT_EDITOR=true
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          git add data/receipt_inventory_pull.xlsx
          if git diff --cached --quiet; then
            echo "لا يوجد تغيير."
            exit 0
          fi
          git commit -m "📦 نتيجة سحب جرد طلبية استلام"
          for i in 1 2 3 4 5; do
            if timeout 60 git push origin HEAD:main; then
              exit 0
            fi
            timeout 60 git fetch origin main
            if ! git rebase origin/main; then
              git checkout --theirs data/receipt_inventory_pull.xlsx 2>/dev/null || true
              git add data/receipt_inventory_pull.xlsx 2>/dev/null || true
              git rebase --continue || git rebase --abort
            fi
            sleep $((i * 3))
          done
          echo "::error::فشل push النتيجة بعد 5 محاولات"
