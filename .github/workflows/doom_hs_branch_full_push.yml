# 🚦 29 أكتوبر 2026: بقى طلب واحد بكل الكتالوج (مش دفعات) + خانة تأكيد - تحذير هنجر من حظر الـIP (HS_API_RULES.md)
# 📦 19 أكتوبر 2026 - بوش كامل (Bulk Update) لفرع دوم واحد على هنجرستيشن قبل الخروج لايف - يدوي فقط بطلب صاحب المشروع
name: 📦 [DOOM HS] بوش كامل لفرع واحد (يدوي)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'رقم فرع دوم (3 = الملك فهد)'
        required: true
        default: '3'
      push_unlinked_inactive:
        description: '1 = أي SKU مش مربوط بجوليب يتبعت غير نشط (عشان العدد يطابق الكتالوج)'
        required: false
        default: '1'
      confirm:
        description: 'اكتب PUSH للتأكيد - البوش الكامل بطلب هنجر أو موافقة صاحب المشروع بس (HS_API_RULES.md)'
        required: true
        default: ''

concurrency:
  group: doom-hs-branch-full-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 🚦 تأكيد (شروط هنجر 29 أكتوبر 2026 - طلب واحد، والبوش الكامل مش روتين)
        if: github.event.inputs.confirm != 'PUSH'
        run: |
          echo "البوش الكامل متوقف: لازم تكتب PUSH في خانة التأكيد (HS_API_RULES.md)"
          exit 1
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Full push
        env:
          JULEB_URL: ${{ secrets.JULEB_URL }}
          JULEB_DB: ${{ secrets.JULEB_DB }}
          JULEB_USER: ${{ secrets.JULEB_USER }}
          JULEB_PASS: ${{ secrets.JULEB_PASS }}
          HUNGERSTATION_CLIENT_ID: ${{ secrets.HUNGERSTATION_CLIENT_ID }}
          HUNGERSTATION_CLIENT_SECRET: ${{ secrets.HUNGERSTATION_CLIENT_SECRET }}
          FULL_PUSH: '1'
          ONLY_BRANCH: ${{ github.event.inputs.branch }}
          PUSH_UNLINKED_INACTIVE: ${{ github.event.inputs.push_unlinked_inactive }}
        run: python hungerstation_stock_sync.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          mkdir -p /tmp/keep && cp data/hungerstation_full_push_branch*.json /tmp/keep/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/keep/* data/ 2>/dev/null || true
            git add data/hungerstation_full_push_branch*.json 2>/dev/null || true
            git diff --cached --quiet && exit 0
            git commit -q -m "📦 نتيجة بوش كامل لفرع دوم على هنجرستيشن"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
