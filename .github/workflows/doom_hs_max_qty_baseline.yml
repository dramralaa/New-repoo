name: 📖 [DOOM] قراءة حدود الكمية الأصلية من هنجرستيشن (يدوي)

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Optional - leave empty: the server logs in by itself (trusted device)'
        required: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Load token from event file (masked - never printed)
        run: |
          T=$(jq -r '.inputs.token // .inputs.hs_token // .client_payload.token // empty' "$GITHUB_EVENT_PATH")
          if [ -n "$T" ]; then echo "::add-mask::$T"; echo "HS_TOKEN=$T" >> "$GITHUB_ENV"; fi
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pytz
      - name: Server portal session (no browser token needed)
        if: env.HS_TOKEN == ''
        env:
          HS_PORTAL_USER: ${{ secrets.HS_PORTAL_USER }}
          HS_PORTAL_PASS: ${{ secrets.HS_PORTAL_PASS }}
          VERA_HS_PORTAL_USER: ${{ secrets.VERA_HS_PORTAL_USER }}
          VERA_HS_PORTAL_PASS: ${{ secrets.VERA_HS_PORTAL_PASS }}
          HS_ACCOUNT: DOOM
        run: |
          pip install -q cryptography
          python - <<'PY'
          import os, hs_portal_session as s
          t = s.session(os.environ["HS_ACCOUNT"])
          if not t:
              raise SystemExit("server login to the HS portal failed - run hs_portal_bootstrap (check)")
          a = t["access_token"]
          print("::add-mask::" + a)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("HS_TOKEN=" + a + "\n")
          print("server session ok")
          PY
      - name: Read original limits (read-only)
        run: python doom_hs_max_qty_baseline.py
      - name: Commit result
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          F=data/doom_hs_max_qty_baseline.json
          cp "$F" /tmp/b.json
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/b.json "$F" && git add "$F"
            git diff --cached --quiet && exit 0
            git commit -q -m "📖 حدود الكمية الأصلية - هنجرستيشن دوم [vercel skip]"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
