# 📖 3 أكتوبر 2026 - قراءة فقط: الحد الأقصى الأصلي لكمية الأوردر على هنجرستيشن دوم (النسيم + لبن)
# التوكن من بوابة تاجر هنجرستيشن دوم (قصير العمر، مش بيتخزّن). وجود الناتج بيشغّل حد الكمية في مزامنة دوم.
name: 📖 [DOOM] قراءة حدود الكمية الأصلية من هنجرستيشن (يدوي)

on:
  workflow_dispatch:
    inputs:
      token:
        description: "توكن بوابة تاجر هنجرستيشن دوم (من غير كلمة Bearer)"
        required: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mask token
        run: echo "::add-mask::${{ inputs.token }}"
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pytz
      - name: Read original limits (read-only)
        env:
          HS_TOKEN: ${{ inputs.token }}
        run: python doom_hs_max_qty_baseline.py
      - name: Commit result
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          F=data/doom_hs_max_qty_baseline.json
          cp "$F" /tmp/b.json
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/b.json "$F" && git add "$F"
            git diff --cached --quiet && exit 0
            git commit -q -m "📖 حدود الكمية الأصلية - هنجرستيشن دوم"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
