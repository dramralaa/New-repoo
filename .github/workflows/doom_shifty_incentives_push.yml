name: workflow-doom_shifty_incentives_push

on:
  workflow_dispatch:
    inputs:
      intraday:
        description: '1 = النهارده لحد الساعة من مخزن LIVE (كل ساعة)، فاضي = تقفيل لحد أمس'
        default: ''
  schedule:
    - cron: '1 21 * * *'
    - cron: '31 22 * * *'
    - cron: '31 0 * * *'
    - cron: '31 2 * * *'

concurrency:
  group: doom-shifty-incentives-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: claude/assortment-webhook-discovery-a4mxc6
          path: dash
          sparse-checkout: |
            doom_trial_report
            data/rest_store/pos_store.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests cryptography pytz
      - name: Push incentives to Shifty
        env:
          LOG_GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          JULEB_URL: ${{ secrets.JULEB_URL }}
          JULEB_DB: ${{ secrets.JULEB_DB }}
          JULEB_USER: ${{ secrets.JULEB_USER }}
          JULEB_PASS: ${{ secrets.JULEB_PASS }}
          HS_PORTAL_PASS: ${{ secrets.HS_PORTAL_PASS }}
          TARGETS_GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          # التشغيل اليدوي بيتجاوز حارس "محدّث لحد أمس" (بعد تغيير تارجت أو أرقام)؛ الجدولة تفضل بالحارس
          INCENTIVES_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          INCENTIVES_INTRADAY: ${{ inputs.intraday }}
        run: python silent_run.py shifty_incentives_push.py
