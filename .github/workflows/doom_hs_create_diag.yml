name: 🔍 [DOOM HS] تشخيص فشل إنشاء الأصناف (قراءة بس - طلب قراءة واحد)

on:
  workflow_dispatch:

concurrency:
  group: hs-catalog-write
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests cryptography pytz pandas openpyxl
      - name: Diagnose
        env:
          LOG_GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          HS_PORTAL_USER: ${{ secrets.HS_PORTAL_USER }}
          HS_PORTAL_PASS: ${{ secrets.HS_PORTAL_PASS }}
        run: python doom_hs_create_diag.py | sed -E 's/[A-Za-z0-9_-]{40,}/<redacted>/g'
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          F=data/doom_hs_create_diag.json; [ -f "$F" ] || exit 0
          cp "$F" /tmp/r.json; cp data/hs_portal_device_doom.enc /tmp/d.enc 2>/dev/null || true
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/r.json "$F" && git add "$F"; [ -f /tmp/d.enc ] && cp /tmp/d.enc data/hs_portal_device_doom.enc && git add data/hs_portal_device_doom.enc
            git diff --cached --quiet && exit 0
            git commit -q -m "🔍 تشخيص فشل إنشاء أصناف دوم على هنجر [vercel skip]"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
