name: 🔎 حالة حوافز شيفتي (قراءة فقط)

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

concurrency:
  group: shifty-incentives-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests cryptography
      - name: Read status
        env:
          HS_PORTAL_PASS: ${{ secrets.HS_PORTAL_PASS }}
          LOG_GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: python silent_run.py shifty_status_probe.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          cp data/health/shifty_incentives_status.json /tmp/si.json 2>/dev/null || exit 0
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            mkdir -p data/health && cp /tmp/si.json data/health/shifty_incentives_status.json && git add data/health/shifty_incentives_status.json
            git diff --cached --quiet && exit 0
            git commit -q -m "🔎 حالة حوافز شيفتي [vercel skip]"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
