# 🧾 20 أكتوبر 2026 - تدقيق إقرار ضريبة القيمة المضافة لدوم - الربع الثالث 2026 (قراءة بس من جوليب)
name: 🧾 [DOOM] تدقيق إقرار الضريبة (قراءة بس)

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Audit
        env:
          JULEB_URL: ${{ secrets.JULEB_URL }}
          JULEB_DB: ${{ secrets.JULEB_DB }}
          JULEB_USER: ${{ secrets.JULEB_USER }}
          JULEB_PASS: ${{ secrets.JULEB_PASS }}
        run: python doom_vat_q3_audit.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          mkdir -p /tmp/keep && cp data/doom_vat_q3_audit.json /tmp/keep/ 2>/dev/null || exit 0
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/keep/doom_vat_q3_audit.json data/
            git add data/doom_vat_q3_audit.json
            git diff --cached --quiet && exit 0
            git commit -q -m "🧾 تدقيق إقرار الضريبة - الربع الثالث"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
