# 🔎 5 نوفمبر 2026 - فحص الـ API الرسمي لجوليب (يدوي، قراءة فقط): توثيق + مصفوفة الصلاحيات. بدون أي مفتاح/بيانات في اللوج أو الملف الناتج.
# الأسرار المطلوبة (تتحط من صاحب الحساب في Settings → Secrets → Actions): JULEB_API_KEY_DOOM و/أو JULEB_API_KEY_VERA. من غيرها بيسحب التوثيق بس.
name: 🔎 [JULEB API] فحص الصلاحيات (يدوي - قراءة فقط)

on:
  workflow_dispatch:
    inputs:
      brand:
        description: "doom أو vera"
        required: true
        default: "doom"
      mode:
        description: "probe (توثيق + صلاحيات) أو explore (استكشاف الرصيد والفلتر)"
        required: false
        default: "probe"

concurrency:
  group: juleb-api-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Select brand key (strict - no cross-brand fallback)
        env:
          BRAND: ${{ github.event.inputs.brand }}
          DOOM_KEY: ${{ secrets.JULEB_API_KEY_DOOM }}
          VERA_KEY: ${{ secrets.JULEB_API_KEY_VERA }}
        run: |
          case "$BRAND" in
            doom) K="$DOOM_KEY"; B="https://medova.juleb.com/api/v1" ;;
            vera) K="$VERA_KEY"; B="https://phvera.juleb.com/api/v1" ;;
            *) echo "brand لازم doom أو vera"; exit 1 ;;
          esac
          [ -n "$K" ] || { echo "⛔ مفتاح $BRAND غير موجود في Secrets - توقف قبل أي اتصال"; exit 1; }
          echo "::add-mask::$K"
          echo "JULEB_API_KEY=$K" >> "$GITHUB_ENV"
          echo "JULEB_API_BASE=$B" >> "$GITHUB_ENV"
          echo "PROBE_BRAND=$BRAND" >> "$GITHUB_ENV"
          echo "EXPLORE_SET=${{ github.event.inputs.mode == 'explore2' && '2' || '' }}" >> "$GITHUB_ENV"
      - name: Probe
        run: python ${{ github.event.inputs.mode == 'validate' && 'juleb_api_stock_validate.py' || (github.event.inputs.mode == 'explore' || github.event.inputs.mode == 'explore2') && 'juleb_api_explore.py' || 'juleb_api_probe.py' }}
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          mkdir -p /tmp/out && cp -r data/juleb_api /tmp/out/ 2>/dev/null || exit 0
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            mkdir -p data && cp -r /tmp/out/juleb_api data/
            git add data/juleb_api
            if git diff --cached --quiet; then echo "لا تغيير"; exit 0; fi
            git commit -q -m "🔎 تقرير فحص API جوليب ${{ github.event.inputs.brand }} [vercel skip]"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
