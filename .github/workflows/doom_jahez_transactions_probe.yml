# 🔍 20 سبتمبر 2026 - أداة تشخيصية لمرة واحدة: فحص شكل استجابة تعويضات/خصومات
# جاهز (/portal/stores/{store}/transactions) الحقيقي، تمهيدًا لبناء صفحة "متابعة
# اداء منصات التوصيل". بتستخدم JAHEZ_TOKEN الدائم (سر مسجّل بالفعل) - مفيش توكن
# مؤقت مطلوب. تُحذف هي والـworkflow ده بعد الاستخدام.
name: 🔍 [DOOM] فحص شكل تعويضات جاهز (يدوي، لمرة واحدة)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Probe transactions endpoint
        env:
          JAHEZ_TOKEN: ${{ secrets.JAHEZ_TOKEN }}
          JAHEZ_STORE_ID: ${{ secrets.JAHEZ_STORE_ID }}
        run: python jahez_transactions_probe.py
      - name: Commit and push result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          export GIT_EDITOR=true
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          git add data/jahez_transactions_probe_result.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "لا يوجد تغيير."
            exit 0
          fi
          git commit -m "🔍 نتيجة فحص شكل تعويضات جاهز"
          timeout 60 git push origin HEAD:main || (timeout 60 git fetch origin main && git rebase origin/main && timeout 60 git push origin HEAD:main)
