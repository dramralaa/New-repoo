# 📜 27 أكتوبر 2026 - هيستوري عروض جاهز (دوم + فيرا) كل ساعة - قراءة فقط من جاهز، بيكتب data/jahez_offers_history.json
name: 📜 هيستوري عروض جاهز (دوم + فيرا) - كل ساعة، قراءة فقط

on:
  workflow_dispatch:
  schedule:
    - cron: '41 * * * *'

concurrency:
  group: jahez-offers-history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pytz
      - name: Snapshot offers
        env:
          JAHEZ_TOKEN: ${{ secrets.JAHEZ_TOKEN }}
          JAHEZ_STORE_ID: ${{ secrets.JAHEZ_STORE_ID }}
          VERA_JAHEZ_TOKEN: ${{ secrets.VERA_JAHEZ_TOKEN }}
          VERA_JAHEZ_STORE_ID: ${{ secrets.VERA_JAHEZ_STORE_ID }}
        run: python jahez_offers_history.py
      - name: Commit and push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git
          F=data/jahez_offers_history.json
          cp "$F" /tmp/hist.json
          for i in 1 2 3 4 5; do
            timeout 60 git fetch origin main && git reset -q --hard origin/main
            cp /tmp/hist.json "$F"
            git add "$F"
            if git diff --cached --quiet; then echo "لا يوجد تغيير."; exit 0; fi
            git commit -q -m "📜 هيستوري عروض جاهز"
            timeout 60 git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
