# 📥 يسحب كتالوج متجر Shopify كامل (sidalih.com بشكل افتراضي) عبر /products.json
# ويطابقه بالباركود مع كل أصناف دوم الناقصة (بدون حد أقصى) - أدق وأشمل من
# البحث صنف-صنف. قراءة عامة + كتابة لـdoom-product-images بس - صفر مخاطرة على
# كتالوج جاهز الحي. يدوي، مفيش جدولة. الأسرار المطلوبة: CROSS_REPO_TOKEN
name: 📥 [DOOM] Fetch Shopify Catalog Dump (يدوي)

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'دومين متجر Shopify (افتراضي sidalih.com)'
        required: false
        default: 'sidalih.com'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: juleb-daily-report
      - name: Checkout doom-product-images
        uses: actions/checkout@v4
        with:
          repository: dramralaa/doom-product-images
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: doom-product-images
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Fetch and match catalog
        working-directory: juleb-daily-report
        env:
          IMAGES_REPO_PATH: ${{ github.workspace }}/doom-product-images
          SHOPIFY_DOMAIN: ${{ github.event.inputs.domain }}
        run: python jahez_fetch_shopify_catalog_dump.py
      - name: Commit result report to juleb-daily-report
        working-directory: juleb-daily-report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jahez_shopify_dump_fetch_result.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "📥 نتيجة سحب ومطابقة كتالوج Shopify"
          git push https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git HEAD:main
      - name: Commit new images to doom-product-images
        working-directory: doom-product-images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add by_juleb_code/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "📥 صور جديدة من مطابقة كتالوج Shopify (sidalih)"
          git push https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/doom-product-images.git HEAD:$(git rev-parse --abbrev-ref HEAD)
