# 🧮 يحسب (قراءة فقط) المبلغ الدقيق المفقود من مبيعات الليستات والعمولة لنفلة
# سبتمبر 2026 - عشان يُضاف كتصحيح موثّق داخل تقارير ستريم لايت بس، بدون أي كتابة
# على جوليب. الأسرار المطلوبة: CROSS_REPO_TOKEN, JULEB_URL, JULEB_DB, JULEB_USER,
# JULEB_PASS
name: 🧮 [DOOM] Calc Naflah Missing Commission (يدوي)

on:
  workflow_dispatch:

jobs:
  calc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          ref: claude/assortment-webhook-discovery-a4mxc6
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pytz
      - name: Calculate missing commission
        env:
          JULEB_URL: ${{ secrets.JULEB_URL }}
          JULEB_DB: ${{ secrets.JULEB_DB }}
          JULEB_USER: ${{ secrets.JULEB_USER }}
          JULEB_PASS: ${{ secrets.JULEB_PASS }}
        run: python juleb_calc_naflah_missing_commission.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/juleb_naflah_missing_commission_calc.json
          git diff --cached --quiet || git commit -m "🧮 حساب عمولة نفلة المفقودة (قراءة فقط)"
          git push https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git HEAD:claude/assortment-webhook-discovery-a4mxc6
