# 🎯 مطابقة اسمية بين أصناف دوم الناقصة صورة وكتالوج فرع هنجرستيشن المستخرج
# (hungerstation_extracted_catalog.json) - قبول تلقائي للأدوية بس لو تشابه
# عالي جدًا وكل الجرعات/الوحدات مطابقة، وغير كده مراجعة يدوية. كتابة لـ
# doom-product-images بس - صفر مخاطرة على كتالوج جاهز الحي. يدوي، مفيش جدولة.
# الأسرار المطلوبة: CROSS_REPO_TOKEN
name: 🎯 [DOOM] Hungerstation Match & Fetch Images (يدوي)

on:
  workflow_dispatch:

jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: juleb-daily-report
      - name: Checkout doom-product-images
        uses: actions/checkout@v4
        with:
          repository: dramralaa/doom-product-images
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: doom-product-images
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Match and fetch images
        working-directory: juleb-daily-report
        env:
          IMAGES_REPO_PATH: ${{ github.workspace }}/doom-product-images
        run: python hungerstation_match_and_fetch_images.py
      - name: Commit result report to juleb-daily-report
        working-directory: juleb-daily-report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hungerstation_match_result.json data/hungerstation_manual_review.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "🎯 نتيجة مطابقة أسماء هنجرستيشن"
          git push https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git HEAD:main
      - name: Commit new images to doom-product-images
        working-directory: doom-product-images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add by_juleb_code/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "🎯 صور جديدة من مطابقة أسماء هنجرستيشن"
          git push https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/doom-product-images.git HEAD:$(git rev-parse --abbrev-ref HEAD)
