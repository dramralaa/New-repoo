name: 🔍 [DOOM] Recheck+safety-deactivate SKU 0000006663 (manual, one-off)

on:
  workflow_dispatch:

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Recheck + safety deactivate if needed
        env:
          HUNGERSTATION_CLIENT_ID: ${{ secrets.HUNGERSTATION_CLIENT_ID }}
          HUNGERSTATION_CLIENT_SECRET: ${{ secrets.HUNGERSTATION_CLIENT_SECRET }}
        run: python hungerstation_recheck_sku_0000006663.py
      - name: Commit result back
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/recheck_sku_0000006663_result.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "🔍 إعادة فحص الصنف 0000006663 بعد التصحيح" && git pull --rebase && git push)
