# 🔬 يتحقق هل PUT قادرة تصلّح تصنيف صنف بعد إنشائه (اختبار ادّعاء Gemini إن التصنيف
# ثابت للأبد بعد الإنشاء - الادّعاء ده لسه غير مُتحقَّق منه ومبنيّ على تحليل ناقص).
# يدوي بالكامل، مفيش جدولة.
# الأسرار المطلوبة: CROSS_REPO_TOKEN, JAHEZ_TOKEN, JAHEZ_STORE_ID
name: 🔬 [DOOM] Jahez Category Fix Diagnosis (يدوي)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Diagnose category fix via PUT
        env:
          JAHEZ_TOKEN: ${{ secrets.JAHEZ_TOKEN }}
          JAHEZ_STORE_ID: ${{ secrets.JAHEZ_STORE_ID }}
        run: python jahez_diagnose_category_fix.py
      - name: Commit probe result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jahez_category_fix_probe.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "🔬 نتيجة فحص تصحيح التصنيف عبر PUT"
          git push https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git HEAD:main
