name: 🩹 [DOOM] Hide Bad-Image Item 0000006663 (manual, one-off)

on:
  workflow_dispatch:

jobs:
  hide:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report (branch)
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          ref: claude/assortment-webhook-discovery-a4mxc6
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Hide item on Hungerstation + Jahez
        env:
          HUNGERSTATION_CLIENT_ID: ${{ secrets.HUNGERSTATION_CLIENT_ID }}
          HUNGERSTATION_CLIENT_SECRET: ${{ secrets.HUNGERSTATION_CLIENT_SECRET }}
          JAHEZ_TOKEN: ${{ secrets.JAHEZ_TOKEN }}
          JAHEZ_STORE_ID: ${{ secrets.JAHEZ_STORE_ID }}
        run: python hungerstation_jahez_hide_bad_image_item_10sep.py
      - name: Commit result back
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hide_bad_image_item_10sep_result.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "🩹 نتيجة إخفاء الصنف 0000006663 (صورة/اسم غلط)" && git pull --rebase && git push)
