# Read-only audit of our own Hungerstation store: classifies every product by
# (real Juleb SKU vs legacy non-Juleb master) x (active vs inactive), to
# answer whether any legacy items are currently active before considering
# deleting them. No writes to Hungerstation at all. Required secret:
# CROSS_REPO_TOKEN.
name: HS Audit Store Products (manual)

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Live Bearer token from partner-app.hungerstation.com (short-lived, not stored)'
        required: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Audit store products
        env:
          HS_TOKEN: ${{ github.event.inputs.token }}
        run: python hungerstation_audit_store_products.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hungerstation_store_audit_result.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Hungerstation store audit result"
          git push https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git HEAD:main
