# فحص قراءة فقط قبل كتابة تصنيف Antibiotic/CNS في j_category_3 على جوليب -
# راجع juleb_probe_rx_category_write.py في juleb-daily-report. Checkout
# للـbranch مباشرة (السكريبت لسه مش على main).
name: Juleb Probe RX Category Write (manual)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report (branch)
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          ref: claude/assortment-webhook-discovery-a4mxc6
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Probe
        env:
          JULEB_URL: ${{ secrets.JULEB_URL }}
          JULEB_DB: ${{ secrets.JULEB_DB }}
          JULEB_USER: ${{ secrets.JULEB_USER }}
          JULEB_PASS: ${{ secrets.JULEB_PASS }}
        run: python juleb_probe_rx_category_write.py
      - name: Commit result back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rx_category_write_probe_result.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "Record RX category write probe result" && git push)
