# Fetch the real Hungerstation category tree for our vendor store (186329) -
# used to build a sensible fallback category instead of guessing a random id.
# Required secret: CROSS_REPO_TOKEN.
name: HS Fetch Categories (manual)

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Live Bearer token from partner-app.hungerstation.com (short-lived, not stored)'
        required: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Fetch categories
        env:
          HS_TOKEN: ${{ github.event.inputs.token }}
        run: python hungerstation_fetch_categories.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hungerstation_categories.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Hungerstation category tree dump"
          git push https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git HEAD:main
