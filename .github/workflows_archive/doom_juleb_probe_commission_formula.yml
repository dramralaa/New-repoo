# 🔍 يجيب أمثلة حقيقية من سطور سالم بعمولة فعلية عشان نتأكد من صيغة حساب
# p_commission_total بالظبط قبل أي تصحيح رجعي لسطور نفلة. قراءة فقط. الأسرار
# المطلوبة: CROSS_REPO_TOKEN, JULEB_URL, JULEB_DB, JULEB_USER, JULEB_PASS
name: 🔍 [DOOM] Juleb Probe Commission Formula (يدوي)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          ref: claude/assortment-webhook-discovery-a4mxc6
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pytz
      - name: Probe commission formula
        env:
          JULEB_URL: ${{ secrets.JULEB_URL }}
          JULEB_DB: ${{ secrets.JULEB_DB }}
          JULEB_USER: ${{ secrets.JULEB_USER }}
          JULEB_PASS: ${{ secrets.JULEB_PASS }}
        run: python juleb_probe_commission_formula.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/juleb_commission_formula_probe.json
          git diff --cached --quiet || git commit -m "🔍 نتيجة فحص صيغة حساب العمولة"
          git push https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git HEAD:claude/assortment-webhook-discovery-a4mxc6
