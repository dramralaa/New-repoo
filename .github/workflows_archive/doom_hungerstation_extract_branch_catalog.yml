# 📦 استخراج فعلي لكاتالوج فرع هنجرستيشن (اسم + صورة + sku داخلي) من الصفحات
# العامة SSR - قراءة فقط، صفر مخاطرة. يدوي بالكامل، مفيش جدولة.
# الأسرار المطلوبة: CROSS_REPO_TOKEN
name: 📦 [DOOM] Hungerstation Extract Branch Catalog (يدوي)

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Extract Hungerstation branch catalog
        run: python hungerstation_extract_branch_catalog.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hungerstation_extracted_catalog.json
          git diff --cached --quiet || git commit -m "📦 استخراج كاتالوج فرع هنجرستيشن"
          git push https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/dramralaa/juleb-daily-report.git HEAD:main
