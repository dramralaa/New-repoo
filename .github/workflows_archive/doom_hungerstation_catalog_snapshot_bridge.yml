# 🔑 الأسرار المطلوبة هنا (نفس القيم الموجودة فعليًا في New-repoo، مؤكدة شغالة
# لايف 9 سبتمبر 2026): CROSS_REPO_TOKEN, HUNGERSTATION_CLIENT_ID, HUNGERSTATION_CLIENT_SECRET
#
# ليه ده بديل لـ hungerstation_catalog_snapshot.yml (اللي في juleb-daily-report نفسه)؟
# اتأكد فعليًا (9 سبتمبر 2026) إن secrets.HUNGERSTATION_CLIENT_ID/SECRET في ريبو
# juleb-daily-report غير متزامنين مع القيم الحقيقية الشغالة (تشغيلته دايمًا بترجع
# 400 invalid_client) - بينما نفس التوكن (DOOMAPI) شغال 100% لما بيتقرا من أسرار
# New-repoo (نفس القناة اللي بيستخدمها doom_hungerstation_partner_api_probe.yml
# بنجاح). الحل: بدل ما نطلب من صاحب المشروع يزامن سيكريتين يدويًا بين ريبوهين،
# بنستخدم نفس نمط "جسر Actions المجاني" المعتمد بالفعل لباقي الأتمتة (Checkout
# juleb-daily-report بـCROSS_REPO_TOKEN، تشغيل بأسرار New-repoo، Push النتيجة رجوع).
name: HS Catalog Snapshot (via New-repoo bridge, manual)

on:
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juleb-daily-report
        uses: actions/checkout@v4
        with:
          repository: dramralaa/juleb-daily-report
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Fetch full DOOM Hungerstation catalog (paginated correctly)
        env:
          HUNGERSTATION_CLIENT_ID: ${{ secrets.HUNGERSTATION_CLIENT_ID }}
          HUNGERSTATION_CLIENT_SECRET: ${{ secrets.HUNGERSTATION_CLIENT_SECRET }}
        run: python hungerstation_partner_catalog_snapshot.py
      - name: Commit snapshot back to juleb-daily-report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hungerstation_partner_catalog_snapshot.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "Update DOOM Hungerstation catalog snapshot (via New-repoo bridge)" && git push)
